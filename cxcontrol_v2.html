  }

  return `<div class="page">
    ${pageH(
      'Phase reference',
      `The canonical commissioning taxonomy. Every asset moves through these phases — but different companies own different phases. The <b>trade language</b> column shows what trades actually call the work; the L2.0x label is the formal commissioning sub-phase tag.`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Two languages for the same work.</b> A trade thinks "I'm doing the rough-in." The GC QA/QC thinks "we're at L2.01." The platform shows you both so trades stay in their language while the GC tracks the formal phase progression.
    </div>

    <div class="section-h"><span>L1 · Factory Acceptance</span></div>
    ${PHASE_REFERENCE.L1.map(renderPhaseRow).join('')}

    <div class="section-h" style="margin-top:24px"><span>L2 · Field installation & pre-functional</span></div>
    ${PHASE_REFERENCE.L2.map(renderPhaseRow).join('')}

    <div class="section-h" style="margin-top:24px"><span>L3 · Energization</span></div>
    ${PHASE_REFERENCE.L3.map(renderPhaseRow).join('')}

    <div class="section-h" style="margin-top:24px"><span>L4 · Functional / Load Bank</span></div>
    ${PHASE_REFERENCE.L4.map(renderPhaseRow).join('')}

    <div class="section-h" style="margin-top:24px"><span>L5 · Integrated Systems Test</span></div>
    ${PHASE_REFERENCE.L5.map(renderPhaseRow).join('')}

    <div style="margin-top:24px; padding:16px 18px; background:var(--bg-soft); border-radius:10px">
      <div class="kicker" style="margin-bottom:10px">OFCI vs CFCI — who does L2.05b?</div>
      <div style="font-size:13px; color:var(--text-soft); line-height:1.65">
        <b>OFCI</b> (Owner-Furnished, Contractor-Installed): the owner buys the equipment and the trade installs it. The trade also does the L2.05b vendor pre-energization since they handled installation.<br><br>
        <b>CFCI</b> (Contractor-Furnished, Contractor-Installed): the contractor procures and installs. The OEM/vendor does L2.05b under their warranty obligations.<br><br>
        Most UPS, generators, and switchgear are CFCI on hyperscale builds — so the OEM (Delta, CAT, ABB) does L2.05b. Some large breakers and transformers are OFCI — trade does L2.05b.
      </div>
    </div>

    <div style="margin-top:18px; padding:16px 18px; background:var(--bg-soft); border-radius:10px">
      <div class="kicker" style="margin-bottom:10px">Pigtail rule (load bank)</div>
      <div style="font-size:13px; color:var(--text-soft); line-height:1.65">
        Load bank pigtails can be attached <b>any time during L2</b> while the asset is cold. <b>They MUST be staged before L3 energization.</b> Once an asset is energized at L3, it is <b>never</b> de-energized to attach pigtails. The L4 load bank then runs immediately after L3.06 (vendor PFC) without needing to power-cycle. Applies to UPS, GEN, ATS, STS, MV-LV switchgear, and PDU.
      </div>
    </div>

function openComposeModal(prefill) {
  closeDropdown();
  const p = me(), co = myCompany();
  const isGC = canApprovePost();

  state.composeData = {
    state: prefill?.state || 'pending_review',
    subject: prefill?.subject || '',
    body: prefill?.body || '',
    toCompany: null,
  };

  // Default state: GC starts on "publish direct"; everyone else starts on "submit to GC"
  if (!prefill && isGC) state.composeData.state = 'published';

  let h = `<div class="modal lg">
    <div class="modal-h">
      <div>
        <h2>📢 New post</h2>
        <div class="sub">Posting as <b>${esc(p.name)}</b> · ${esc(co.name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-b">
      <label class="lbl">Where should this go? <span class="req">*</span></label>
      <div class="workflow-options" id="wf-opts">

        <div class="wf-option ${state.composeData.state === 'internal' ? 'selected' : ''}" data-wfstate="internal">
          <div class="wf-ic" style="background:var(--purple-soft); color:#5b21b6">🏢</div>
          <div class="wf-body">
            <div class="wf-name">My company internal</div>
            <div class="wf-desc">Stays inside <b>${esc(co.name)}</b>. Not seen by any other company. Use for internal coordination, rotation, labor planning.</div>
          </div>
          <div class="wf-radio"></div>
        </div>

        ${!isGC ? `
        <div class="wf-option ${state.composeData.state === 'pending_review' ? 'selected' : ''}" data-wfstate="pending_review">
          <div class="wf-ic" style="background:var(--accent-soft); color:#92400e">⏳</div>
          <div class="wf-body">
            <div class="wf-name">Submit to GC for project-wide review <span class="tag amber" style="margin-left:6px">RECOMMENDED</span></div>
            <div class="wf-desc">Goes to <b>HITT (GC PM)</b> for review. They review internally and publish to all companies on this project if approved. Track status in the "Pending GC review" tab.</div>
          </div>
          <div class="wf-radio"></div>
        </div>
        ` : `
        <div class="wf-option ${state.composeData.state === 'published' ? 'selected' : ''}" data-wfstate="published">
          <div class="wf-ic" style="background:var(--green-soft); color:#166534">📢</div>
          <div class="wf-body">
            <div class="wf-name">Publish project-wide directly <span class="tag green" style="margin-left:6px">GC POWER</span></div>
            <div class="wf-desc">Broadcast immediately to <b>all companies on ${esc(proj().code)}</b>. As GC PM, you can skip the review queue.</div>
          </div>
          <div class="wf-radio"></div>
        </div>
        `}

        <div class="wf-option ${state.composeData.state === 'direct' ? 'selected' : ''}" data-wfstate="direct">
          <div class="wf-ic" style="background:var(--teal-soft); color:#0f766e">🤝</div>
          <div class="wf-body">
            <div class="wf-name">Direct message to specific company</div>
            <div class="wf-desc">Private message to one other company. Only ${esc(co.name)} and the recipient see it.</div>
            <select class="inp" id="wf-tocompany" style="margin-top:8px; max-width:280px" onchange="state.composeData.toCompany = this.value">
              <option value="">— Pick a company —</option>
              ${Object.values(COMPANIES).filter(c => c.id !== co.id).map(c => `<option value="${c.id}">${esc(c.name)} (${esc(c.label)})</option>`).join('')}
            </select>

      <label class="lbl">Body <span class="req">*</span></label>

      <div id="wf-explainer" style="margin-top:14px; padding:12px 14px; background:var(--bg-soft); border-radius:8px; font-size:12px; color:var(--text-soft); line-height:1.55"></div>

  document.querySelectorAll('#wf-opts .wf-option').forEach(b => {
    b.onclick = (e) => {

      document.querySelectorAll('#wf-opts .wf-option').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');

function updateComposeButton() {
  const btn = document.getElementById('wf-submit-btn');
  const explainer = document.getElementById('wf-explainer');
  if (!btn) return;
  const s = state.composeData.state;
  const co = myCompany();
  const map = {
    internal:        { btn:'🏢 Save internally',           expl:`This will be saved as an internal post at <b>${esc(co.name)}</b>. Only people at ${esc(co.name)} see it.` },
    pending_review:  { btn:'⏳ Submit to GC',               expl:`This will go to <b>HITT (GC PM)</b> for review. They'll see it in their review queue and decide whether to publish project-wide. Track status from the "Pending GC review" tab.` },
    published:       { btn:'📢 Publish to all companies', expl:`This will broadcast immediately to <b>all companies on ${esc(proj().code)}</b>. As GC PM you skip the review queue.` },
    direct:          { btn:'🤝 Send to company',           expl:`Private message — only the recipient company will see it (plus your team at ${esc(co.name)}).` },
  };
  const info = map[s] || map.pending_review;
  btn.textContent = info.btn;
  if (explainer) explainer.innerHTML = info.expl;
}

function submitPost() {
  const subj = document.getElementById('post-subj').value.trim();
  const body = document.getElementById('post-body').value.trim();
  const s = state.composeData.state;

  if (!subj || !body) { toast('Subject and body are required', 'error'); return; }
  if (s === 'direct' && !state.composeData.toCompany) { toast('Pick a recipient company', 'error'); return; }

  const me_ = me(), myCoName = myCompany().name;
  const newPost = {
    id: 'p' + Date.now(),
    author: state.personaId,
    state: s,
    time: 'just now',
    subject: subj,
    body: body,
    reactions: [],
    comments: 0,
    timeline: [],
  };

  if (s === 'internal') {
    newPost.timeline = [{ ico:'🏢', action:`Posted internal at ${myCoName}`, who:me_.name, when:'just now' }];
  } else if (s === 'pending_review') {
    newPost.submittedBy = state.personaId;
    newPost.timeline = [
      { ico:'📝', action:'Drafted',                     who:`${me_.name} (${myCoName})`, when:'just now' },
      { ico:'📤', action:'Submitted to GC for review',  who:`${me_.name} (${myCoName})`, when:'just now' },
    ];
  } else if (s === 'published') {
    newPost.publishedBy = state.personaId;
    newPost.reviewedBy = state.personaId;
    newPost.timeline = [
      { ico:'📝', action:'Drafted by GC PM',            who:`${me_.name} (${myCoName})`, when:'just now' },
      { ico:'📢', action:'Published direct to project', who:`${me_.name} (${myCoName})`, when:'just now' },
    ];
  } else if (s === 'direct') {
    newPost.toCompany = state.composeData.toCompany;
    const toName = COMPANIES[newPost.toCompany].name;
    newPost.timeline = [{ ico:'🤝', action:`Sent direct to ${toName}`, who:me_.name, when:'just now' }];
  }

  POSTS.unshift(newPost);
  closeModal();
  state.view = 'announcements';
  state.postScope = (s === 'pending_review') ? 'pending' : (s === 'internal' ? 'internal' : (s === 'published' ? 'published' : 'all'));

  const successMsg = {
    internal:       `Posted internally at ${myCoName}. Only your team sees it.`,
    pending_review: `Submitted to GC. They'll review and publish if approved.`,
    published:      `Broadcast to all companies on ${proj().code}.`,
    direct:         `Sent to ${COMPANIES[newPost.toCompany || ''].name}.`,
  };
  toast(successMsg[s] || 'Posted', 'success');
  render();
}

// GC REVIEW ACTIONS — approve, reject, edit
// ════════════════════════════════════════════════════════════════════════

function approvePost(postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  const me_ = me(), myCoName = myCompany().name;
  post.state = 'published';
  post.reviewedBy = state.personaId;
  post.publishedBy = state.personaId;
  post.timeline = post.timeline || [];
  post.timeline.push(
    { ico:'✅', action:'Approved by GC PM',       who:`${me_.name} (${myCoName})`, when:'just now' },
    { ico:'📢', action:'Published project-wide',  who:`${me_.name} (${myCoName})`, when:'just now' },
  );
  toast(`Approved & broadcast to all companies on ${proj().code}`, 'success');
  render();
}

function openRejectModal(postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  showModal(`<div class="modal">
    <div class="modal-h">
      <div>
        <h2>❌ Reject with feedback</h2>
        <div class="sub">The author will see your feedback and can revise & resubmit.</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-b">
      <div style="background:var(--bg-soft); padding:12px; border-radius:8px; margin-bottom:14px">
        <div style="font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:0.04em; text-transform:uppercase">Original submission</div>
        <div style="font-weight:600; font-size:14px; margin-top:4px">${esc(post.subject)}</div>
        <div style="font-size:12px; color:var(--text-soft); margin-top:4px; max-height:80px; overflow:hidden">${esc(post.body)}</div>
      </div>
      <label class="lbl">Reason for rejection <span class="req">*</span></label>
      <textarea class="inp" id="reject-reason" rows="4" placeholder="Explain why and what they should change..."></textarea>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" style="background:var(--red)" onclick="confirmReject('${postId}')">❌ Reject & send back</button>
    </div>
  </div>`);
}

function confirmReject(postId) {
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) { toast('Reason is required', 'error'); return; }
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  const me_ = me(), myCoName = myCompany().name;
  post.state = 'rejected';
  post.rejectedBy = state.personaId;
  post.rejectedAt = 'just now';
  post.rejectionReason = reason;
  post.timeline = post.timeline || [];
  post.timeline.push({ ico:'❌', action:'Rejected by GC PM', who:`${me_.name} (${myCoName})`, when:'just now' });
  closeModal();
  toast('Sent back to author with feedback', 'warn');
  render();
}

function editAndPublish(postId) {
  toast('Edit-before-publish opens here. (For demo: approves as-is.)', 'warn');
  approvePost(postId);
}

function reviseAndResubmit(postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  openComposeModal({ state:'pending_review', subject:post.subject, body:post.body });
}

// ─── Simulator ───
function renderSimulator() {
  const idx = state.simulatorStep || 0;
  const total = SIMULATOR_STEPS.length;

  if (idx >= total) {
    return `<div class="page">
      ${pageH('Simulator complete', `You walked a UPS through a full commissioning lifecycle. 🎉`)}
      <div class="card" style="padding:48px; text-align:center">
        <div style="font-size:64px; margin-bottom:14px">🎓</div>
        <div style="font-size:22px; font-weight:700; margin-bottom:10px">Congratulations</div>
        <div style="font-size:14px; color:var(--text-soft); max-width:520px; margin:0 auto 24px; line-height:1.65">You now understand how an asset moves through the full commissioning lifecycle. Each phase has specific owners, the sub-phases of L2 happen in a specific order with some running in parallel, and the GC orchestrates the handoffs.</div>
        <div style="display:flex; gap:8px; justify-content:center">
          <button class="btn btn-ghost" onclick="state.simulatorStep=0; state.simulatorPicked=undefined; render()">↻ Restart</button>
          <button class="btn btn-soft" onclick="setView('flow')">🔀 View flow diagram</button>
          <button class="btn btn-pri" onclick="setView('phaseref')">📋 Open phase reference</button>
        </div>
      </div>
    </div>`;
  }

  const step = SIMULATOR_STEPS[idx];
  const picked = state.simulatorPicked;
  const showFeedback = picked !== undefined;

  return `<div class="page">
    ${pageH(`Commissioning simulator · Step ${idx + 1} of ${total}`, `Walk a UPS through a full commissioning lifecycle. Pick what should happen next.`,
      `<button class="btn btn-ghost btn-sm" onclick="state.simulatorStep=0; state.simulatorPicked=undefined; render()">↻ Restart</button>`)}

    <div class="bar" style="margin-bottom:22px; height:8px"><div class="brand" style="width:${((idx+1)/total)*100}%"></div></div>

    <div class="card" style="margin-bottom:18px; border-left:4px solid var(--brand)">
      <div class="card-b">
        <div class="kicker">Scenario</div>
        <div style="font-size:15px; line-height:1.7; margin-top:8px; color:var(--text)">${esc(step.setup)}</div>
      </div>
    </div>

    <div class="kicker" style="margin-bottom:10px">What happens next?</div>
    ${step.options.map((opt, i) => {
      const isPicked = picked === i;
      const cls = showFeedback ? (opt.correct ? 'correct' : isPicked ? 'incorrect' : '') : '';
      const inner = `<div class="sim-option ${cls}" ${showFeedback ? '' : `onclick="simPick(${i})"`}>
        <div class="sim-radio">${showFeedback ? (opt.correct ? '✓' : isPicked ? '✗' : (i+1)) : (i+1)}</div>
        <div class="sim-body">
          <div class="sim-text">${esc(opt.text)}</div>
          ${showFeedback ? `<div class="sim-feedback">${esc(opt.feedback)}</div>` : ''}
        </div>
      </div>`;
      return inner;
    }).join('')}

    ${showFeedback ? `
      <div style="display:flex; justify-content:flex-end; margin-top:18px; gap:8px">
        <button class="btn btn-pri" onclick="simNext()">${idx + 1 >= total ? 'Finish' : 'Next step →'}</button>
      </div>
    ` : ''}
  </div>`;
}

function simPick(optIdx) {
  state.simulatorPicked = optIdx;
  render();
}
function simNext() {
  state.simulatorStep = (state.simulatorStep || 0) + 1;
  state.simulatorPicked = undefined;
  render();
}

// ─── Chat ───
function renderChat() {
  const co = myCompany();
  const myChannels = CHAT_CHANNELS.filter(ch => {
    if (ch.type === 'project') return true;
    if (ch.type === 'company') return ch.forCo === co.id;
    if (ch.type === 'direct') return ch.pair && (ch.pair[0] === co.id || ch.pair[1] === co.id);
    return false;
  });

  if (!myChannels.find(c => c.id === state.chatChannelId)) {
    state.chatChannelId = myChannels[0]?.id;
  }
  const activeId = state.chatChannelId;
  const active = myChannels.find(c => c.id === activeId);
  const messages = CHAT_MESSAGES.filter(m => m.ch === activeId);

  // Group channels by type
  const companyChannels = myChannels.filter(c => c.type === 'company');
  const projectChannels = myChannels.filter(c => c.type === 'project');
  const directChannels  = myChannels.filter(c => c.type === 'direct');

  return `<div class="page" style="max-width:1400px">
    ${pageH('Chat', `Real-time messaging. Internal channels stay inside your company; project-wide reaches everyone; direct channels are 1:1 with another company.`)}

    <div class="chat-layout">
      <div class="chat-sidebar">
        ${companyChannels.length > 0 ? `<div class="chat-section-h">My company</div>${companyChannels.map(ch => `
          <div class="chat-channel ${ch.id === activeId ? 'active' : ''}" onclick="state.chatChannelId='${ch.id}'; render()">
            <div class="chat-channel-name">${esc(ch.name)}</div>
            <div class="chat-channel-desc">${esc(ch.desc)}</div>
          </div>
        `).join('')}` : ''}

        ${projectChannels.length > 0 ? `<div class="chat-section-h">Project-wide</div>${projectChannels.map(ch => `
          <div class="chat-channel ${ch.id === activeId ? 'active' : ''}" onclick="state.chatChannelId='${ch.id}'; render()">
            <div class="chat-channel-name">${esc(ch.name)}</div>
            <div class="chat-channel-desc">${esc(ch.desc)}</div>
          </div>
        `).join('')}` : ''}

        ${directChannels.length > 0 ? `<div class="chat-section-h">Direct (1:1 with company)</div>${directChannels.map(ch => `
          <div class="chat-channel ${ch.id === activeId ? 'active' : ''}" onclick="state.chatChannelId='${ch.id}'; render()">
            <div class="chat-channel-name">${esc(ch.name)}</div>
            <div class="chat-channel-desc">${esc(ch.desc)}</div>
          </div>
        `).join('')}` : ''}
      </div>

      <div class="chat-main">
        ${active ? `
          <div class="chat-h">
            <div>
              <div class="chat-h-name">${esc(active.name)}</div>
              <div class="chat-h-desc">${esc(active.desc)} · ${messages.length} messages</div>
            </div>
            <div style="display:flex; gap:6px">
              <button class="btn btn-soft btn-sm" onclick="toast('Channel members panel opens here.')">👥 Members</button>
              <button class="btn btn-soft btn-sm" onclick="toast('Settings panel opens here.')">⚙</button>
            </div>
          </div>
          <div class="chat-messages">
            ${messages.length === 0 ? '<div style="text-align:center; color:var(--text-muted); padding:24px">No messages yet. Start the conversation below.</div>' : messages.map(m => {
              const author = PERSONAS[m.author];
              const authorCo = author ? COMPANIES[author.company] : null;
              const isMe = m.author === state.personaId;
              return `<div class="chat-msg">
                <div class="chat-msg-av" style="background:${isMe ? 'var(--accent)' : 'var(--brand)'}">${author ? initials(author.name) : '?'}</div>
                <div class="chat-msg-body">
                  <div class="chat-msg-h">
                    <b>${author ? esc(author.name) : '?'}${isMe ? ' (you)' : ''}</b>
                    <span class="chat-msg-co">${authorCo ? esc(authorCo.name) : ''}</span>
                    <span class="chat-msg-time">${esc(m.time)}</span>
                  </div>
                  <div class="chat-msg-text">${esc(m.body)}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="chat-compose">
            <input type="text" id="chat-input" placeholder="Message ${esc(active.name)}..." class="inp" onkeydown="if(event.key==='Enter') sendChatMessage()" />
            <button class="btn btn-pri" onclick="sendChatMessage()">Send</button>
          </div>
        ` : '<div style="padding:48px; text-align:center; color:var(--text-muted)">Select a channel to start chatting.</div>'}
      </div>
    </div>
  </div>`;
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input || !input.value.trim()) return;
  const body = input.value.trim();
  CHAT_MESSAGES.push({ ch: state.chatChannelId, author: state.personaId, body, time: 'just now' });
  input.value = '';
  render();
}

// ─── NCR LIST ─── ─────────────────────────────────────────────────────
function renderNCRs() {
  const co = myCompany();
  const isGC = isGCCompany(co.id);
  // Everyone can see all NCRs (transparency for QA/QC); but raise/disposition restricted
  const ncrs = NCRS.slice().sort((a,b) => {
    const order = { raised:0, under_review:1, disposition:2, car_issued:3, closed:4 };
    return order[a.status] - order[b.status];
  });

  const open = ncrs.filter(n => n.status !== 'closed').length;
  const detail = ncrs.find(n => n.id === state.ncrDetailId);

  if (detail) return renderNCRDetail(detail);

  return `<div class="page">
    ${pageH('Non-Conformance Reports (NCR)',
      `${ncrs.length} total · <b>${open} open</b>. NCRs are raised when work doesn't meet spec. Workflow: Raised → Under review → Disposition → CAR issued → Closed.`,
      `<button class="btn btn-pri btn-sm" onclick="openNCRForm()">+ Raise NCR</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>NCR workflow.</b> Anyone can <b>raise</b> an NCR when they spot non-conforming work. The responsible party provides a <b>disposition</b> (rework / use-as-is / accept / scrap). For systemic issues, a <b>CAR (Corrective Action Report)</b> is issued to prevent recurrence. NCRs close only when verified.
    </div>

    <div class="card" style="padding:0; overflow:hidden">
      <div class="ncr-row" style="background:var(--bg-soft); cursor:default; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">
        <div>NCR #</div>
        <div>DESCRIPTION</div>
        <div>SEVERITY</div>
        <div>STATUS</div>
        <div>RAISED</div>
      </div>
      ${ncrs.map(n => {
        const raiser = PERSONAS[n.raisedBy];
        const sev = NCR_SEVERITY_STYLE[n.severity] || 'amber';
        const stat = NCR_STATUS_LABEL[n.status];
        return `<div class="ncr-row" onclick="state.ncrDetailId='${n.id}'; render()">
          <div>
            <div class="ncr-num">${esc(n.num)}</div>
            <div class="ncr-meta">${esc(n.asset)}</div>
          </div>
          <div>
            <div class="ncr-desc">${esc(n.description)}</div>
            <div class="ncr-meta">${esc(n.loc)}</div>
          </div>
          <div><span class="sev-badge ${sev}">${esc(n.severity)}</span></div>
          <div><span class="status-badge ${stat.style}">${esc(stat.label)}</span></div>
          <div style="font-size:12px">
            <div>${esc(n.date)}</div>
            <div class="ncr-meta">${raiser ? esc(raiser.name.split(' ')[0]) : '?'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderNCRDetail(n) {
  const raiser = PERSONAS[n.raisedBy];
  const raiserCo = raiser ? COMPANIES[raiser.company] : null;
  const stages = ['raised','under_review','disposition','car_issued','closed'];
  const order = { raised:0, under_review:1, disposition:2, car_issued:3, closed:4 };
  const currentStage = order[n.status];

  const stageContent = {
    raised: `<div class="ncr-stage-h">Raised</div><div class="ncr-stage-body"><b>${raiser ? esc(raiser.name) : '?'}</b> (${raiserCo ? esc(raiserCo.name) : ''}) on ${esc(n.date)}<br><br>${esc(n.description)}</div>`,
    under_review: `<div class="ncr-stage-h">Under review</div><div class="ncr-stage-body">${currentStage >= 1 ? 'Routed to responsible party for disposition.' : '— pending —'}</div>`,
    disposition: `<div class="ncr-stage-h">Disposition</div><div class="ncr-stage-body">${n.disposition || '— pending —'}</div>`,
    car_issued: `<div class="ncr-stage-h">CAR issued</div><div class="ncr-stage-body">${n.car || '— no CAR required —'}</div>`,
    closed: `<div class="ncr-stage-h">Closed</div><div class="ncr-stage-body">${n.closedBy ? `Verified closed by <b>${esc((PERSONAS[n.closedBy]||{}).name||'?')}</b> on ${esc(n.closedDate)}` : '— pending verification —'}</div>`,
  };

  return `<div class="page">
    ${pageH(`${n.num} · ${esc(n.asset)}`,
      `<button class="btn btn-soft btn-sm" onclick="state.ncrDetailId=null; render()">← Back to NCR list</button> &nbsp; Severity <span class="sev-badge ${NCR_SEVERITY_STYLE[n.severity] || 'amber'}">${esc(n.severity)}</span>`,
      `${n.status !== 'closed' ? `<button class="btn btn-pri btn-sm" onclick="advanceNCRStatus('${esc(n.id)}')">⏭ Advance status</button>` : ''}`
    )}

    <div class="card">
      <div class="card-b">
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-bottom:18px">
          <div>
            <div class="kicker">Asset / location</div>
            <div style="margin-top:4px"><b class="mono">${esc(n.asset)}</b> · ${esc(n.loc)}</div>
          </div>
          <div>
            <div class="kicker">Status</div>
            <div style="margin-top:4px"><span class="status-badge ${NCR_STATUS_LABEL[n.status].style}">${esc(NCR_STATUS_LABEL[n.status].label)}</span></div>
          </div>
        </div>

        <div class="kicker" style="margin-bottom:8px">Workflow timeline</div>
        <div class="ncr-timeline">
          ${stages.map((s, i) => {
            const cls = i < currentStage ? 'done' : i === currentStage ? 'active' : '';
            return `<div class="ncr-stage ${cls}">
              <div style="flex:1">${stageContent[s]}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── CERTS WIDGET ─── reused on Team and Safety dashboards
function renderCertsForWorker(workerId) {
  const certs = CERTIFICATIONS.filter(c => c.worker === workerId);
  if (certs.length === 0) return '<span style="font-size:11px; color:var(--text-muted)">No certs on file</span>';
  return certs.map(c => {
    const style = CERT_STATE_STYLE[c.status] || 'current';
    return `<span class="cert-chip ${style}" title="${esc(c.cert)} · expires ${esc(c.expires)}">
      <span class="cert-chip-dot"></span>${esc(c.cert)}
    </span>`;
  }).join('');
}

// ─── HOLD / WITNESS POINTS ───
function renderHoldPoints() {
  const co = myCompany();
  const isGC = isGCCompany(co.id);
  // Filter: GC sees all; everyone else sees points where they're notified party or requestor
  const myCoId = co.id;
  let points = HOLD_POINTS.slice();
  if (!isGC) {
    points = points.filter(hp => hp.notifyCo === myCoId || (PERSONAS[hp.requestor] && PERSONAS[hp.requestor].company === myCoId));
  }
  const open = points.filter(p => p.status !== 'completed').length;

  return `<div class="page">
    ${pageH('Hold & Witness Points',
      `${points.length} points in scope · <b>${open} open</b>. Hold points block work from advancing. Witness points require a party to be present.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Register hold/witness point — form opens here.')">+ Register point</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Hold vs Witness.</b> A <b>hold point</b> stops work until the responsible party signs off (e.g. GC QA/QC must approve L2.06 doc package before L2.07 punch). A <b>witness point</b> requires a party to be physically present (e.g. CxA must witness the L4 load bank, OEM must witness factory acceptance test). Use this register to coordinate timing, send notifications, and capture sign-offs.
    </div>

    ${points.length === 0 ? '<div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">No hold/witness points in scope.</div>' : points.map(hp => {
      const requestor = PERSONAS[hp.requestor];
      const requestorCo = requestor ? COMPANIES[requestor.company] : null;
      const notifyPerson = PERSONAS[hp.notify];
      const notifyCo = COMPANIES[hp.notifyCo];
      const stat = HP_STATUS_STYLE[hp.status];
      const typeClass = hp.type === 'witness' ? 'hp-type-witness' : 'hp-type-hold';
      return `<div class="hp-card">
        <div class="hp-num-block">
          <div class="hp-type-badge ${typeClass}">${esc(hp.type)}</div>
          <div class="hp-num">${esc(hp.num)}</div>
        </div>
        <div class="hp-body">
          <div>
            <span class="hp-asset">${esc(hp.asset)}</span>
            <span class="hp-phase">${esc(hp.phase)}</span>
          </div>
          <div class="hp-desc">${esc(hp.desc)}</div>
          <div class="hp-meta">
            Requested by ${requestor ? esc(requestor.name) : '?'} (${requestorCo ? esc(requestorCo.code) : '?'}) → notify ${notifyPerson ? esc(notifyPerson.name) : '?'} (${notifyCo ? esc(notifyCo.code) : '?'})
          </div>
        </div>
        <div class="hp-actions">
          <span class="status-badge ${stat.style}">${esc(stat.label)}</span>
          <div class="hp-due">DUE ${esc(hp.dueDate)}</div>
          ${hp.actualDate ? `<div style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace">DONE ${esc(hp.actualDate)}</div>` : ''}
          ${hp.status === 'pending' ? `<button class="btn btn-pri btn-sm" onclick="toast('Notification sent to ${esc((notifyPerson||{}).name||'recipient')}.')">📨 Notify</button>` : ''}
          ${hp.status === 'notified' ? `<button class="btn btn-soft btn-sm" onclick="toast('Mark as completed — confirmation form opens here.')">✓ Mark complete</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─── PUNCH LIST ───

  if (tab === 'open')        items = items.filter(p => p.status === 'open');
  if (tab === 'in_progress') items = items.filter(p => p.status === 'in_progress');
  if (tab === 'closed')      items = items.filter(p => p.status === 'closed');

  const totalOpen = PUNCH_ITEMS.filter(p => p.status === 'open').length;
  const totalIP   = PUNCH_ITEMS.filter(p => p.status === 'in_progress').length;
  const totalCl   = PUNCH_ITEMS.filter(p => p.status === 'closed').length;

  return `<div class="page">
    ${pageH('Punch list',
      `${PUNCH_ITEMS.length} items · ${totalOpen} open · ${totalIP} in progress · ${totalCl} closed.`,
      `<button class="btn btn-pri btn-sm" onclick="openPunchForm()">+ Raise punch item</button>`

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">

    <div class="tabs">

        <div>ASSET</div>
        <div>DESCRIPTION</div>
        <div>SEVERITY</div>
        <div>ASSIGNED TO</div>
        <div>STATUS</div>

      ${items.length === 0 ? '<div style="padding:36px; text-align:center; color:var(--text-muted)">No items in this tab.</div>' : items.map(p => {

          <div>
            <div class="punch-num">${esc(p.num)}</div>
            <div style="font-size:10px; color:var(--text-muted); margin-top:2px; font-family:'JetBrains Mono',monospace">${esc(p.raisedDate)}</div>
          </div>
          <div>
            <div class="punch-asset">${esc(p.asset)}</div>
            <div class="punch-loc">${esc(p.loc)}</div>
          </div>
          <div class="punch-desc">${esc(p.desc)}</div>
          <div><span class="sev-badge ${sev}">${esc(p.severity)}</span></div>
          <div>${assignedCo ? `<span class="tag ${esc(assignedCo.tag)}">${esc(assignedCo.code)}</span>` : esc(p.assignedTo)}</div>

// ─── LONG-LEAD TRACKER ───
function renderLongLead() {
  const stages = LL_STAGES;
  const stageIdx = id => stages.findIndex(s => s.id === id);

  const totalCost = LONG_LEAD.length;
  const installed = LONG_LEAD.filter(l => l.stage === 'installed').length;
  const inFlight  = LONG_LEAD.filter(l => l.stage !== 'installed' && l.stage !== 'po_issued').length;
  const onOrder   = LONG_LEAD.filter(l => l.stage === 'po_issued' || l.stage === 'submittal_pending').length;

  return `<div class="page">
    ${pageH('Long-Lead Equipment',
      `${LONG_LEAD.length} items tracked · ${installed} installed · ${inFlight} in flight · ${onOrder} on order. Lifecycle: PO → Submittal → Fab → Ship → On Site → Installed.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Add long-lead item form opens here.')">+ Add item</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Long-lead tracking.</b> Items with 8+ week lead times need their own lifecycle visibility. Each item moves through 8 stages. <b>OFCI</b> (Owner-Furnished, Contractor-Installed) items are owner-purchased and free-issued to the GC. <b>CFCI</b> are GC-procured. Track expected vs actual dates at each stage to catch slips early.
    </div>

    ${LONG_LEAD.map(ll => {
      const supplier = COMPANIES[ll.supplier];
      const currentIdx = stageIdx(ll.stage);
      const pct = stages[currentIdx]?.pct || 0;
      return `<div class="ll-card">
        <div class="ll-header">
          <div style="flex:1; min-width:240px">
            <div class="ll-item-name">${esc(ll.item)}</div>
            <div class="ll-meta">
              ${supplier ? `<span class="tag ${esc(supplier.tag)}">${esc(supplier.name)}</span>` : esc(ll.supplier)}
              · target: <b class="mono">${esc(ll.target)}</b>
              · ${ll.leadWeeks}wk lead
              · ${ll.ofci ? '<span class="tag amber">OFCI</span>' : '<span class="tag gray">CFCI</span>'}
            </div>
          </div>
          <div class="ll-cost">${esc(ll.cost)}</div>
        </div>

        <div class="ll-progress-bar">
          <div class="ll-progress-fill" style="width:${pct}%"></div>
        </div>

        <div class="ll-stages-row">
          ${stages.map((s, i) => {
            const cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
            return `<div class="ll-stage-dot ${cls}">
              <div class="dot"></div>
              <span class="lbl">${esc(s.label)}</span>
            </div>`;
          }).join('')}
        </div>

        <div class="ll-detail-grid">
          ${ll.poDate ?       `<div class="ll-detail-cell"><div class="lbl">PO Date</div><div class="val">${esc(ll.poDate)}</div></div>` : ''}
          ${ll.submittal ?    `<div class="ll-detail-cell"><div class="lbl">Submittal</div><div class="val">${esc(ll.submittal)}</div></div>` : ''}
          ${ll.fabRelease ?   `<div class="ll-detail-cell"><div class="lbl">Fab Release</div><div class="val">${esc(ll.fabRelease)}</div></div>` : ''}
          ${ll.shipped ?      `<div class="ll-detail-cell"><div class="lbl">Shipped</div><div class="val">${esc(ll.shipped)}</div></div>` : ''}
          ${ll.arrived ?      `<div class="ll-detail-cell"><div class="lbl">Arrived</div><div class="val">${esc(ll.arrived)}</div></div>` : ''}
          ${ll.installed ?    `<div class="ll-detail-cell"><div class="lbl">Installed</div><div class="val">${esc(ll.installed)}</div></div>` : ''}
          ${ll.expectedShip ? `<div class="ll-detail-cell"><div class="lbl" style="color:var(--accent)">Exp. Ship</div><div class="val" style="color:#92400e">${esc(ll.expectedShip)}</div></div>` : ''}
          ${ll.expectedArrival ? `<div class="ll-detail-cell"><div class="lbl" style="color:var(--accent)">Exp. Arrival</div><div class="val" style="color:#92400e">${esc(ll.expectedArrival)}</div></div>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─── CREW DISPATCH ───
function renderCrewDispatch() {
  const co = myCompany();
  const isGC = isGCCompany(co.id);
  // Filter to today (May 06)
  const today = CREW_ASSIGNMENTS.filter(c => c.date === 'May 06');
  // Group by company, but if not GC, only show your company
  const byCompany = {};
  today.forEach(c => {
    if (!isGC && c.company !== co.id) return;
    if (!byCompany[c.company]) byCompany[c.company] = [];
    byCompany[c.company].push(c);
  });
  const companies = Object.keys(byCompany);
  const totalAssigned = Object.values(byCompany).flat().length;
  const onSite = Object.values(byCompany).flat().filter(c => c.status === 'on_site').length;

  return `<div class="page">
    ${pageH('Crew dispatch · Today (May 06)',
      isGC
        ? `Project-wide crew assignments. ${totalAssigned} workers across ${companies.length} companies. ${onSite} on site.`
        : `${esc(co.name)} crew assignments today. ${totalAssigned} workers · ${onSite} on site.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Assign worker — drag-and-drop dispatcher opens here.')">+ Assign worker</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">

    ${companies.length === 0 ? '<div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">No crew assignments today.</div>' : companies.map(coId => {

      return `<div class="crew-co-block">

// ─── TEST RESULTS ───
function renderTestResults() {
  const tab = state.testTab || 'all';
  let results = TEST_RESULTS.slice();

  // Available filters: all, fail (only failures), or per-asset
  const assets = [...new Set(TEST_RESULTS.map(t => t.asset))];
  if (tab === 'fail') results = results.filter(t => !t.pass);
  else if (assets.includes(tab)) results = results.filter(t => t.asset === tab);

  const totalPass = TEST_RESULTS.filter(t => t.pass).length;
  const totalFail = TEST_RESULTS.filter(t => !t.pass).length;

  return `<div class="page">
    ${pageH('Test results database',
      `${TEST_RESULTS.length} tests on file · <b style="color:var(--green)">${totalPass} pass</b> · <b style="color:var(--red)">${totalFail} fail</b>. NETA acceptance + maintenance test data per device.`,
      `<button class="btn btn-pri btn-sm" onclick="openTestForm()">+ Log test result</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">

    </div>

    <div class="tabs">
      <div class="tab ${tab === 'all'  ? 'active' : ''}" onclick="state.testTab='all'; render()">All <span class="count">${TEST_RESULTS.length}</span></div>
      <div class="tab ${tab === 'fail' ? 'active' : ''}" onclick="state.testTab='fail'; render()">❌ Failures <span class="count">${totalFail}</span></div>
      ${assets.map(a => `<div class="tab ${tab === a ? 'active' : ''}" onclick="state.testTab='${a}'; render()">${esc(a)} <span class="count">${TEST_RESULTS.filter(t => t.asset === a).length}</span></div>`).join('')}
    </div>

    <div class="card" style="padding:0; overflow:hidden">
      <div class="test-row" style="background:var(--bg-soft); cursor:default; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">
        <div>ASSET</div>
        <div>PHASE</div>
        <div>TEST</div>
        <div>VALUE</div>
        <div>THRESHOLD</div>
        <div>RESULT</div>

// ─── RISK REGISTER ───
function renderRiskRegister() {
  // Build matrix: rows = impact (5..1 desc), cols = probability (1..5)
  const matrix = {};
  for (let i = 1; i <= 5; i++) {
    matrix[i] = {};
    for (let p = 1; p <= 5; p++) matrix[i][p] = [];
  }
  RISK_REGISTER.forEach(r => matrix[r.impact][r.prob].push(r));

  const cellClass = (score) => {
    if (score >= 15) return 'risk-cell-15';
    if (score >= 9)  return 'risk-cell-9';
    if (score >= 5)  return 'risk-cell-5';
    if (score >= 3)  return 'risk-cell-3';
    return 'risk-cell-1';
  };

  // Sort by score desc
  const sorted = RISK_REGISTER.slice().sort((a,b) => (b.prob*b.impact) - (a.prob*a.impact));
  const active = RISK_REGISTER.filter(r => r.status === 'active').length;

  return `<div class="page">
    ${pageH('Risk Register',
      `${RISK_REGISTER.length} risks tracked · <b style="color:var(--red)">${active} active</b>. Probability × Impact matrix and full risk log with mitigations.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Add risk — form opens here.')">+ Add risk</button>`)}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Risk register.</b> Each risk scored on 1-5 probability × 1-5 impact (max score 25). The matrix below visualizes concentration; the log details each risk with its mitigation plan and owner. Critical items (score ≥15) get weekly executive review; High items (9-14) get bi-weekly review.
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-b">
        <div class="kicker">Risk matrix · probability (likelihood) × impact (severity)</div>
        <div class="risk-matrix">
          <div class="risk-matrix-corner"><span>impact ↑</span><span>prob →</span></div>
          ${[1,2,3,4,5].map(p => `<div class="risk-matrix-cell risk-matrix-axis">P${p}</div>`).join('')}
          ${[5,4,3,2,1].map(i => `
            <div class="risk-matrix-cell risk-matrix-axis">I${i}</div>
            ${[1,2,3,4,5].map(p => {
              const score = i * p;
              const cell = matrix[i][p];
              return `<div class="risk-matrix-cell ${cellClass(score)}">
                ${cell.length > 0 ? `<b>${cell.length}</b><span style="font-size:8px; opacity:0.7; display:block">score ${score}</span>` : `<span style="opacity:0.4">${score}</span>`}
              </div>`;
            }).join('')}
          `).join('')}
        </div>
        <div style="display:flex; gap:14px; margin-top:14px; font-size:11px; color:var(--text-soft); flex-wrap:wrap">
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#dc2626; border-radius:3px"></div>Critical (15+)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#fecaca; border-radius:3px"></div>High (9-12)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#fed7aa; border-radius:3px"></div>Med-High (5-8)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#fef3c7; border-radius:3px"></div>Medium (3-4)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#d1fae5; border-radius:3px"></div>Low (1-2)</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden">
      <div class="risk-row" style="background:var(--bg-soft); cursor:default; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">
        <div>RISK</div><div>CATEGORY</div><div>P × I</div><div>SCORE</div><div>OWNER</div><div>STATUS</div>
      </div>
      ${sorted.map(r => {
        const score = r.prob * r.impact;
        const sc = riskScoreColor(score);
        const owner = PERSONAS[r.owner];
        const stat = RISK_STATUS[r.status];
        return `<div class="risk-row">
          <div>
            <b>${esc(r.name)}</b>
            <div style="font-size:11px; color:var(--text-soft); margin-top:4px; line-height:1.5">${esc(r.mitigation)}</div>
          </div>
          <div><span class="risk-cat-pill">${esc(r.category)}</span></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-align:center">${r.prob} × ${r.impact}</div>
          <div><span style="background:${sc.bg}; color:${sc.fg}; padding:4px 10px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700">${score} · ${esc(sc.label)}</span></div>
          <div style="font-size:11px">${owner ? esc(owner.name) : '?'}<div style="color:var(--text-muted); font-size:10px">${owner ? esc((COMPANIES[owner.company]||{}).code||'') : ''}</div></div>
          <div><span class="status-badge ${stat.style}">${esc(stat.label)}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderArtifacto() {
  const tabs = [
    { id:'all',        name:'All',         ico:'🗂' },
    { id:'meeting',    name:'Meetings',    ico:'📝' },
    { id:'rfi',        name:'RFIs',        ico:'❓' },
    { id:'cr',         name:'Change Reqs', ico:'🔄' },
    { id:'mop',        name:'MOPs',        ico:'📋' },
    { id:'submittal',  name:'Submittals',  ico:'📑' },
    { id:'3wl',        name:'3WL / 6WL',   ico:'📅', match:['3wl','6wl','baseline'] },
    { id:'drawing',    name:'Drawings',    ico:'📐' },
  ];
  const tab = state.artifTab || 'all';
  const isGCSide = isGCCompany(myCompany().id);

  let items = ARTIFACTS.slice();
  if (tab !== 'all') {
    const matchTypes = tabs.find(t => t.id === tab)?.match || [tab];
    items = items.filter(a => matchTypes.includes(a.type));
  }
  // Filter GC-only items if not GC
  if (!isGCSide) items = items.filter(a => !a.gcOnly);

  const counts = {};
  ARTIFACTS.forEach(a => {
    if (!isGCSide && a.gcOnly) return;
    counts[a.type] = (counts[a.type] || 0) + 1;
  });
  counts.all = ARTIFACTS.filter(a => isGCSide || !a.gcOnly).length;
  counts['3wl'] = ARTIFACTS.filter(a => ['3wl','6wl','baseline'].includes(a.type) && (isGCSide || !a.gcOnly)).length;

  return `<div class="page">
    ${pageH('Artifacto', `Central document hub for ${esc(proj().code)}. Meeting notes, RFIs, change requests, MOPs, submittals, lookaheads, baseline, drawings, as-builts. Visible to all companies on the project; certain items are GC-restricted.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('New artifact composer opens here.')">+ Upload artifact</button>`)}

    <div class="tabs">
      ${tabs.map(t => `<div class="tab ${tab === t.id ? 'active' : ''}" onclick="state.artifTab='${t.id}'; render()">${t.ico} ${esc(t.name)} <span class="count">${counts[t.id] || 0}</span></div>`).join('')}
    </div>

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>How Artifacto works.</b> Every artifact is visible to all companies on the project unless flagged as GC-only (security plans, executive notes, etc). Drawings include rev history. RFIs/CRs/MOPs link to the assets they affect. Lookaheads (3WL/6WL) and the baseline schedule live here.${isGCSide ? ' As GC, you can see <b>' + ARTIFACTS.filter(a => a.gcOnly).length + ' restricted items</b> too.' : ''}
    </div>

    ${items.length === 0 ? `<div class="card" style="padding:48px; text-align:center; color:var(--text-muted)">No artifacts in this view.</div>` : items.map(a => {

// ─── OPERATIONAL SIMULATOR · power topology + failure scenarios ───
function renderOpsSimulator() {
  const sc = SIM_SCENARIOS[state.opsScenario] || SIM_SCENARIOS.normal;
  const failed = new Set(sc.failed);
  const backup = new Set(sc.activeBackup);

  // Build SVG
  function nodeSVG(n) {
    const cls = ['topo-node', `kind-${n.kind}`];
    if (failed.has(n.id)) cls.push('failed');
    if (backup.has(n.id)) cls.push('backup-active');
    return `<g class="${cls.join(' ')}" data-id="${esc(n.id)}">
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}"/>
      <text x="${n.x + n.w/2}" y="${n.y + n.h/2}">${esc(n.label)}</text>
    </g>`;
  }
  function linkSVG(l) {
    const from = POWER_NODES.find(n => n.id === l.from);
    const to   = POWER_NODES.find(n => n.id === l.to);
    if (!from || !to) return '';
    const x1 = from.x + from.w, y1 = from.y + from.h/2;
    const x2 = to.x,           y2 = to.y + to.h/2;
    const cx = (x1 + x2) / 2;
    const path = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
    const cls = ['topo-link', `kind-${l.kind}`];
    if (failed.has(l.from) || failed.has(l.to)) cls.push('failed');
    if (l.kind === 'gen' && state.opsScenario === 'normal') cls.push('cold');
    if (l.kind === 'gen' && backup.has(l.from)) cls.push('active-backup');
    return `<path class="${cls.join(' ')}" d="${path}"/>`;
  }

  return `<div class="page">
    ${pageH('Operational Simulator · Power Flow',
      `Live diagram of the data center's power topology. Pick a scenario on the right to see how the system responds when components fail. Generators auto-start on utility loss; UPS bridges the gap; redundancy maintains the IT load.`,
      `<button class="btn btn-ghost btn-sm" onclick="setView('flow')">↩ Cx Flow Diagram</button>`)}

    <div class="cols-2" style="grid-template-columns: 2fr 1fr">
      <div class="card">
        <div class="card-h">
          <h3>${esc(sc.name)}</h3>
          ${sc.warn ? '<span class="tag red">⚠ CRITICAL</span>' : '<span class="tag green">SYSTEM OK</span>'}
        </div>
        <div class="card-b">
          <svg class="topo-svg" viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg">
            ${POWER_LINKS.map(linkSVG).join('')}
            ${POWER_NODES.map(nodeSVG).join('')}
          </svg>
          <div style="margin-top:14px; padding:14px; background:${sc.warn ? 'var(--red-soft)' : 'var(--brand-fade)'}; border-left:4px solid ${sc.warn ? 'var(--red)' : 'var(--brand)'}; border-radius:6px">
            <div style="font-weight:700; font-size:13px; color:${sc.warn ? '#991b1b' : 'var(--brand-h)'}">${esc(sc.name)}</div>
            <div style="font-size:12.5px; color:${sc.warn ? '#7f1d1d' : 'var(--brand-h)'}; margin-top:6px; line-height:1.55">${esc(sc.desc)}</div>
            ${sc.note ? `<div style="font-size:12px; color:${sc.warn ? '#991b1b' : 'var(--brand-h)'}; margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.08); font-style:italic">${esc(sc.note)}</div>` : ''}
          </div>
        </div>
      </div>

      <div>
        <div class="kicker" style="margin-bottom:8px">Scenarios</div>
        ${Object.entries(SIM_SCENARIOS).map(([id, s]) => `
          <button class="scenario-btn ${state.opsScenario === id ? 'active' : ''} ${s.warn ? 'warn' : ''}" onclick="state.opsScenario='${id}'; render()">
            <div class="nm">${esc(s.name)}</div>
            <div class="ds">${esc(s.desc.slice(0, 90))}${s.desc.length > 90 ? '…' : ''}</div>
          </button>
        `).join('')}

        <div style="margin-top:14px; padding:12px; background:var(--bg-soft); border-radius:8px; font-size:11.5px; color:var(--text-soft); line-height:1.55">
          <b>Legend:</b><br>
          <span style="color:var(--green)">━━</span> Critical / IT load path<br>
          <span style="color:var(--brand)">━━</span> Utility feed<br>
          <span style="color:var(--accent)">━ ━</span> Gen feed (cold/standby)<br>
          <span style="color:var(--teal)">━━</span> Cooling<br>
          <span style="color:var(--accent)">═══</span> Active backup (animated)<br>
          <span style="color:var(--red)">- - -</span> Failed
        </div>
      </div>
    </div>
  </div>`;
}

function confirmDispatch(siteId, equipmentId) {
  const fseEl = document.getElementById('dsp-fse');
  const scopeEl = document.getElementById('dsp-scope');
  const dateEl = document.getElementById('dsp-date');
  if (!fseEl || !scopeEl || !dateEl) { toast('Missing fields', 'error'); return; }
  const fseName = fseEl.value.split(' · ')[0];
  const scope = scopeEl.value.split(' · ')[0];
  const date = dateEl.value;
  const targetLabel = equipmentId || (siteId ? PROJECTS[siteId]?.code : 'site');
  closeModal();
  toast(`Dispatched ${fseName} → ${scope} → ${targetLabel} starting ${date}`, 'success');

  // Add to activity feed so it's visible
  ACTIVITY.unshift({
    time:'now', who:me().name, co:myCompany().code.split('-')[0], icon:'▸',
    action:`dispatched ${fseName} for ${scope}`,
    target:`${targetLabel} · starts ${date}`,
  });
  render();
}

// ─── Checklist detail modal ───
function openChecklistDetail(b64) {
  let c;
  try { c = JSON.parse(atob(b64)); } catch(e) { toast('Could not load checklist', 'error'); return; }

  const items = [];
  for (let i = 1; i <= c.total; i++) {
    items.push({
      n: i,
      name: `${c.name} item ${i}`,
      done: i <= c.done,
      sig: i <= c.done ? c.signedBy : '',
      date: i <= c.done ? c.date : '',
    });
  }
  const pct = Math.round(c.done / c.total * 100);

  showModal(`<div class="modal lg">
    <div class="modal-h">
      <div>
        <div class="kicker">${esc(c.phase)} · ${esc(c.asset)}</div>
        <h2>${esc(c.name)}</h2>
        <div class="sub"><b>${c.done}/${c.total}</b> items complete (${pct}%) · ${esc(c.signedBy || 'Unsigned')} · last activity ${esc(c.date)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-b">
      <div class="bar" style="margin-bottom:18px; height:10px"><div class="${c.status === 'closed' ? '' : 'amber'}" style="width:${pct}%"></div></div>

      <div style="display:flex; gap:10px; margin-bottom:18px">
        <div style="flex:1; padding:10px 12px; background:var(--green-soft); border-radius:6px; text-align:center">
          <div style="font-size:18px; font-weight:700; color:#166534">${c.done}</div>
          <div style="font-size:11px; color:#166534">complete</div>
        </div>
        <div style="flex:1; padding:10px 12px; background:var(--accent-soft); border-radius:6px; text-align:center">
          <div style="font-size:18px; font-weight:700; color:#92400e">${c.total - c.done}</div>
          <div style="font-size:11px; color:#92400e">remaining</div>
        </div>
        <div style="flex:1; padding:10px 12px; background:var(--bg-soft); border-radius:6px; text-align:center">
          <div style="font-size:18px; font-weight:700">${pct}%</div>
          <div style="font-size:11px; color:var(--text-muted)">progress</div>
        </div>
      </div>

      <div class="kicker" style="margin-bottom:8px">Items</div>
      <div class="card">
        ${items.map(it => `
          <div class="feed-item" onclick="${it.done ? `toast('Item already signed by ${esc(it.sig)}.')` : `toast('Item check workflow — would mark ${it.n} done.', 'success')`}">
            <div class="feed-icon" style="background:${it.done ? 'var(--green-soft)' : 'var(--bg-soft)'}; color:${it.done ? '#166534' : 'var(--text-muted)'}; font-weight:600">${it.done ? '✓' : it.n}</div>
            <div class="feed-content">
              <div class="who" style="font-size:13px; ${it.done ? '' : 'color:var(--text-muted)'}">${esc(it.name)}</div>
              ${it.sig ? `<div class="target">Signed by ${esc(it.sig)} · ${esc(it.date)}</div>` : '<div class="target">Awaiting sign-off</div>'}
            </div>
            ${it.done ? '<span class="tag green">DONE</span>' : '<span class="tag gray">OPEN</span>'}
          </div>
        `).join('')}
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-soft" onclick="toast('PDF export queued.', 'success')">📄 Export</button>
      ${c.status !== 'closed' ? '<button class="btn btn-pri" onclick="toast(\'Continuing checklist · would mark next item.\', \'success\')">✓ Sign next item</button>' : ''}
    </div>
  </div>`);
}

function showModal(html) {

}

  $('#modal-mount').classList.remove('open');

  document.body.style.overflow = '';
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.innerHTML = `<span class="ico">${type === 'success' ? '✓' : type === 'error' ? '!' : type === 'warn' ? '⚠' : 'ℹ'}</span><span>${esc(msg)}</span>`;
  $('#toast-mount').appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    el.style.transition = 'all 0.2s';
    setTimeout(() => el.remove(), 220);
  }, 2600);
}

// PERSISTENCE · localStorage so user-created data survives reload
// ════════════════════════════════════════════════════════════════════════
const STORAGE_KEY = 'cxcontrol_user_data_v1';
function saveUserData() {
  try {
    const data = {
      EQUIPMENT_USER:  EQUIPMENT.filter(e => e.userCreated),
      NCRS_USER:       NCRS.filter(n => n.userCreated),
      TEST_RESULTS_USER: TEST_RESULTS.filter(t => t.userCreated),
      PSSR_RECORDS_USER: PSSR_RECORDS.filter(p => p.userCreated),
      PUNCH_USER:      PUNCH_ITEMS.filter(p => p.userCreated),
      TASKS_USER:      TASKS.filter(t => t.userCreated),
      TASKS_CHANGED:   TASKS.filter(t => !t.userCreated && t.statusChanged).map(t => ({ id:t.id, status:t.status, completedDate:t.completedDate })),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.warn('Persistence failed:', e); }
}
function loadUserData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.EQUIPMENT_USER)    data.EQUIPMENT_USER.forEach(e => { if (!EQUIPMENT.some(x => x.id === e.id)) EQUIPMENT.push(e); });
    if (data.NCRS_USER)         data.NCRS_USER.forEach(n => { if (!NCRS.some(x => x.id === n.id)) NCRS.push(n); });
    if (data.TEST_RESULTS_USER) data.TEST_RESULTS_USER.forEach(t => { if (!TEST_RESULTS.some(x => x.id === t.id)) TEST_RESULTS.push(t); });
    if (data.PSSR_RECORDS_USER) data.PSSR_RECORDS_USER.forEach(p => { if (!PSSR_RECORDS.some(x => x.id === p.id)) PSSR_RECORDS.push(p); });
    if (data.PUNCH_USER)        data.PUNCH_USER.forEach(p => { if (!PUNCH_ITEMS.some(x => x.id === p.id)) PUNCH_ITEMS.push(p); });
    if (data.TASKS_USER)        data.TASKS_USER.forEach(t => { if (!TASKS.some(x => x.id === t.id)) TASKS.unshift(t); });
    if (data.TASKS_CHANGED)     data.TASKS_CHANGED.forEach(c => { const t = TASKS.find(x => x.id === c.id); if (t) { t.status = c.status; t.completedDate = c.completedDate; t.statusChanged = true; } });
  } catch(e) { console.warn('Load failed:', e); }
}
function resetUserData() {
  try {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  } catch(e) { console.warn('Reset failed:', e); }
}
function getFormVal(name) {
  const el = document.querySelector('[name="' + name + '"]');
  return el ? el.value : '';
}
function getFormChecked(name) {
  return Array.from(document.querySelectorAll('[name="' + name + '"]:checked')).map(el => el.value);
}
function todayStr() {
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()] + ' ' + String(d.getDate()).padStart(2, '0');
}

function applyDCTemplate(key) {
  const preview = document.getElementById('template-preview');

function bulkCreateFromTemplate(key) {
  const tpl = DC_TYPE_TEMPLATES[key];
  let created = 0;
  tpl.equipment.forEach(typeCode => {
    const def = EQUIP_TYPE_DEFAULTS[typeCode];
    if (!def) return;
    const existing = EQUIPMENT.filter(e => e.id.startsWith(typeCode + '-'));
    const nextNum = existing.length + 1;
    const id = typeCode + '-' + String(nextNum).padStart(2, '0');
    if (EQUIPMENT.some(e => e.id === id)) return;
    EQUIPMENT.push({
      id, cls: def.cls, oem: def.oem,
      name: id + ' · template-created',
      hall: 'TBD',
      stage: def.stage, phaseIdx: 0,
      lifecycle: def.lifecycle,
      pigtails: false, owner: def.oem,
      model: '(template)', serial: '(template)', proc: 'OFCI',
      userCreated: true, createdBy: state.personaId, createdDate: todayStr(),
    });
    created++;
  });
  saveUserData();
  closeModal();
  toast(`✓ Created ${created} assets from ${tpl.name} template`, 'success');
  state.view = 'equipment';
  render();
}

function submitAssetForm() {
  const id = getFormVal('asset_id').trim().toUpperCase();
  const type = getFormVal('asset_type');

// Advance NCR status
function advanceNCRStatus(ncrId) {
  const n = NCRS.find(x => x.id === ncrId);
  if (!n) return;
  const next = { raised:'under_review', under_review:'disposition', disposition:'car_issued', car_issued:'closed' }[n.status];
  if (!next) { toast('Already closed', 'warn'); return; }

  const prompt = {
    under_review: 'Mark as under review by responsible party?',
    disposition:  'Enter disposition (rework / use-as-is / accept / scrap):',
    car_issued:   'Issue Corrective Action Report (CAR)?',
    closed:       'Verify and close NCR?',
  }[next];

  if (next === 'disposition') {
    const disp = window.prompt(prompt, '');
    if (!disp) return;
    n.disposition = disp;
  } else if (next === 'car_issued') {
    const car = window.prompt('CAR text (corrective action to prevent recurrence):', '');
    if (!car) return;
    n.car = car;
  } else if (next === 'closed') {
    n.closedBy = state.personaId;
    n.closedDate = todayStr();
  }
  n.status = next;
  saveUserData();
  toast(`✓ NCR advanced to ${next.replace('_',' ')}`, 'success');
  render();
}

    <div class="modal-h"><span>Log Test Result</span><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-b">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
        <div>
          <label style="font-size:11px; color:var(--text-muted)">ASSET</label>
          <select name="test_asset" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:'JetBrains Mono', monospace">
            ${EQUIPMENT.map(e => `<option value="${esc(e.id)}">${esc(e.id)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">PHASE</label>
          <select name="test_phase" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:'JetBrains Mono', monospace">
            <option value="A">A</option><option value="B">B</option><option value="C">C</option>
            <option value="N">N (Neutral)</option><option value="ALL">ALL (3-phase)</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">TEST TYPE</label>
          <select name="test_type" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
            <option value="Insulation Resistance">Insulation Resistance (Megger)</option>
            <option value="Power Factor">Power Factor</option>
            <option value="Contact Resistance">Contact Resistance (Ductor)</option>
            <option value="Hi-Pot 38kV">Hi-Pot 38kV</option>
            <option value="TTR">TTR (Turns Ratio)</option>
            <option value="Torque (lugs)">Torque (lugs)</option>
            <option value="Continuity">Ground Continuity</option>
            <option value="Pressure">Pressure Test</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">TECHNICIAN</label>
          <select name="test_tech" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
            ${techPersonas.map(p => `<option value="${esc(p.id)}" ${p.id === me_p.id ? 'selected' : ''}>${esc(p.name)} · ${esc((COMPANIES[p.company]||{}).code||'')}</option>`).join('')}
          </select>
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">VALUE</label>
          <input type="text" name="test_value" placeholder="e.g. 1850" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:'JetBrains Mono', monospace">
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">UNIT</label>
          <select name="test_unit" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
            <option value="MΩ">MΩ</option><option value="µΩ">µΩ</option><option value="%">%</option>
            <option value="ft-lb">ft-lb</option><option value="kV">kV</option><option value="psi">psi</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">THRESHOLD (spec)</label>
          <input type="text" name="test_threshold" placeholder="e.g. > 1000 MΩ" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:'JetBrains Mono', monospace">
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">RESULT</label>
          <select name="test_pass" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
            <option value="true">PASS</option>
            <option value="false">FAIL</option>

        </div>
      </div>
      <div style="margin-top:10px">
        <label style="font-size:11px; color:var(--text-muted)">NOTES (optional · required if FAIL)</label>
        <textarea name="test_notes" rows="2" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:inherit; resize:vertical"></textarea>
      </div>
      <div style="margin-top:10px; padding:10px; background:var(--accent-soft); border-radius:6px; font-size:12px; color:#92400e">

      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" onclick="submitTestForm()">📊 Log result</button>
    </div>

}

function submitTestForm() {
  const value = getFormVal('test_value').trim();
  if (!value) { toast('Value is required', 'error'); return; }
  const pass = getFormVal('test_pass') === 'true';
  const notes = getFormVal('test_notes').trim();
  if (!pass && !notes) { toast('Notes required for FAIL result', 'error'); return; }

  const test = {
    id: 'tr-user-' + Date.now(),
    asset: getFormVal('test_asset'),
    phase: getFormVal('test_phase'),
    test: getFormVal('test_type'),
    date: todayStr(),
    tech: getFormVal('test_tech'),
    value,
    unit: getFormVal('test_unit'),
    threshold: getFormVal('test_threshold'),
    pass,
    ambient: '72°F',
    notes,
    userCreated: true,
  };
  TEST_RESULTS.push(test);

  // Auto-NCR on fail
  let autoNCR = null;
  if (!pass) {
    const nextNum = 'NCR-2026-' + String(15 + NCRS.filter(n => n.userCreated).length).padStart(4, '0');
    autoNCR = {
      id: 'ncr-auto-' + Date.now(),
      num: nextNum,
      raisedBy: state.personaId,
      asset: test.asset,
      loc: test.asset + ' · phase ' + test.phase,
      severity: 'major',
      date: todayStr(),
      status: 'raised',
      description: `Auto-raised from failed test: ${test.test} on ${test.asset} phase ${test.phase}. Value ${value} ${test.unit} vs threshold ${test.threshold}. Notes: ${notes}`,
      disposition: '',
      car: '',
      closedBy: '',
      closedDate: '',
      userCreated: true,
      linkedTestId: test.id,
    };
    NCRS.unshift(autoNCR);
  }

  saveUserData();
  closeModal();
  toast(pass ? `✓ Test logged · ${test.asset} ${test.test} PASS` : `❌ Test FAIL · auto-raised ${autoNCR.num}`, pass ? 'success' : 'error');
  state.view = 'tests';
  render();
}

// ─── INITIATE PSSR ───
function openPSSRForm() {
  // Filter to assets without an active PSSR
  const eligible = EQUIPMENT.filter(e => !PSSR_RECORDS.some(p => p.asset === e.id && p.status !== 'draft'));
  showModal(`<div class="modal" style="max-width:560px">
    <div class="modal-h"><span>Initiate Pre-Startup Safety Review</span><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-b">
      <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:8px; padding:12px; margin-bottom:14px; font-size:12px; line-height:1.55">
        💡 PSSR is a 6-category, 40-item review. Required before energization. Once initiated, you'll work through all items, mark each PASS/FAIL/WAIVED, then submit for GC PM approval.
      </div>
      <label style="font-size:11px; color:var(--text-muted)">SELECT ASSET</label>
      <select name="pssr_asset" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:'JetBrains Mono', monospace; margin-top:4px">
        ${eligible.length ? eligible.map(e => `<option value="${esc(e.id)}">${esc(e.id)} · ${esc(e.cls)}</option>`).join('') : '<option value="">— no eligible assets —</option>'}
      </select>
      <div style="margin-top:14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px">
        ${PSSR_TEMPLATE.map(c => `<div style="padding:8px; border:1px solid var(--border); border-radius:6px; text-align:center; font-size:11px">
          <b>${esc(c.name)}</b><br><span style="color:var(--text-muted)">${c.items.length} items</span>
        </div>`).join('')}
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" onclick="submitPSSRForm()" ${eligible.length ? '' : 'disabled'}>🛡 Initiate PSSR</button>
    </div>
  </div>`);
}

function submitPSSRForm() {
  const asset = getFormVal('pssr_asset');
  if (!asset) { toast('Select an asset', 'error'); return; }
  PSSR_RECORDS.unshift({
    id: 'pssr-user-' + Date.now(),
    asset,
    initiated: todayStr(),
    initiatedBy: state.personaId,
    completed: '',
    approvedBy: '',
    status: 'in_progress',
    score: '0/40 reviewed',
    userCreated: true,
  });
  saveUserData();
  closeModal();
  toast(`✓ PSSR initiated for ${asset}`, 'success');
  state.view = 'pssr';
  render();
}

// ─── RAISE PUNCH ITEM ───

  const me_p = me();
  const nextNum = 'PUNCH-2026-' + String(29 + PUNCH_ITEMS.filter(p => p.userCreated).length).padStart(4, '0');
  showModal(`<div class="modal" style="max-width:560px">

          <label style="font-size:11px; color:var(--text-muted)">PUNCH NUMBER</label>

        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">ASSET</label>

            ${EQUIPMENT.map(e => `<option value="${esc(e.id)}">${esc(e.id)}</option>`).join('')}
          </select>
        </div>
        <div>

          <select name="punch_severity" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
            <option value="minor">Minor</option>
            <option value="major">Major</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px; color:var(--text-muted)">ASSIGNED TO</label>
          <select name="punch_assigned" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
            ${Object.entries(COMPANIES).map(([k,v]) => `<option value="${esc(k)}">${esc(v.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div style="margin-top:10px">
        <label style="font-size:11px; color:var(--text-muted)">LOCATION</label>
        <input type="text" name="punch_loc" placeholder="e.g. UPS-Rm-A floor near cable tray" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px">
      </div>
      <div style="margin-top:10px">
        <label style="font-size:11px; color:var(--text-muted)">DESCRIPTION</label>
        <textarea name="punch_desc" rows="3" placeholder="What needs to be fixed/finished?" style="width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-family:inherit; resize:vertical"></textarea>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" onclick="submitPunchForm('${esc(nextNum)}')">📌 Raise punch</button>
    </div>
  </div>`);
}

function submitPunchForm(num) {
  const desc = getFormVal('punch_desc').trim();
  if (!desc) { toast('Description is required', 'error'); return; }
  PUNCH_ITEMS.unshift({
    id: 'pi-user-' + Date.now(),
    num,
    asset: getFormVal('punch_asset'),
    loc: getFormVal('punch_loc'),
    raisedBy: state.personaId,
    raisedDate: todayStr(),
    severity: getFormVal('punch_severity'),
    desc,
    assignedTo: getFormVal('punch_assigned'),
    status: 'open',
    userCreated: true,
  });
  saveUserData();
  closeModal();
  toast(`✓ ${num} raised on ${getFormVal('punch_asset')}`, 'success');
  state.view = 'punch';
  render();
}

// ════════════════════════════════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════════════════════════════════

document.addEventListener('click', (e) => {
  if (!e.target.closest('.proj-picker') && !e.target.closest('.tb-user .badge') && !e.target.closest('.dropdown')) {
    if (state.dropdown) { closeDropdown(); render(); }
  }
  if (e.target.id === 'modal-mount') closeModal();
  if (e.target.id === 'welcome-mount') closeWelcome();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#modal-mount').classList.contains('open')) closeModal();
    else if ($('#welcome-mount').classList.contains('open')) closeWelcome();
    else if (state.dropdown) { closeDropdown(); render(); }
  }
});

// ════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ════════════════════════════════════════════════════════════════════════

function render() {
  renderTopBar();
  renderSidebar();
  $('#main').innerHTML = renderMain();
}

// Initial
loadUserData();
render();

// Show welcome on first load
let welcomed = false;
try { welcomed = localStorage.getItem('cx_welcomed') === '1'; } catch(e) {}
if (!welcomed) {
  setTimeout(() => openWelcome(0), 350);
}
</script>
