<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoreSynaptics - Project Management Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════
       CSS RESET & BASE STYLES
       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none;
    }

    /* ═══════════════════════════════════════════════════════════
       THEME TOKENS — DARK MODE
       ═══════════════════════════════════════════════════════════ */
    :root[data-theme="dark"] {
      --rf-bg: #05091a;
      --rf-bg2: #090f22;
      --rf-bg3: #151d2e;
      --rf-bg4: #1a2540;
      --rf-bg5: #0d2540;
      --rf-border: #131e3a;
      --rf-border2: #1c2d50;
      --rf-border3: #1e4070;
      --rf-txt: #eef2ff;
      --rf-txt2: #7a90b8;
      --rf-txt3: #5077c0;
      --rf-accent: #00c8e8;
      --rf-accent2: #0090cc;
      --rf-glow: rgba(0, 200, 255, 0.15);
      --rf-green: #22c55e;
      --rf-green2: #00a870;
      --rf-yellow: #ffcc00;
      --rf-yellow2: #cc9900;
      --rf-red: #f04545;
      --rf-red2: #cc2233;
      --rf-orange: #ff8c00;
      --rf-purple: #9966ff;
      --rf-teal: #00d4c8;
    }

    /* ═══════════════════════════════════════════════════════════
       THEME TOKENS — LIGHT MODE
       ═══════════════════════════════════════════════════════════ */
    :root[data-theme="light"] {
      --rf-bg: #dde6f5;
      --rf-bg2: #ffffff;
      --rf-bg3: #e8f0fa;
      --rf-bg4: #d8e6f2;
      --rf-bg5: #cddaee;
      --rf-border: #c5d2ea;
      --rf-border2: #adbbd8;
      --rf-border3: #8daacf;
      --rf-txt: #08142e;
      --rf-txt2: #3a5070;
      --rf-txt3: #6b84a0;
      --rf-accent: #0070bb;
      --rf-accent2: #005c9a;
      --rf-glow: rgba(0, 112, 187, 0.12);
      --rf-green: #16a34a;
      --rf-green2: #0d8a35;
      --rf-yellow: #c89000;
      --rf-yellow2: #a07000;
      --rf-red: #dc2626;
      --rf-red2: #a81515;
      --rf-orange: #c05a00;
      --rf-purple: #6020b0;
      --rf-teal: #007888;
    }

    /* ═══════════════════════════════════════════════════════════
       LAYOUT STYLES
       ═══════════════════════════════════════════════════════════ */
    body {
      background: var(--rf-bg);
      color: var(--rf-txt);
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════
       SIDEBAR STYLES
       ═══════════════════════════════════════════════════════════ */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--rf-bg2);
      border-right: 1px solid var(--rf-border);
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top: 0;
    }

    .sidebar-header {
      padding: 20px 16px;
      border-bottom: 1px solid var(--rf-border);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--rf-accent), var(--rf-accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: white;
    }

    .sidebar-logo-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--rf-txt);
    }

    .sidebar-nav {
      padding: 12px 8px;
    }

    .nav-item {
      margin-bottom: 2px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--rf-txt2);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-link:hover {
      background: var(--rf-bg3);
      color: var(--rf-txt);
    }

    .nav-link.active {
      background: var(--rf-glow);
      color: var(--rf-accent);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .nav-chevron {
      margin-left: auto;
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .nav-chevron.open {
      transform: rotate(90deg);
    }

    .submenu {
      display: none;
      padding-left: 32px;
      margin-top: 4px;
    }

    .submenu.open {
      display: block;
    }

    .submenu-link {
      display: block;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--rf-txt3);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .submenu-link:hover {
      background: var(--rf-bg3);
      color: var(--rf-txt2);
    }

    .submenu-link.active {
      color: var(--rf-accent);
      background: var(--rf-glow);
    }

    /* ═══════════════════════════════════════════════════════════
       MAIN CONTENT STYLES
       ═══════════════════════════════════════════════════════════ */
    .main-content {
      flex: 1;
      overflow-y: auto;
      height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════
       TOP NAV STYLES
       ═══════════════════════════════════════════════════════════ */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 20px;
    }

    .top-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 16px;
      background: var(--rf-bg2);
      border: 1px solid var(--rf-border);
      border-radius: 12px;
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--rf-txt);
    }

    .top-nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      padding: 8px 12px 8px 36px;
      background: var(--rf-bg3);
      border: 1px solid var(--rf-border);
      border-radius: 8px;
      color: var(--rf-txt);
      font-size: 14px;
      width: 220px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--rf-txt3);
    }

    .search-input:focus {
      width: 280px;
      border-color: var(--rf-accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--rf-txt3);
      font-size: 14px;
    }

    .nav-separator {
      width: 1px;
      height: 24px;
      background: var(--rf-border2);
      border-radius: 1px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--rf-txt2);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 16px;
      position: relative;
    }

    .icon-btn:hover {
      background: var(--rf-bg3);
      color: var(--rf-txt);
    }

    .notification-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      background: var(--rf-red);
      border-radius: 50%;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rf-accent), var(--rf-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      color: white;
      cursor: pointer;
      position: relative;
    }

    .user-avatar::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      background: var(--rf-green);
      border-radius: 50%;
      border: 2px solid var(--rf-bg2);
    }

    /* ═══════════════════════════════════════════════════════════
       DROPDOWN MENU STYLES
       ═══════════════════════════════════════════════════════════ */
    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: var(--rf-bg2);
      border: 1px solid var(--rf-border2);
      border-radius: 12px;
      padding: 8px;
      min-width: 240px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 100;
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .dropdown-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rf-accent), var(--rf-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: white;
    }

    .dropdown-user-info h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--rf-txt);
    }

    .dropdown-user-info p {
      font-size: 11px;
      color: var(--rf-txt2);
    }

    .dropdown-user-info span {
      font-size: 10px;
      color: var(--rf-txt3);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--rf-border);
      margin: 8px 0;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--rf-txt);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .dropdown-item:hover {
      background: var(--rf-bg3);
    }

    .dropdown-item.danger {
      color: var(--rf-red);
    }

    /* ═══════════════════════════════════════════════════════════
       PAGE CONTENT STYLES
       ═══════════════════════════════════════════════════════════ */
    .page-content {
      padding: 0 20px 40px;
    }

    /* ═══════════════════════════════════════════════════════════
       DASHBOARD CARDS
       ═══════════════════════════════════════════════════════════ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--rf-bg2);
      border: 1px solid var(--rf-border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stat-card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--rf-txt2);
    }

    .stat-card-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .stat-card-icon.blue {
      background: rgba(0, 200, 232, 0.15);
      color: var(--rf-accent);
    }

    .stat-card-icon.green {
      background: rgba(34, 197, 94, 0.15);
      color: var(--rf-green);
    }

    .stat-card-icon.yellow {
      background: rgba(255, 204, 0, 0.15);
      color: var(--rf-yellow);
    }

    .stat-card-icon.red {
      background: rgba(240, 69, 69, 0.15);
      color: var(--rf-red);
    }

    .stat-card-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--rf-txt);
      margin-bottom: 4px;
    }

    .stat-card-change {
      font-size: 12px;
      color: var(--rf-green);
    }

    .stat-card-change.negative {
      color: var(--rf-red);
    }

    /* ═══════════════════════════════════════════════════════════
       TABLE STYLES
       ═══════════════════════════════════════════════════════════ */
    .table-card {
      background: var(--rf-bg2);
      border: 1px solid var(--rf-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--rf-border);
    }

    .table-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--rf-txt);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      background: var(--rf-bg3);
      font-size: 12px;
      font-weight: 600;
      color: var(--rf-txt2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--rf-border);
      font-size: 14px;
      color: var(--rf-txt2);
    }

    tr:hover td {
      background: var(--rf-bg3);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.active {
      background: rgba(34, 197, 94, 0.15);
      color: var(--rf-green);
    }

    .status-badge.pending {
      background: rgba(255, 204, 0, 0.15);
      color: var(--rf-yellow);
    }

    .status-badge.inactive {
      background: rgba(122, 144, 184, 0.15);
      color: var(--rf-txt2);
    }

    /* ═══════════════════════════════════════════════════════════
       BUTTON STYLES
       ═══════════════════════════════════════════════════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-primary {
      background: var(--rf-accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--rf-accent2);
    }

    .btn-secondary {
      background: var(--rf-bg3);
      color: var(--rf-txt);
      border: 1px solid var(--rf-border);
    }

    .btn-secondary:hover {
      background: var(--rf-bg4);
    }

    /* ═══════════════════════════════════════════════════════════
       FORM STYLES
       ═══════════════════════════════════════════════════════════ */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--rf-txt2);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--rf-bg3);
      border: 1px solid var(--rf-border);
      border-radius: 8px;
      color: var(--rf-txt);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--rf-accent);
    }

    .form-input::placeholder {
      color: var(--rf-txt3);
    }

    /* ═══════════════════════════════════════════════════════════
       MODAL STYLES
       ═══════════════════════════════════════════════════════════ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--rf-bg2);
      border: 1px solid var(--rf-border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--rf-txt);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--rf-txt2);
      cursor: pointer;
      font-size: 18px;
    }

    .modal-close:hover {
      background: var(--rf-bg3);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    /* ═══════════════════════════════════════════════════════════
       UTILITY CLASSES
       ═══════════════════════════════════════════════════════════ */
    .text-muted { color: var(--rf-txt2); }
    .text-accent { color: var(--rf-accent); }
    .text-green { color: var(--rf-green); }
    .text-red { color: var(--rf-red); }
    .text-yellow { color: var(--rf-yellow); }

    .mt-4 { margin-top: 16px; }
    .mb-4 { margin-bottom: 16px; }
    .gap-4 { gap: 16px; }

    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -280px;
        z-index: 50;
        transition: left 0.3s ease;
      }

      .sidebar.open {
        left: 0;
      }

      .main-content {
        width: 100%;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .search-box {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">CS</div>
          <span class="sidebar-logo-text">CoreSynaptics</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Nav items will be populated by JavaScript -->
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Navigation -->
      <div class="top-nav">
        <div class="top-nav-inner">
          <div class="top-nav-left">
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
          </div>

          <div class="top-nav-right">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" class="search-input" placeholder="Search...">
            </div>

            <div class="nav-separator"></div>

            <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
              <span id="themeIcon">☀️</span>
            </button>

            <button class="icon-btn" title="Notifications">
              🔔
              <span class="notification-dot"></span>
            </button>

            <div class="nav-separator"></div>

            <div class="dropdown" id="userDropdown">
              <div class="user-avatar" onclick="toggleDropdown('userDropdown')">
                <span id="userInitials">AU</span>
              </div>
              <div class="dropdown-menu">
                <div class="dropdown-header">
                  <div class="dropdown-avatar" id="dropdownAvatar">AU</div>
                  <div class="dropdown-user-info">
                    <h4 id="userName">Admin User</h4>
                    <p id="userOrg">CoreSynaptics</p>
                    <span id="userRole">SUPERADMIN</span>
                  </div>
                </div>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" onclick="navigateTo('/UserProfile')">
                  👤 My Profile
                </a>
                <a class="dropdown-item" href="#" onclick="navigateTo('/Settings')">
                  ⚙️ Settings
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item danger" href="#" onclick="handleLogout()">
                  🚪 Log Out
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Page Content -->
      <div class="page-content" id="pageContent">
        <!-- Content will be populated by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Modal Template -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal Title</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Modal content -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // SIDEBAR DATA - All menu items (no RBAC filtering)
    // ═══════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════
    // THEME FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function applyTheme(newTheme) {
      document.documentElement.setAttribute("data-theme", newTheme);
      document.getElementById("themeIcon").textContent = newTheme === "dark" ? "☀️" : "🌙";
    }

    function toggleTheme() {
      theme = theme === "dark" ? "light" : "dark";
      setThemeStorage(theme);
      applyTheme(theme);
    }

    // ═══════════════════════════════════════════════════════════
    // SIDEBAR RENDERING
    // ═══════════════════════════════════════════════════════════
    function renderSidebar() {
      const nav = document.getElementById("sidebarNav");
      nav.innerHTML = "";

      sidebarItems.forEach((item, index) => {
        const hasSubmenu = item.submenu && item.submenu.length > 0;
        const isActive = currentPath === item.path || 
          (hasSubmenu && item.submenu.some(sub => sub.path === currentPath));

        const navItem = document.createElement("div");
        navItem.className = "nav-item";

        const navLink = document.createElement("button");
        navLink.className = `nav-link ${isActive ? "active" : ""}`;
        navLink.innerHTML = `
          <span class="nav-icon">${item.icon}</span>
          <span>${item.title}</span>
          ${hasSubmenu ? `<span class="nav-chevron ${openMenuIndex === index ? "open" : ""}">▶</span>` : ""}
        `;

        if (hasSubmenu) {
          navLink.onclick = () => toggleSubmenu(index);
        } else {
          navLink.onclick = () => navigateTo(item.path);
        }

        navItem.appendChild(navLink);

        if (hasSubmenu) {
          const submenu = document.createElement("div");
          submenu.className = `submenu ${openMenuIndex === index ? "open" : ""}`;
          
          item.submenu.forEach(sub => {
            const subLink = document.createElement("a");
            subLink.className = `submenu-link ${currentPath === sub.path ? "active" : ""}`;
            subLink.href = "#";
            subLink.textContent = sub.title;
            subLink.onclick = (e) => {
              e.preventDefault();
              navigateTo(sub.path);
            };
            submenu.appendChild(subLink);
          });

          navItem.appendChild(submenu);
        }

        nav.appendChild(navItem);
      });
    }

    function toggleSubmenu(index) {
      openMenuIndex = openMenuIndex === index ? null : index;
      renderSidebar();
    }

    // ═══════════════════════════════════════════════════════════
    // NAVIGATION
    // ═══════════════════════════════════════════════════════════
    function navigateTo(path) {
      currentPath = path;
      
      // Update page title
      const pageTitle = getPageTitle(path);
      document.getElementById("pageTitle").textContent = pageTitle;

      // Render page content
      renderPageContent(path);

      // Re-render sidebar to update active states
      renderSidebar();

      // Close user dropdown
      document.getElementById("userDropdown").classList.remove("open");
    }

    function getPageTitle(path) {
      const titles = {
        "/": "Dashboard",
        "/Projects": "Projects",
        "/CRM/Leads/List": "Leads",
        "/Company/List": "Companies",
        "/Tasks/List": "Tasks",
        "/Issues/List": "Issues",
        "/Teams/List": "Teams",
        "/Users/List": "Users",
        "/Settings": "Settings",
        "/UserProfile": "My Profile"
      };
      return titles[path] || path.split("/").pop() || "Dashboard";
    }

    // PAGE CONTENT RENDERING
    // ═══════════════════════════════════════════════════════════
    function renderPageContent(path) {
      const content = document.getElementById("pageContent");

      switch(path) {
        case "/":
          content.innerHTML = renderDashboard();
          break;
        case "/Projects":
          content.innerHTML = renderProjects();
          break;
        case "/CRM/Leads/List":
          content.innerHTML = renderLeads();
          break;
        case "/Tasks/List":
          content.innerHTML = renderTasks();
          break;
        case "/Issues/List":
          content.innerHTML = renderIssues();
          break;
        case "/Teams/List":
          content.innerHTML = renderTeams();
          break;
        case "/Users/List":
          content.innerHTML = renderUsers();
          break;
        case "/Settings":
          content.innerHTML = renderSettings();
          break;
        case "/UserProfile":
          content.innerHTML = renderUserProfile();
          break;
        default:
          content.innerHTML = renderGenericPage(path);
      }
    }

                    <td>${i.reportedBy}</td>
                    <td><span class="status-badge ${i.status === 'resolved' ? 'active' : i.status === 'open' ? 'pending' : 'inactive'}">${i.status.replace('_', ' ')}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════════
    // MODAL FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function openModal(title, content, onConfirm) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = content;
      document.getElementById("modalConfirm").onclick = onConfirm;
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("open");
    }

    function openAddProjectModal() {
      const content = `
        <div class="form-group">
          <label class="form-label">Project Name</label>
          <input type="text" class="form-input" id="newProjectName" placeholder="Enter project name">
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" class="form-input" id="newProjectLocation" placeholder="Enter location">
        </div>
        <div class="form-group">
          <label class="form-label">Budget ($)</label>
          <input type="number" class="form-input" id="newProjectBudget" placeholder="Enter budget">
        </div>
      `;
      openModal("Add New Project", content, addProject);
    }

    function addProject() {
      const name = document.getElementById("newProjectName").value;
      const location = document.getElementById("newProjectLocation").value;
      const budget = parseInt(document.getElementById("newProjectBudget").value) || 0;

      if (name && location) {
        const projects = getData('projects') || [];
        const newProject = {
          id: Date.now(),
          name,
          location,
          budget,
          status: "pending",
          progress: 0
        };
        projects.push(newProject);
        setData('projects', projects);
        closeModal();
        navigateTo('/Projects');
      }
    }

    function deleteProject(id) {
      if (confirm("Are you sure you want to delete this project?")) {
        const projects = getData('projects') || [];
        const filtered = projects.filter(p => p.id !== id);
        setData('projects', filtered);
        navigateTo('/Projects');
      }
    }

    function editProject(id) {
      const projects = getData('projects') || [];
      const project = projects.find(p => p.id === id);
      if (!project) return;

      const content = `
        <div class="form-group">
          <label class="form-label">Project Name</label>
          <input type="text" class="form-input" id="editProjectName" value="${project.name}">
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" class="form-input" id="editProjectLocation" value="${project.location}">
        </div>
        <div class="form-group">
          <label class="form-label">Budget ($)</label>
          <input type="number" class="form-input" id="editProjectBudget" value="${project.budget}">
        </div>
        <div class="form-group">
          <label class="form-label">Progress (%)</label>
          <input type="number" class="form-input" id="editProjectProgress" value="${project.progress}" min="0" max="100">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-input" id="editProjectStatus">
            <option value="pending" ${project.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="active" ${project.status === 'active' ? 'selected' : ''}>Active</option>
            <option value="inactive" ${project.status === 'inactive' ? 'selected' : ''}>Inactive</option>
          </select>
        </div>
      `;

      openModal("Edit Project", content, () => {
        project.name = document.getElementById("editProjectName").value;
        project.location = document.getElementById("editProjectLocation").value;
        project.budget = parseInt(document.getElementById("editProjectBudget").value) || 0;
        project.progress = parseInt(document.getElementById("editProjectProgress").value) || 0;
        project.status = document.getElementById("editProjectStatus").value;
        setData('projects', projects);
        closeModal();
        navigateTo('/Projects');
      });
    }

    // ═══════════════════════════════════════════════════════════
    // DROPDOWN FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function toggleDropdown(id) {
      const dropdown = document.getElementById(id);
      dropdown.classList.toggle("open");
    }

    // Close dropdowns when clicking outside
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".dropdown")) {
        document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
      }
    });

    // ═══════════════════════════════════════════════════════════
    // AUTH FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function handleLogout() {
      localStorage.removeItem("user");
      localStorage.removeItem("theme");
      window.location.reload();
    }

    function saveSettings() {
      const user = JSON.parse(getUser()) || MOCK_USER;
      user.firstName = document.getElementById("settingsFirstName").value;
      user.lastName = document.getElementById("settingsLastName").value;
      user.email = document.getElementById("settingsEmail").value;
      user.organizationName = document.getElementById("settingsOrg").value;
      setUser(user);
      loadUserInfo();
      alert("Settings saved successfully!");
    }

    // ═══════════════════════════════════════════════════════════
    // INITIALIZE APP
    // ═══════════════════════════════════════════════════════════
    init();
  </script>
