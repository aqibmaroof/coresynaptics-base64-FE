// ─── PSSR ─── Pre-Startup Safety Review
function renderPSSR() {
  const totalItems = PSSR_TEMPLATE.reduce((s, c) => s + c.items.length, 0);
  const records = PSSR_RECORDS.slice().sort((a,b) => {
    const order = { in_progress:0, draft:1, rejected:2, approved:3 };
    return order[a.status] - order[b.status];
  });

  return `<div class="page">
    ${pageH('PSSR · Pre-Startup Safety Review',
      `OSHA 29 CFR 1910.119-inspired pre-energization review · 6 categories · ${totalItems} verification items per asset. All items must PASS before energization is authorized.`,
      `<button class="btn btn-pri btn-sm" onclick="openPSSRForm()">+ Initiate PSSR</button>`)}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>PSSR (Pre-Startup Safety Review)</b> is the GC QA/QC's final gate before authorizing energization. Required by OSHA 1910.119 for process safety. Carol Reyes initiates a PSSR per asset; all 40 items must PASS (or be formally waived) before Sarah Chen approves and clears for L3 energization. Linked to hold-point HP-007.
    </div>

    <div class="card" style="padding:0; margin-bottom:18px; overflow:hidden">
      <table class="pssr-card-table">
        <thead><tr><th>ASSET</th><th>STATUS</th><th>PROGRESS</th><th>INITIATED</th><th>COMPLETED</th><th>APPROVED BY</th></tr></thead>
        <tbody>
          ${records.map(p => {
            const stat = PSSR_STATUS[p.status];
            const initiator = PERSONAS[p.initiatedBy];
            const approver = PERSONAS[p.approvedBy];
            return `<tr onclick="toast('Open PSSR detail for ${esc(p.asset)} — full 40-item form opens here.')">
              <td><b class="mono" style="color:var(--brand-h)">${esc(p.asset)}</b></td>
              <td><span class="status-badge ${stat.style}">${esc(stat.label)}</span></td>
              <td style="font-family:'JetBrains Mono',monospace; font-size:11px">${esc(p.score)}</td>
              <td style="font-size:11px">${p.initiated ? esc(p.initiated) : '—'}${initiator ? '<br><span style="color:var(--text-muted)">' + esc(initiator.name.split(' ')[0]) + '</span>' : ''}</td>
              <td style="font-size:11px">${p.completed ? esc(p.completed) : '—'}</td>
              <td style="font-size:11px">${approver ? esc(approver.name) : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-b">
        <div class="kicker">PSSR template · 6 categories · ${totalItems} items total</div>
        <div class="pssr-cat-grid">
          ${PSSR_TEMPLATE.map(c => `<div class="pssr-cat-card">
            <div class="pssr-cat-card-h">${esc(c.name)}</div>
            <div class="pssr-cat-count">${c.items.length} items</div>
            <div style="margin-top:8px; font-size:11px; color:var(--text-soft); line-height:1.5">
              ${c.items.slice(0, 3).map(i => '• ' + esc(i)).join('<br>')}
              ${c.items.length > 3 ? '<br><i style="color:var(--text-muted)">+ ' + (c.items.length - 3) + ' more</i>' : ''}
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── RISK REGISTER ───
function renderRiskRegister() {
  // Build matrix: rows = impact (5..1 desc), cols = probability (1..5)
  const matrix = {};
  for (let i = 1; i <= 5; i++) {
    matrix[i] = {};
    for (let p = 1; p <= 5; p++) matrix[i][p] = [];
  }
  RISK_REGISTER.forEach(r => matrix[r.impact][r.prob].push(r));

  const cellClass = (score) => {
    if (score >= 15) return 'risk-cell-15';
    if (score >= 9)  return 'risk-cell-9';
    if (score >= 5)  return 'risk-cell-5';
    if (score >= 3)  return 'risk-cell-3';
    return 'risk-cell-1';
  };

  // Sort by score desc
  const sorted = RISK_REGISTER.slice().sort((a,b) => (b.prob*b.impact) - (a.prob*a.impact));
  const active = RISK_REGISTER.filter(r => r.status === 'active').length;

  return `<div class="page">
    ${pageH('Risk Register',
      `${RISK_REGISTER.length} risks tracked · <b style="color:var(--red)">${active} active</b>. Probability × Impact matrix and full risk log with mitigations.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Add risk — form opens here.')">+ Add risk</button>`)}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Risk register.</b> Each risk scored on 1-5 probability × 1-5 impact (max score 25). The matrix below visualizes concentration; the log details each risk with its mitigation plan and owner. Critical items (score ≥15) get weekly executive review; High items (9-14) get bi-weekly review.
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-b">
        <div class="kicker">Risk matrix · probability (likelihood) × impact (severity)</div>
        <div class="risk-matrix">
          <div class="risk-matrix-corner"><span>impact ↑</span><span>prob →</span></div>
          ${[1,2,3,4,5].map(p => `<div class="risk-matrix-cell risk-matrix-axis">P${p}</div>`).join('')}
          ${[5,4,3,2,1].map(i => `
            <div class="risk-matrix-cell risk-matrix-axis">I${i}</div>
            ${[1,2,3,4,5].map(p => {
              const score = i * p;
              const cell = matrix[i][p];
              return `<div class="risk-matrix-cell ${cellClass(score)}">
                ${cell.length > 0 ? `<b>${cell.length}</b><span style="font-size:8px; opacity:0.7; display:block">score ${score}</span>` : `<span style="opacity:0.4">${score}</span>`}
              </div>`;
            }).join('')}
          `).join('')}
        </div>
        <div style="display:flex; gap:14px; margin-top:14px; font-size:11px; color:var(--text-soft); flex-wrap:wrap">
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#dc2626; border-radius:3px"></div>Critical (15+)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#fecaca; border-radius:3px"></div>High (9-12)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#fed7aa; border-radius:3px"></div>Med-High (5-8)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#fef3c7; border-radius:3px"></div>Medium (3-4)</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:14px; height:14px; background:#d1fae5; border-radius:3px"></div>Low (1-2)</div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden">
      <div class="risk-row" style="background:var(--bg-soft); cursor:default; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">
        <div>RISK</div><div>CATEGORY</div><div>P × I</div><div>SCORE</div><div>OWNER</div><div>STATUS</div>
      </div>
      ${sorted.map(r => {
        const score = r.prob * r.impact;
        const sc = riskScoreColor(score);
        const owner = PERSONAS[r.owner];
        const stat = RISK_STATUS[r.status];
        return `<div class="risk-row">
          <div>
            <b>${esc(r.name)}</b>
            <div style="font-size:11px; color:var(--text-soft); margin-top:4px; line-height:1.5">${esc(r.mitigation)}</div>
          </div>
          <div><span class="risk-cat-pill">${esc(r.category)}</span></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-align:center">${r.prob} × ${r.impact}</div>
          <div><span style="background:${sc.bg}; color:${sc.fg}; padding:4px 10px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700">${score} · ${esc(sc.label)}</span></div>
          <div style="font-size:11px">${owner ? esc(owner.name) : '?'}<div style="color:var(--text-muted); font-size:10px">${owner ? esc((COMPANIES[owner.company]||{}).code||'') : ''}</div></div>
          <div><span class="status-badge ${stat.style}">${esc(stat.label)}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function openAssetPage(assetId, phaseKey) {
  state.assetDetailId = assetId;
  state.assetDetailPhase = phaseKey || null;
  state.view = 'assetdetail';
  closeModal();
  render();
}

function renderAssetDetail() {
  const id = state.assetDetailId;
  const asset = EQUIPMENT.find(e => e.id === id);
  if (!asset) {
    return '<div class="page">' + pageH('Asset not found', '', '<button class="btn btn-pri btn-sm" onclick="setView(&#39;equipment&#39;)">← Back to Equipment</button>') + '</div>';
  }
  const tpl = getChecklistTemplate(asset);
  const rich = getRichChecklist(asset);  // returns L1-L5 inspection data if mapped

  if (!tpl && !rich) {
    return `<div class="page">
      ${pageH(`${esc(asset.id)}`, `No checklist template defined for type ${esc(getAssetType(asset) || '?')}.`,
        `<button class="btn btn-soft btn-sm" onclick="setView('equipment')">← Equipment</button>`)}
      <div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">
        Add a template for this asset type to enable phase-by-phase checklists.
      </div>
    </div>`;
  }

  // Default to rich view if available; user can toggle to standard
  if (state.assetDetailMode === 'rich' && rich) {
    return renderAssetDetailRich(asset, rich, tpl);
  }
  if (!tpl && rich) {
    state.assetDetailMode = 'rich';
    return renderAssetDetailRich(asset, rich, tpl);
  }

  const phases = Object.keys(tpl.phases);
  const currentPhase = state.assetDetailPhase && tpl.phases[state.assetDetailPhase] ? state.assetDetailPhase : phases[0];
  const phaseDef = tpl.phases[currentPhase];
  const cs = checklistStatus(id, currentPhase);
  const ownerPersona = phaseDef.owner ? Object.values(PERSONAS).find(p => p.roleType === phaseDef.owner) : null;
  const stageClass = String(asset.stage).toLowerCase();
  const oem = asset.oem ? COMPANIES[asset.oem] : null;

  // Mode toggle (only show if rich is available)
  const modeToggle = rich ? `<div style="display:inline-flex; gap:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-right:8px">
    <button class="btn btn-sm" style="border:0; border-radius:0; background:var(--brand); color:#fff; padding:6px 12px; font-size:11px">Standard</button>
    <button class="btn btn-sm" style="border:0; border-radius:0; background:var(--bg); padding:6px 12px; font-size:11px" onclick="state.assetDetailMode='rich'; render()">📋 Full inspection (L1-L5)</button>
  </div>` : '';

  // Header
  let h = `<div class="page" style="max-width:1200px">
    ${pageH(`${esc(asset.id)} · ${esc(tpl.name)}`,
      `${esc(asset.name || asset.id)} · ${oem ? esc(oem.name) : '?'} · ${asset.proc ? esc(asset.proc) : ''}`,
      `<button class="btn btn-soft btn-sm" onclick="setView('equipment')">← Equipment</button>
       ${modeToggle}
       <button class="btn btn-pri btn-sm" onclick="openAdvancePhaseModal('${esc(id)}')">⏭ Advance phase</button>`
    )}

    <div class="asset-detail-h">
      <div>
        <div class="kicker" style="margin-bottom:4px">CURRENT STAGE</div>
        <span class="stage-pill ${esc(stageClass)}">${esc(STAGE_LABELS[asset.stage] || asset.stage)}</span>
        <span style="margin-left:14px; font-size:13px; color:var(--text-muted)">Lifecycle: ${asset.lifecycle.join(' → ')}</span>
      </div>
      <div style="text-align:right; font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono', monospace">
        ${asset.model ? 'MODEL ' + esc(asset.model) : ''}<br>
        ${asset.serial ? 'S/N ' + esc(asset.serial) : ''}
      </div>
    </div>`;

  // Phase tab strip
  h += `<div class="phase-tab-row">`;
  for (const p of phases) {
    const ps = checklistStatus(id, p);
    const cls = (currentPhase === p ? 'active ' : '') + ps.status;
    let statusText = '';
    if (ps.status === 'complete')    statusText = `✓ ${ps.passed}/${ps.totalItems}`;
    else if (ps.status === 'failed') statusText = `✗ ${ps.failed} fail`;
    else if (ps.status === 'in_progress') statusText = `${ps.completed}/${ps.totalItems}`;
    else                              statusText = `${ps.totalItems} items`;
    h += `<div class="phase-tab ${cls}" onclick="state.assetDetailPhase='${esc(p)}'; render()">
      ${esc(p)}
      <span class="phase-tab-status">${esc(statusText)}</span>
    </div>`;
  }
  h += `</div>`;

  // Phase header
  h += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:12px">
    <div>
      <h3 style="margin:0; font-size:16px">${esc(phaseDef.name)}</h3>
      <div style="font-size:12px; color:var(--text-muted); margin-top:2px">
        Owner: <b>${ownerPersona ? esc(ownerPersona.name) + ' · ' + esc((COMPANIES[ownerPersona.company]||{}).name||'') : esc(phaseDef.owner)}</b>
        · Status: <b style="color:${cs.status === 'complete' ? 'var(--green)' : cs.status === 'failed' ? 'var(--red)' : cs.status === 'in_progress' ? 'var(--accent)' : 'var(--text-muted)'}">${esc(cs.status.replace('_',' '))}</b>
        · ${cs.completed}/${cs.totalItems} done
      </div>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap">
      <button class="btn btn-soft btn-sm" onclick="bulkChecklistMark('${esc(id)}','${esc(currentPhase)}','pass')">✓ Mark all PASS</button>
      <button class="btn btn-soft btn-sm" onclick="bulkChecklistMark('${esc(id)}','${esc(currentPhase)}','reset')">↻ Reset</button>
    </div>
  </div>`;

  // Checklist items
  const METHOD_ICONS = { visual:'👁', test:'🔬', meas:'📏', func:'⚡', doc:'📄' };
  const METHOD_LABELS = { visual:'Visual', test:'Test', meas:'Measurement', func:'Functional', doc:'Document' };

  for (let i = 0; i < phaseDef.items.length; i++) {
    const raw = phaseDef.items[i];
    // Normalize: string → object with text only
    const item = typeof raw === 'string' ? { text: raw } : raw;
    const itemText = item.text || item.title || '';
    const key = `${id}|${currentPhase}|${i}`;
    const r = CHECKLIST_RESPONSES[key];
    const status = r ? r.status : '';
    const hasDetail = item.criteria || item.pass || item.fail || item.method || item.ref;
    const expandedKey = `${id}|${currentPhase}|${i}|expanded`;
    const isExpanded = state.expandedChecklistItems && state.expandedChecklistItems[expandedKey];

    h += `<div class="checklist-item ${esc(status)}${item.crit ? ' crit' : ''}">
      <div class="checklist-item-num">${String(i+1).padStart(2,'0')}${item.crit ? '<div style="font-size:8px;color:var(--red);font-weight:700;margin-top:2px">CRIT</div>' : ''}</div>
      <div>
        <div class="checklist-item-text">
          ${item.method ? `<span title="${esc(METHOD_LABELS[item.method]||'')}" style="margin-right:4px">${esc(METHOD_ICONS[item.method]||'')}</span>` : ''}
          ${esc(itemText)}
          ${item.ref ? `<span style="margin-left:6px; font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--brand-fade); color:var(--brand-h); padding:2px 6px; border-radius:3px">${esc(item.ref)}</span>` : ''}
          ${hasDetail ? `<button onclick="toggleChecklistDetail('${esc(expandedKey)}')" style="margin-left:8px; padding:2px 8px; font-size:10px; background:var(--bg-soft); border:1px solid var(--border); border-radius:3px; cursor:pointer; font-family:inherit">${isExpanded ? '▾ less' : '▸ details'}</button>` : ''}
          <button onclick="openChecklistItemEdit('${esc(id)}','${esc(currentPhase)}',${i})" style="margin-left:4px; padding:2px 8px; font-size:10px; background:var(--bg-soft); border:1px solid var(--border); border-radius:3px; cursor:pointer; font-family:inherit" title="Add value, comments, sign-off">📝 ${r && (r.value || r.comments || r.verifiedBy) ? 'edit details' : 'add details'}</button>
        </div>
        ${isExpanded && hasDetail ? `<div style="margin-top:8px; padding:10px 12px; background:var(--bg-soft); border-radius:6px; font-size:12px; line-height:1.55">
          ${item.criteria ? `<div style="margin-bottom:6px"><b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted)">CRITERIA</b><div>${esc(item.criteria)}</div></div>` : ''}
          ${item.pass ? `<div style="margin-bottom:6px"><b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--green)">✓ PASS</b><div>${esc(item.pass)}</div></div>` : ''}
          ${item.fail ? `<div><b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--red)">✗ FAIL</b><div>${esc(item.fail)}</div></div>` : ''}
        </div>` : ''}
        ${r && r.value ? `<div style="margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap">
          <span style="font-size:9px; letter-spacing:0.05em; color:var(--text-muted); font-weight:700">VALUE</span>
          <span style="padding:3px 8px; background:#fef3c7; border:1px solid #fbbf24; color:#78350f; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600">${esc(r.value)}</span>
        </div>` : ''}
        ${r && r.comments ? `<div style="margin-top:6px; padding:8px 10px; background:var(--bg-soft); border-left:3px solid var(--brand-soft); border-radius:0 4px 4px 0; font-size:11px; line-height:1.5; color:var(--text)">
          <span style="font-size:9px; letter-spacing:0.05em; color:var(--text-muted); font-weight:700; display:block; margin-bottom:2px">💬 COMMENTS</span>
          ${esc(r.comments)}
        </div>` : ''}
        ${r && (r.performedBy || r.verifiedBy || r.by) ? `<div style="margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; font-size:10px; font-family:'JetBrains Mono',monospace">
          ${r.performedBy || r.by ? `<div style="display:flex; align-items:center; gap:6px">
            <span style="display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--brand-fade); color:var(--brand-h); border-radius:3px; font-size:8px; font-weight:800">✓</span>
            <span><b style="color:var(--text)">${esc((PERSONAS[r.performedBy||r.by]||{}).name||r.performedBy||r.by)}</b><span style="color:var(--text-muted)"> performed${r.performedDate || r.date ? ' · ' + esc(r.performedDate||r.date) : ''}</span></span>
          </div>` : ''}
          ${r.verifiedBy ? `<div style="display:flex; align-items:center; gap:6px">
            <span style="display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; background:var(--green-soft); color:#166534; border-radius:3px; font-size:8px; font-weight:800">✓✓</span>
            <span><b style="color:var(--text)">${esc((PERSONAS[r.verifiedBy]||{}).name||r.verifiedBy)}</b><span style="color:var(--text-muted)"> verified${r.verifiedDate ? ' · ' + esc(r.verifiedDate) : ''}</span></span>
          </div>` : r.status === 'pass' || r.status === 'fail' ? `<div style="display:flex; align-items:center; gap:6px; color:var(--accent)">
            <span>⚠ awaiting QA verification</span>
          </div>` : ''}
        </div>` : ''}
      </div>
      <div class="checklist-item-actions">
        <button class="checklist-pf-btn ${status === 'pass' ? 'active pass' : ''}" onclick="markChecklistItem('${esc(id)}','${esc(currentPhase)}',${i},'pass')">PASS</button>
        <button class="checklist-pf-btn ${status === 'fail' ? 'active fail' : ''}" onclick="markChecklistItem('${esc(id)}','${esc(currentPhase)}',${i},'fail')">FAIL</button>
        <button class="checklist-pf-btn ${status === 'na' ? 'active na' : ''}" onclick="markChecklistItem('${esc(id)}','${esc(currentPhase)}',${i},'na')">N/A</button>
      </div>
    </div>`;
  }

  if (cs.failed > 0) {
    h += `<div style="background:var(--red-soft); border:1px solid var(--red); border-radius:8px; padding:14px 18px; margin-top:14px; font-size:13px; color:#991b1b; line-height:1.55">
      ⚠ <b>${cs.failed} item(s) failed.</b> Failed items typically require an NCR or punch item. <button class="btn btn-pri btn-sm" onclick="openNCRForm()" style="margin-left:8px">+ Raise NCR</button> <button class="btn btn-soft btn-sm" onclick="openPunchForm()" style="margin-left:4px">+ Raise punch</button>
    </div>`;
  }

  // ─── Required tests catalog ───
  h += renderAssetTestCatalog(asset);

  // ─── Issues for this asset (ISSUES) + Handoffs ───
  const assetIdParts = id.split('-');
  const lastSeg = assetIdParts[assetIdParts.length - 1];
  const typePart = getAssetType(asset);
  function matchesAsset(linkedAsset) {
    if (!linkedAsset) return false;
    if (linkedAsset === id) return true;
    if (linkedAsset.includes(id)) return true;
    if (linkedAsset.startsWith(typePart + '-') && linkedAsset.endsWith(lastSeg)) return true;
    return false;
  }
  const assetIssues = ISSUES.filter(i => matchesAsset(i.asset));
  const assetHandoffs = HANDOFFS.filter(ho => matchesAsset(ho.assetId));
  const assetNCRs = NCRS.filter(n => matchesAsset(n.asset));

  // Issues for this asset
  if (assetIssues.length > 0) {
    h += `<div style="margin-top:24px">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
        <h3 style="margin:0; font-size:15px">🔔 Issues for this asset (${assetIssues.length})</h3>
        <div style="display:flex; gap:6px">
          <button class="btn btn-soft btn-sm" onclick="openRaiseIssueForm({asset:'${esc(id)}'})">+ Raise issue</button>
        </div>
      </div>`;
    for (const iss of assetIssues.slice(0, 8)) {
      const prio = ISSUE_PRIORITY[iss.priority] || ISSUE_PRIORITY.med;
      const stat = ISSUE_STATUS[iss.status] || ISSUE_STATUS.open;
      const overdue = issueIsOverdue(iss);
      const cmts = issueComments(iss.id).length;
      h += `<div onclick="openIssueDetail('${esc(iss.id)}')" style="border:1px solid var(--border); border-left:4px solid ${prio.color}; border-radius:6px; padding:10px 14px; margin-bottom:6px; cursor:pointer; background:${overdue?'var(--red-soft)':'var(--bg)'}">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap">
          <div style="flex:1 1 300px">
            <span style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:800; color:${prio.color}; padding:2px 6px; background:${prio.color}22; border-radius:3px; margin-right:6px">${prio.label}</span>
            <b class="mono" style="font-size:10px; color:var(--text-muted)">${esc(iss.id)}</b>
            <span style="margin-left:8px; font-size:13px">${esc((iss.title||'').substring(0, 90))}</span>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center">
            <span class="tag gray" style="font-size:9px">${esc(iss.discipline)}</span>
            ${cmts > 0 ? `<span style="font-size:10px; color:var(--text-muted)">💬 ${cmts}</span>` : ''}
            <span style="padding:2px 8px; background:${stat.bg}; color:${stat.color}; border-radius:3px; font-size:9px; font-weight:800">${stat.label.toUpperCase()}</span>
          </div>
        </div>
      </div>`;
    }
    h += `</div>`;
  } else {
    h += `<div style="margin-top:24px; display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--green-soft); border-radius:8px">
      <span style="font-size:13px; color:#166534">✓ No open issues for this asset</span>
      <button class="btn btn-soft btn-sm" onclick="openRaiseIssueForm({asset:'${esc(id)}'})">+ Raise issue</button>
    </div>`;
  }

  // Handoffs for this asset
  if (assetHandoffs.length > 0) {
    h += `<div style="margin-top:18px">
      <h3 style="margin:0 0 10px 0; font-size:15px">🤝 Phase handoff log (${assetHandoffs.length})</h3>`;
    for (const ho of assetHandoffs) {
      const fromCo = COMPANIES[ho.fromCompany];
      const toCo = COMPANIES[ho.toCompany];
      const statusColor = ho.status === 'acknowledged' ? 'var(--green)' : ho.status === 'rejected' ? 'var(--red)' : 'var(--accent)';
      const statusBg = ho.status === 'acknowledged' ? 'var(--green-soft)' : ho.status === 'rejected' ? 'var(--red-soft)' : 'var(--accent-soft)';
      const statusLabel = ho.status === 'acknowledged' ? '✓ ACKED' : ho.status === 'rejected' ? '✗ REJECTED' : '⏳ PENDING';
      h += `<div onclick="openHandoffDetail('${esc(ho.id)}')" style="display:grid; grid-template-columns:1fr auto; gap:12px; padding:10px 14px; border:1px solid var(--border); border-left:4px solid ${statusColor}; border-radius:6px; margin-bottom:6px; cursor:pointer; background:var(--bg)">
        <div>
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700">${esc(ho.fromPhase)}</span>
          <span style="margin:0 6px; color:var(--brand)">→</span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700">${esc(ho.toPhase)}</span>
          <span style="margin-left:10px; font-size:11px; color:var(--text-muted)">${esc(fromCo ? fromCo.name : ho.fromCompany)} → ${esc(toCo ? toCo.name : ho.toCompany)}</span>
          <div style="font-size:10px; color:var(--text-muted); margin-top:3px">${esc(ho.atDate||'')}${ho.notes ? ' · ' + esc(ho.notes.substring(0, 80)) + (ho.notes.length>80?'…':'') : ''}</div>
        </div>
        <div style="text-align:right">
          <span style="padding:3px 8px; background:${statusBg}; color:${statusColor}; border-radius:3px; font-size:10px; font-weight:800; letter-spacing:0.05em">${statusLabel}</span>
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  // Formal NCRs (separate section, less common)
  if (assetNCRs.length > 0) {
    h += `<div style="margin-top:18px">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
        <h3 style="margin:0; font-size:15px">⚠ Formal NCRs (${assetNCRs.length})</h3>
        <span style="font-size:10px; color:var(--text-muted)">For escalation when issues can't be closed in SLA</span>
      </div>`;
    for (const n of assetNCRs.slice(0, 4)) {
      const sevColor = n.severity === 'critical' ? 'var(--red)' : n.severity === 'major' ? 'var(--accent)' : 'var(--text-muted)';
      h += `<div style="border:1px solid var(--border); border-left:4px solid ${sevColor}; border-radius:6px; padding:8px 14px; margin-bottom:6px; font-size:12px">
        <b class="mono" style="font-size:10px; color:${sevColor}">${esc(n.num||n.id)}</b>
        <span style="margin-left:8px">${esc((n.title||n.desc||n.description||'').substring(0, 90))}</span>
      </div>`;
    }
    h += `</div>`;
  }

  h += `</div>`;
  return h;
}

// ─── RICH ASSET DETAIL · uses LEVELS + TESTS from L1-L5 inspector ───
function renderAssetDetailRich(asset, rich, tpl) {
  const id = asset.id;
  const stageClass = String(asset.stage).toLowerCase();
  const oem = asset.oem ? COMPANIES[asset.oem] : null;
  const levels = Object.keys(rich);  // L1, L2, L3, L4, L5 (only those present)
  const currentLevel = state.assetDetailLevel && rich[state.assetDetailLevel] ? state.assetDetailLevel : levels[0];
  const levelMeta = LEVELS[currentLevel] || {};
  const assetData = rich[currentLevel];
  const METHOD_ICONS_RICH = { visual:'👁', test:'🔬', meas:'📏', func:'⚡', doc:'📄' };
  const METHOD_LABELS = { visual:'Visual', test:'Test', meas:'Measurement', func:'Functional', doc:'Document' };

  // Mode toggle (only show if standard template also exists)
  const modeToggle = tpl ? `<div style="display:inline-flex; gap:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-right:8px">
    <button class="btn btn-sm" style="border:0; border-radius:0; background:var(--bg); padding:6px 12px; font-size:11px" onclick="state.assetDetailMode='standard'; render()">Standard</button>
    <button class="btn btn-sm" style="border:0; border-radius:0; background:var(--brand); color:#fff; padding:6px 12px; font-size:11px">📋 Full inspection (L1-L5)</button>
  </div>` : '';

  let h = `<div class="page" style="max-width:1200px">
    ${pageH(`${esc(asset.id)} · ${esc(asset.name || asset.id)} · Inspection Detail`,
      `Full L1-L5 inspection content per ${esc(getAssetType(asset))} type · ${oem ? esc(oem.name) : '?'}`,
      `<button class="btn btn-soft btn-sm" onclick="setView('equipment')">← Equipment</button>
       ${modeToggle}
       <button class="btn btn-pri btn-sm" onclick="openAdvancePhaseModal('${esc(id)}')">⏭ Advance phase</button>`
    )}

    <div class="asset-detail-h">
      <div>
        <div class="kicker" style="margin-bottom:4px">CURRENT STAGE</div>
        <span class="stage-pill ${esc(stageClass)}">${esc(STAGE_LABELS[asset.stage] || asset.stage)}</span>
      </div>
      <div style="text-align:right; font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono', monospace">
        ${asset.model ? 'MODEL ' + esc(asset.model) : ''}<br>
        ${asset.serial ? 'S/N ' + esc(asset.serial) : ''}
      </div>
    </div>`;

  // Level tab strip
  h += `<div class="phase-tab-row">`;
  for (const lvl of levels) {
    const lm = LEVELS[lvl] || {};
    const cls = (currentLevel === lvl ? 'active' : '');
    // Count items + status for this level
    let total = 0, done = 0, fail = 0;
    if (rich[lvl] && rich[lvl].groups) {
      for (let gi = 0; gi < rich[lvl].groups.length; gi++) {
        for (let ii = 0; ii < rich[lvl].groups[gi].items.length; ii++) {
          total++;
          const r = CHECKLIST_RESPONSES[`rich:${id}|${lvl}|${gi}|${ii}`];
          if (r) {
            done++;
            if (r.status === 'fail') fail++;
          }
        }
      }
    }
    const status = fail > 0 ? `✗ ${fail} fail` : done === total && total > 0 ? `✓ ${done}/${total}` : done > 0 ? `${done}/${total}` : `${total} items`;
    h += `<div class="phase-tab ${cls}" onclick="state.assetDetailLevel='${esc(lvl)}'; render()" style="min-width:90px">
      <div>${esc(lm.short || lvl)}</div>
      <span class="phase-tab-status">${esc(status)}</span>
    </div>`;
  }
  h += `</div>`;

  // Level header (uses the LEVELS metadata - banner has intentional HTML from user data)
  h += `<div style="margin-bottom:14px">
    <h3 style="margin:0 0 4px; font-size:16px">${esc(levelMeta.name || currentLevel)}</h3>
    <div style="font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-bottom:8px">${esc(levelMeta.timing || '')}</div>
    ${levelMeta.banner ? `<div style="background:var(--brand-fade); border-left:3px solid var(--brand); padding:10px 14px; border-radius:4px; font-size:12px; color:var(--brand-h); line-height:1.6">${levelMeta.banner}</div>` : ''}
  </div>`;

  // Asset description for this level
  if (assetData.desc) {
    h += `<div style="font-size:13px; color:var(--text); margin-bottom:14px; line-height:1.55; padding:10px 14px; background:var(--bg-soft); border-radius:6px">${esc(assetData.desc)}</div>`;
  }

  // Bulk actions
  h += `<div style="display:flex; justify-content:flex-end; gap:6px; margin-bottom:10px">
    <button class="btn btn-soft btn-sm" onclick="bulkChecklistMarkRich('${esc(id)}','${esc(currentLevel)}','pass')">✓ Mark all PASS</button>
    <button class="btn btn-soft btn-sm" onclick="bulkChecklistMarkRich('${esc(id)}','${esc(currentLevel)}','reset')">↻ Reset</button>
  </div>`;

  // Render groups → items
  for (let gi = 0; gi < assetData.groups.length; gi++) {
    const g = assetData.groups[gi];
    h += `<div style="margin-top:18px; margin-bottom:10px"><h4 style="font-size:13px; font-weight:700; color:var(--brand-h); border-bottom:2px solid var(--brand-fade); padding-bottom:6px; margin:0">${esc(g.title)}</h4></div>`;
    for (let ii = 0; ii < g.items.length; ii++) {
      const item = g.items[ii];
      const itemText = item.title || item.text || '';
      const key = `rich:${id}|${currentLevel}|${gi}|${ii}`;
      const r = CHECKLIST_RESPONSES[key];
      const status = r ? r.status : '';
      const expandKey = `${key}|expanded`;
      const isExpanded = state.expandedChecklistItems && state.expandedChecklistItems[expandKey];
      const hasDetail = item.criteria || item.pass || item.fail;

      h += `<div class="checklist-item ${esc(status)}${item.crit ? ' crit' : ''}">
        <div class="checklist-item-num">${String(ii+1).padStart(2,'0')}${item.crit ? '<div style="font-size:8px;color:var(--red);font-weight:700;margin-top:2px">CRIT</div>' : ''}</div>
        <div>
          <div class="checklist-item-text">
            ${item.method ? `<span title="${esc(METHOD_LABELS[item.method]||'')}" style="margin-right:4px">${esc(METHOD_ICONS_RICH[item.method]||'')}</span>` : ''}
            ${esc(itemText)}
            ${item.subph ? `<span style="margin-left:6px; font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--accent-soft); color:#92400e; padding:2px 6px; border-radius:3px">${esc(item.subph)}</span>` : ''}
            ${item.ref ? `<span style="margin-left:6px; font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--brand-fade); color:var(--brand-h); padding:2px 6px; border-radius:3px">${esc(item.ref)}</span>` : ''}
            ${hasDetail ? `<button onclick="toggleChecklistDetail('${esc(expandKey)}')" style="margin-left:8px; padding:2px 8px; font-size:10px; background:var(--bg-soft); border:1px solid var(--border); border-radius:3px; cursor:pointer; font-family:inherit">${isExpanded ? '▾ less' : '▸ details'}</button>` : ''}
          </div>
          ${isExpanded && hasDetail ? `<div style="margin-top:8px; padding:10px 12px; background:var(--bg-soft); border-radius:6px; font-size:12px; line-height:1.55">
            ${item.criteria ? `<div style="margin-bottom:6px"><b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted)">CRITERIA</b><div>${esc(item.criteria)}</div></div>` : ''}
            ${item.pass ? `<div style="margin-bottom:6px"><b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--green)">✓ PASS</b><div>${esc(item.pass)}</div></div>` : ''}
            ${item.fail ? `<div><b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--red)">✗ FAIL</b><div>${esc(item.fail)}</div></div>` : ''}
          </div>` : ''}
          ${r && r.by ? `<div style="font-size:10px; color:var(--text-muted); margin-top:6px; font-family:'JetBrains Mono',monospace">${esc((PERSONAS[r.by]||{}).name||r.by)} · ${esc(r.date||'')}</div>` : ''}
        </div>
        <div class="checklist-item-actions">
          <button class="checklist-pf-btn ${status === 'pass' ? 'active pass' : ''}" onclick="markChecklistItemRich('${esc(id)}','${esc(currentLevel)}',${gi},${ii},'pass')">PASS</button>
          <button class="checklist-pf-btn ${status === 'fail' ? 'active fail' : ''}" onclick="markChecklistItemRich('${esc(id)}','${esc(currentLevel)}',${gi},${ii},'fail')">FAIL</button>
          <button class="checklist-pf-btn ${status === 'na' ? 'active na' : ''}" onclick="markChecklistItemRich('${esc(id)}','${esc(currentLevel)}',${gi},${ii},'na')">N/A</button>
        </div>
      </div>`;
    }
  }

  h += `</div>`;
  return h;
}

function markChecklistItemRich(assetId, level, groupIdx, itemIdx, status) {
  const key = `rich:${assetId}|${level}|${groupIdx}|${itemIdx}`;
  if (CHECKLIST_RESPONSES[key] && CHECKLIST_RESPONSES[key].status === status) {
    delete CHECKLIST_RESPONSES[key];
  } else {
    CHECKLIST_RESPONSES[key] = { status, by: state.personaId, date: todayStr() };
  }
  saveUserData();
  render();
}

function bulkChecklistMarkRich(assetId, level, status) {
  const asset = EQUIPMENT.find(e => e.id === assetId);
  const rich = getRichChecklist(asset);
  if (!rich || !rich[level]) return;
  let count = 0;
  for (let gi = 0; gi < rich[level].groups.length; gi++) {
    for (let ii = 0; ii < rich[level].groups[gi].items.length; ii++) {
      const key = `rich:${assetId}|${level}|${gi}|${ii}`;
      if (status === 'reset') delete CHECKLIST_RESPONSES[key];
      else CHECKLIST_RESPONSES[key] = { status, by: state.personaId, date: todayStr() };
      count++;
    }
  }
  saveUserData();
  toast(status === 'reset' ? `Reset ${count} items` : `Marked ${count} items as ${status.toUpperCase()}`, 'success');
  render();
}


function markChecklistItem(assetId, phaseKey, itemIdx, status) {
  const key = `${assetId}|${phaseKey}|${itemIdx}`;
  const existing = CHECKLIST_RESPONSES[key] || {};
  if (existing.status === status) {
    // toggle off only the status, keep value/comments/sigs if present
    if (existing.value || existing.comments || existing.verifiedBy) {
      CHECKLIST_RESPONSES[key] = { ...existing, status: null };
    } else {
      delete CHECKLIST_RESPONSES[key];
    }
  } else {
    CHECKLIST_RESPONSES[key] = {
      ...existing,
      status,
      performedBy: existing.performedBy || state.personaId,
      performedDate: existing.performedDate || todayStr(),
      by: existing.by || state.personaId,    // legacy
      date: existing.date || todayStr(),     // legacy
    };
  }
  saveUserData();
  render();
}

function toggleChecklistDetail(key) {
  if (!state.expandedChecklistItems) state.expandedChecklistItems = {};
  state.expandedChecklistItems[key] = !state.expandedChecklistItems[key];
  render();
}

function bulkChecklistMark(assetId, phaseKey, status) {
  const asset = EQUIPMENT.find(e => e.id === assetId);
  const tpl = getChecklistTemplate(asset);
  if (!tpl || !tpl.phases[phaseKey]) return;
  const items = tpl.phases[phaseKey].items;
  for (let i = 0; i < items.length; i++) {
    const key = `${assetId}|${phaseKey}|${i}`;
    if (status === 'reset') delete CHECKLIST_RESPONSES[key];
    else {
      const existing = CHECKLIST_RESPONSES[key] || {};
      CHECKLIST_RESPONSES[key] = {
        ...existing,
        status,
        performedBy: existing.performedBy || state.personaId,
        performedDate: existing.performedDate || todayStr(),
        by: existing.by || state.personaId,
        date: existing.date || todayStr(),
      };
    }
  }
  saveUserData();
  toast(status === 'reset' ? `Reset ${items.length} items` : `Marked ${items.length} items as ${status.toUpperCase()}`, 'success');
  render();
}

// Value placeholder hint based on item method + asset class
function valueHintForItem(item, assetCls) {
  const m = (typeof item === 'object' && item.method) || '';
  const txt = (typeof item === 'object' && item.title || item.text || '').toLowerCase();
  // Detect specific test patterns from item text
  if (txt.includes('insulation') || txt.includes('megger') || txt.includes('ir test')) {
    return 'e.g.  Phase A-G: 8.4 GΩ · B-G: 7.9 GΩ · C-G: 8.1 GΩ · abs ratio 1.4';
  }
  if (txt.includes('hi-pot') || txt.includes('dielectric')) {
    return 'e.g.  38 kV applied 60 sec · leakage 0.3 mA stable · no flashover';
  }
  if (txt.includes('contact resistance') || txt.includes('ductor')) {
    return 'e.g.  Pole A: 142 µΩ · B: 138 µΩ · C: 145 µΩ · within OEM 150 µΩ';
  }
  if (txt.includes('torque')) {
    return 'e.g.  All lugs torqued to 350 in-lb · paint stripe applied · 24/24 lugs verified';
  }
  if (txt.includes('phase rotation')) {
    return 'e.g.  A-B-C confirmed at incoming terminals · phase meter SN: PR-4421';
  }
  if (txt.includes('pressure') || txt.includes('hydrostatic')) {
    return 'e.g.  150 PSI applied · held 4 hr · no decay · gauge SN: PG-7782';
  }
  if (txt.includes('leak')) {
    return 'e.g.  Electronic detector at all joints · no leaks · sniffer SN: LD-2298';
  }
  if (txt.includes('vibration')) {
    return 'e.g.  Bearing housing 0.12 in/s peak · sound 78 dBA at 3 ft';
  }
  if (txt.includes('refrigerant') && txt.includes('charge')) {
    return 'e.g.  R-134a · 24 lb per nameplate · field added 2 lb · lot #G2025-887';
  }
  if (txt.includes('voltage') || txt.includes('voltage check')) {
    return 'e.g.  A-B: 480.2V · B-C: 481.0V · C-A: 479.8V · 60.01 Hz';
  }
  if (txt.includes('alignment')) {
    return 'e.g.  Coupling alignment 0.003" · within 0.005" tolerance · laser SN: AL-9912';
  }
  if (txt.includes('flow')) {
    return 'e.g.  680 GPM at 60 ft head · pump curve verified';
  }
  if (txt.includes('approach')) {
    return 'e.g.  Evap approach 1.8°F · Cond approach 2.1°F · within ±1°F design';
  }
  // Method-based fallback
  if (m === 'test')   return assetCls === 'mechanical' ? 'e.g.  Test reading + units · spec compliance' : 'e.g.  Phase A: __ · Phase B: __ · Phase C: __ · units';
  if (m === 'meas')   return assetCls === 'mechanical' ? 'e.g.  Measured value · units · spec' : 'e.g.  Voltage / current / resistance reading + units';
  if (m === 'visual') return 'Observation noted (e.g. Acceptable · no defects · photo PHO-123)';
  if (m === 'func')   return 'e.g.  Operated as expected · trip at 110% setpoint · 3.2s recovery';
  if (m === 'doc')    return 'e.g.  Cert # ABC-123 Rev 2 · filed in CxAlloy · signed by OEM';
  return 'Measured value or observation';
}

function openChecklistItemEdit(assetId, phaseKey, itemIdx) {
  const asset = EQUIPMENT.find(e => e.id === assetId);
  if (!asset) { toast('Asset not found','error'); return; }
  const tpl = getChecklistTemplate(asset);
  if (!tpl || !tpl.phases[phaseKey]) return;
  const itemRaw = tpl.phases[phaseKey].items[itemIdx];
  const isRich = typeof itemRaw === 'object';
  const itemText = isRich ? (itemRaw.title || itemRaw.text) : itemRaw;
  const key = `${assetId}|${phaseKey}|${itemIdx}`;
  const r = CHECKLIST_RESPONSES[key] || {};
  const hint = valueHintForItem(itemRaw, tpl.cls);
  const me_ = me();
  const me_name = me_ ? me_.name : '';
  const performedBy = r.performedBy || r.by || state.personaId;
  const performedDate = r.performedDate || r.date || '';
  const performedPersona = PERSONAS[performedBy] || me_;
  const verifiedPersona = r.verifiedBy ? PERSONAS[r.verifiedBy] : null;

  // Status options
  const statusOpts = [
    { v:'pass', label:'PASS', cls:'green' },
    { v:'fail', label:'FAIL', cls:'red' },
    { v:'na',   label:'N/A',  cls:'gray' },
  ];
  const currentStatus = r.status || '';

  // Build other companies' personas eligible to verify
  const myCo = (PERSONAS[state.personaId]||{}).company;
  const verifierCandidates = Object.values(PERSONAS).filter(p => {
    if (p.id === state.personaId) return false; // not self
    // Allow any QA/QC role or management role for verification
    const rt = (p.roleType||'').toLowerCase();
    return rt.includes('qaqc') || rt.includes('pm') || rt.includes('lead') || rt.includes('cxa') || rt.includes('super');
  }).slice(0, 30); // cap

  let body = `<div style="margin-bottom:14px">
    <div class="kicker" style="margin-bottom:4px">CHECKLIST ITEM</div>
    <div style="font-size:14px; font-weight:600; line-height:1.4">${esc(itemText)}</div>
    ${isRich && itemRaw.crit ? '<span style="display:inline-block; margin-top:6px; padding:2px 8px; background:var(--red); color:#fff; font-size:9px; font-weight:800; border-radius:3px; letter-spacing:0.05em">⚠ CRITICAL HOLD POINT</span>' : ''}
    ${isRich && itemRaw.ref ? '<span style="display:inline-block; margin-left:6px; margin-top:6px; padding:2px 8px; background:var(--brand-fade); color:var(--brand-h); font-size:10px; font-family:&#39;JetBrains Mono&#39;,monospace; border-radius:3px">' + esc(itemRaw.ref) + '</span>' : ''}
  </div>`;

  // Show pass/fail criteria for reference
  if (isRich && (itemRaw.criteria || itemRaw.pass || itemRaw.fail)) {
    body += `<div style="background:var(--bg-soft); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-bottom:14px; font-size:11px; line-height:1.55">
      ${itemRaw.criteria ? `<div style="margin-bottom:6px"><b style="font-size:9px; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">CRITERIA</b><div>${esc(itemRaw.criteria)}</div></div>` : ''}
      ${itemRaw.pass ? `<div style="margin-bottom:4px"><b style="font-size:9px; letter-spacing:0.05em; color:var(--green); text-transform:uppercase">✓ PASS</b><div>${esc(itemRaw.pass)}</div></div>` : ''}
      ${itemRaw.fail ? `<div><b style="font-size:9px; letter-spacing:0.05em; color:var(--red); text-transform:uppercase">✗ FAIL</b><div>${esc(itemRaw.fail)}</div></div>` : ''}
    </div>`;
  }

  // Status toggle
  body += `<div style="margin-bottom:14px">
    <div class="kicker" style="margin-bottom:6px">STATUS</div>
    <div style="display:flex; gap:6px">`;
  for (const o of statusOpts) {
    const active = currentStatus === o.v;
    body += `<button type="button" id="cle_status_${o.v}" class="cle-status-btn ${active ? 'active '+o.cls : ''}" onclick="cleStatusPick('${o.v}')" style="flex:1; padding:10px 12px; font-weight:700; font-family:'JetBrains Mono',monospace; font-size:12px; border:2px solid ${active ? (o.cls==='green'?'var(--green)':o.cls==='red'?'var(--red)':'var(--text-muted)') : 'var(--border-strong)'}; background:${active ? (o.cls==='green'?'var(--green)':o.cls==='red'?'var(--red)':'var(--text-muted)') : 'var(--bg)'}; color:${active ? '#fff' : 'var(--text)'}; border-radius:6px; cursor:pointer; transition:all 0.15s">${o.label}</button>`;
  }
  body += `</div></div>`;

  // Hidden field for current status
  body += `<input type="hidden" id="cle_status" value="${esc(currentStatus)}">`;

  // Measured value
  body += `<div style="margin-bottom:14px">
    <div class="kicker" style="margin-bottom:6px">MEASURED VALUE / READING</div>
    <input type="text" id="cle_value" value="${esc(r.value || '')}" placeholder="${esc(hint)}" style="width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; font-family:'JetBrains Mono', monospace; background:var(--bg)">
    <div style="font-size:10px; color:var(--text-muted); margin-top:4px">${tpl.cls === 'mechanical' ? 'Mechanical: pressure / flow / temp / vibration · units' : tpl.cls === 'electrical' ? 'Electrical: voltage / current / IR / torque · units' : tpl.cls === 'controls' ? 'Controls: point address · value · BMS reading' : 'Reading + units'}</div>
  </div>`;

  // Comments
  body += `<div style="margin-bottom:14px">
    <div class="kicker" style="margin-bottom:6px">COMMENTS · NOTES</div>
    <textarea id="cle_comments" rows="3" placeholder="Field notes · investigation steps · concerns · references to drawings or photos" style="width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:6px; font-size:13px; resize:vertical; background:var(--bg); font-family:inherit; line-height:1.5">${esc(r.comments || '')}</textarea>
  </div>`;

  // Sign-off · Performed by + Verified by
  body += `<div style="margin-bottom:14px">
    <div class="kicker" style="margin-bottom:6px">SIGN-OFF</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
      <div>
        <div style="font-size:10px; color:var(--text-muted); margin-bottom:4px; font-weight:600">PERFORMED BY (tech / operator)</div>
        <div style="padding:10px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg-soft); font-size:12px">
          <b>${esc(performedPersona ? performedPersona.name : me_name)}</b><br>
          <span style="font-size:10px; color:var(--text-muted)">${performedPersona && performedPersona.company ? esc((COMPANIES[performedPersona.company]||{}).name||'') : ''}${performedDate ? ' · ' + esc(performedDate) : ''}</span>
        </div>
      </div>
      <div>
        <div style="font-size:10px; color:var(--text-muted); margin-bottom:4px; font-weight:600">VERIFIED BY (witness / QA)</div>
        <select id="cle_verifiedBy" style="width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:6px; font-size:12px; background:var(--bg)">
          <option value="">— Not yet verified —</option>`;
  for (const p of verifierCandidates) {
    const co = (COMPANIES[p.company]||{}).name||'';
    const sel = r.verifiedBy === p.id ? ' selected' : '';
    body += `<option value="${esc(p.id)}"${sel}>${esc(p.name)} · ${esc(co)} · ${esc(p.roleType||'')}</option>`;
  }
  body += `      </select>
        ${r.verifiedDate ? '<div style="font-size:10px; color:var(--text-muted); margin-top:4px">Last verified ' + esc(r.verifiedDate) + '</div>' : ''}
      </div>
    </div>
  </div>`;

  showModal(`<div class="modal" style="max-width:680px; max-height:90vh; overflow-y:auto">
    <div class="modal-h">
      <span>📝 Checklist item · ${esc(assetId)} · ${esc(phaseKey)}</span>
      <span class="x" onclick="closeModal()">×</span>
    </div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      ${r.status || r.value || r.comments ? '<button class="btn btn-soft" onclick="clearChecklistEdit(&#39;' + esc(assetId) + '&#39;,&#39;' + esc(phaseKey) + '&#39;,' + itemIdx + ')">Clear</button>' : ''}
      <button class="btn btn-pri" onclick="saveChecklistEdit('${esc(assetId)}','${esc(phaseKey)}',${itemIdx})">💾 Save sign-off</button>
    </div>
  </div>`);
}

function cleStatusPick(v) {
  const stEl = document.getElementById('cle_status');
  if (stEl) stEl.value = v;
  // Update visual state
  ['pass','fail','na'].forEach(s => {
    const btn = document.getElementById('cle_status_' + s);
    if (!btn) return;
    if (s === v) {
      btn.classList.add('active', s === 'pass' ? 'green' : s === 'fail' ? 'red' : 'gray');
      btn.style.background = s === 'pass' ? 'var(--green)' : s === 'fail' ? 'var(--red)' : 'var(--text-muted)';
      btn.style.color = '#fff';
      btn.style.borderColor = s === 'pass' ? 'var(--green)' : s === 'fail' ? 'var(--red)' : 'var(--text-muted)';
    } else {
      btn.classList.remove('active','green','red','gray');
      btn.style.background = 'var(--bg)';
      btn.style.color = 'var(--text)';
      btn.style.borderColor = 'var(--border-strong)';
    }
  });
}

function saveChecklistEdit(assetId, phaseKey, itemIdx) {
  const status     = (document.getElementById('cle_status')||{}).value || null;
  const value      = (document.getElementById('cle_value')||{}).value || '';
  const comments   = (document.getElementById('cle_comments')||{}).value || '';
  const verifiedBy = (document.getElementById('cle_verifiedBy')||{}).value || '';
  const key = `${assetId}|${phaseKey}|${itemIdx}`;
  const existing = CHECKLIST_RESPONSES[key] || {};
  const today = todayStr();
  const newR = { ...existing };
  if (status) newR.status = status;
  newR.value = value.trim();
  newR.comments = comments.trim();
  if (status && !newR.performedBy) {
    newR.performedBy = state.personaId;
    newR.performedDate = today;
    newR.by = state.personaId;
    newR.date = today;
  }
  if (verifiedBy && verifiedBy !== existing.verifiedBy) {
    newR.verifiedBy = verifiedBy;
    newR.verifiedDate = today;
  } else if (!verifiedBy) {
    delete newR.verifiedBy;
    delete newR.verifiedDate;
  }
  // Don't save empty record
  if (!newR.status && !newR.value && !newR.comments && !newR.verifiedBy) {
    delete CHECKLIST_RESPONSES[key];
  } else {
    CHECKLIST_RESPONSES[key] = newR;
  }
  saveUserData();
  closeModal();
  toast(`✓ Saved sign-off for ${assetId} · ${phaseKey} item ${itemIdx + 1}`, 'success');
  render();
}

function clearChecklistEdit(assetId, phaseKey, itemIdx) {
  const key = `${assetId}|${phaseKey}|${itemIdx}`;
  delete CHECKLIST_RESPONSES[key];
  saveUserData();
  closeModal();
  toast('✓ Cleared item', 'success');
  render();
}

function renderIssues() {
  const tab = state.issuesTab || 'all';
  const filterPriority = state.issuesPriority || 'all';
  const filterStatus = state.issuesStatus || 'all';
  const filterDiscipline = state.issuesDiscipline || 'all';
  const myCo = (PERSONAS[state.personaId]||{}).company;

  // Apply filters
  let list = ISSUES.slice();
  if (tab === 'mine') {
    list = list.filter(i => i.raisedBy === state.personaId || i.assignedTo === state.personaId);
  } else if (tab === 'company') {
    list = list.filter(i => i.affectedCompany === myCo || (PERSONAS[i.raisedBy]||{}).company === myCo || (PERSONAS[i.assignedTo]||{}).company === myCo);
  } else if (tab === 'overdue') {
    list = list.filter(i => issueIsOverdue(i));
  }
  if (filterPriority !== 'all') list = list.filter(i => i.priority === filterPriority);
  if (filterStatus !== 'all') list = list.filter(i => i.status === filterStatus);
  if (filterDiscipline !== 'all') list = list.filter(i => i.discipline === filterDiscipline);

  // Sort: overdue first, then by priority, then by age
  const prioOrder = { crit:0, high:1, med:2, low:3 };
  list.sort((a,b) => {
    const aOver = issueIsOverdue(a), bOver = issueIsOverdue(b);
    if (aOver !== bOver) return aOver ? -1 : 1;
    const pDiff = (prioOrder[a.priority]||9) - (prioOrder[b.priority]||9);
    if (pDiff) return pDiff;
    return (b.raisedHrsAgo||0) - (a.raisedHrsAgo||0);
  });

  // Tab counts
  const allCnt = ISSUES.filter(i => i.status !== 'closed').length;
  const mineCnt = ISSUES.filter(i => (i.raisedBy === state.personaId || i.assignedTo === state.personaId) && i.status !== 'closed').length;
  const coCnt = ISSUES.filter(i => (i.affectedCompany === myCo || (PERSONAS[i.raisedBy]||{}).company === myCo) && i.status !== 'closed').length;
  const overdueCnt = ISSUES.filter(i => issueIsOverdue(i)).length;

  let h = `<div class="page" style="max-width:1300px">
    ${pageH('🔔 Issues',
      `Day-to-day field issues · ${ISSUES.length} total · ${overdueCnt} overdue${overdueCnt > 0 ? ' ⚠' : ''}`,
      `<button class="btn btn-pri btn-sm" onclick="openRaiseIssueForm()">+ Raise issue</button>`)}

    <div style="display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:14px">
      ${[
        ['all','All open',allCnt,null],
        ['mine','Mine',mineCnt,null],
        ['company','My company',coCnt,null],
        ['overdue','⏱ Overdue',overdueCnt, overdueCnt > 0 ? 'red' : null],
      ].map(([t,lbl,cnt,bdg]) => `<div onclick="state.issuesTab='${t}'; render()" style="padding:11px 18px; cursor:pointer; font-size:12px; font-weight:600; border-bottom:3px solid ${tab===t?'var(--brand)':'transparent'}; color:${tab===t?'var(--brand)':'var(--text-muted)'}">
        ${lbl} <span style="margin-left:6px; padding:2px 8px; background:${bdg==='red'?'var(--red)':'var(--bg-soft)'}; color:${bdg==='red'?'#fff':'var(--text-muted)'}; border-radius:10px; font-size:10px; font-family:'JetBrains Mono',monospace">${cnt}</span>
      </div>`).join('')}
    </div>

    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center">
      <span style="font-size:11px; color:var(--text-muted); font-weight:600">FILTER:</span>
      <select onchange="state.issuesPriority=this.value; render()" style="padding:6px 10px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; background:var(--bg)">
        <option value="all"${filterPriority==='all'?' selected':''}>All priorities</option>
        ${Object.entries(ISSUE_PRIORITY).map(([k,v]) => `<option value="${k}"${filterPriority===k?' selected':''}>${v.label}</option>`).join('')}
      </select>
      <select onchange="state.issuesStatus=this.value; render()" style="padding:6px 10px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; background:var(--bg)">
        <option value="all"${filterStatus==='all'?' selected':''}>All statuses</option>
        ${Object.entries(ISSUE_STATUS).map(([k,v]) => `<option value="${k}"${filterStatus===k?' selected':''}>${v.label}</option>`).join('')}
      </select>
      <select onchange="state.issuesDiscipline=this.value; render()" style="padding:6px 10px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; background:var(--bg)">
        <option value="all"${filterDiscipline==='all'?' selected':''}>All disciplines</option>
        ${ISSUE_DISCIPLINES.map(d => `<option value="${d}"${filterDiscipline===d?' selected':''}>${d}</option>`).join('')}
      </select>
      <span style="font-size:11px; color:var(--text-muted); margin-left:auto">Showing ${list.length} of ${ISSUES.length}</span>
    </div>`;

  // Issue cards
  if (list.length === 0) {
    h += `<div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">No issues match these filters.</div>`;
  } else {
    for (const iss of list) {
      const prio = ISSUE_PRIORITY[iss.priority] || ISSUE_PRIORITY.med;
      const stat = ISSUE_STATUS[iss.status] || ISSUE_STATUS.open;
      const dueHrs = issueDueHrs(iss);
      const overdue = issueIsOverdue(iss);
      const atRisk = issueIsAtRisk(iss);
      const cmts = issueComments(iss.id).length;
      const raisedP = PERSONAS[iss.raisedBy];
      const assignedP = iss.assignedTo ? PERSONAS[iss.assignedTo] : null;
      const affectedC = iss.affectedCompany ? COMPANIES[iss.affectedCompany] : null;

      let dueText = '';
      if (iss.status === 'closed') dueText = 'closed';
      else if (iss.status === 'cx_verified') dueText = 'awaiting close';
      else if (overdue) dueText = `⚠ OVERDUE ${Math.abs(dueHrs).toFixed(0)}h`;
      else if (atRisk) dueText = `⏱ ${dueHrs.toFixed(0)}h left`;
      else dueText = `${dueHrs.toFixed(0)}h left`;

      h += `<div onclick="openIssueDetail('${esc(iss.id)}')" style="display:grid; grid-template-columns:auto 1fr auto; gap:14px; padding:14px 16px; border:1px solid var(--border); border-left:4px solid ${prio.color}; border-radius:8px; margin-bottom:8px; cursor:pointer; background:${overdue ? 'var(--red-soft)' : 'var(--bg)'}">
        <div style="text-align:center; min-width:60px">
          <div style="font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:800; color:${prio.color}; padding:3px 8px; background:${prio.color}22; border-radius:3px">${prio.label}</div>
          <div style="font-size:9px; color:var(--text-muted); margin-top:6px; font-family:'JetBrains Mono',monospace">${esc(iss.id)}</div>
        </div>
        <div>
          <div style="font-size:14px; font-weight:600; line-height:1.4; margin-bottom:4px">${esc(iss.title)}</div>
          <div style="font-size:11px; color:var(--text-muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center">
            <span class="tag gray" style="font-size:9px">${esc(iss.discipline)}</span>
            ${iss.asset ? `<span class="mono" style="font-size:10px">📦 ${esc(iss.asset)}</span>` : ''}
            ${affectedC ? `<span>🏢 ${esc(affectedC.name)}</span>` : ''}
            ${iss.vendorName ? `<span style="color:var(--brand-h)">${esc(iss.vendorName)}</span>` : ''}
            <span style="font-family:'JetBrains Mono',monospace; font-size:10px">📍 ${esc(iss.source||'')}</span>
            ${cmts > 0 ? `<span>💬 ${cmts}</span>` : ''}
            ${iss.blocksPhase ? `<span style="color:var(--red); font-weight:700">🚫 BLOCKS ${esc(iss.blocksPhase)}</span>` : ''}
          </div>
          <div style="font-size:10px; color:var(--text-muted); margin-top:5px">
            Raised by <b>${esc(raisedP ? raisedP.name : iss.raisedBy)}</b> · ${esc(iss.raisedAt||'')}
            ${assignedP ? ` · assigned to <b>${esc(assignedP.name)}</b>` : ''}
          </div>
        </div>
        <div style="text-align:right; min-width:130px">
          <div style="display:inline-block; padding:4px 10px; background:${stat.bg}; color:${stat.color}; border-radius:4px; font-size:10px; font-weight:800; letter-spacing:0.05em">${stat.label.toUpperCase()}</div>
          <div style="margin-top:6px; font-size:10px; font-family:'JetBrains Mono',monospace; color:${overdue?'var(--red)':atRisk?'var(--accent)':'var(--text-muted)'}; font-weight:${overdue||atRisk?'700':'400'}">${esc(dueText)}</div>
          <div style="margin-top:4px; font-size:9px; color:var(--text-muted)">SLA ${iss.slaHours||prio.sla}h${iss.slaOverride ? ' (adj)' : ''}</div>
        </div>
      </div>`;
    }
  }

  h += `</div>`;
  return h;
}

        <input type="checkbox" id="iss_blocksPhase" ${p.blocksPhase?'checked':''} style="width:18px; height:18px; cursor:pointer">

      </label>
      <select id="iss_blocksPhaseValue" style="margin-top:8px; padding:8px 10px; border:1px solid var(--border-strong); border-radius:5px; font-size:12px; background:var(--bg); width:200px">
        <option value="L3"${p.blocksPhase==='L3'?' selected':''}>Blocks L3 energization</option>
        <option value="L4"${p.blocksPhase==='L4'?' selected':''}>Blocks L4 load bank</option>
        <option value="L5"${p.blocksPhase==='L5'?' selected':''}>Blocks L5 IST</option>
      </select>

  `;

  showModal(`<div class="modal" style="max-width:680px; max-height:90vh; overflow-y:auto">
    <div class="modal-h"><span>+ Raise issue</span><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" onclick="submitRaiseIssue()">📤 Raise issue</button>
    </div>
  </div>`);
}

function issPrioPick(p) {
  const el = document.getElementById('iss_priority'); if (el) el.value = p;
  ['crit','high','med','low'].forEach(k => {
    const btn = document.getElementById('iss_prio_' + k);
    if (!btn) return;
    const v = ISSUE_PRIORITY[k];
    if (k === p) {
      btn.style.background = v.color;
      btn.style.borderColor = v.color;
      btn.style.color = '#fff';
    } else {
      btn.style.background = 'var(--bg)';
      btn.style.borderColor = 'var(--border-strong)';
      btn.style.color = 'var(--text)';
    }
  });
}

function submitRaiseIssue() {
  const title = (document.getElementById('iss_title')||{}).value || '';
  if (!title.trim()) { toast('Title is required', 'error'); return; }
  const priority = (document.getElementById('iss_priority')||{}).value || 'med';
  const slaH = parseInt((document.getElementById('iss_slaHours')||{}).value || '0', 10);
  const sla = slaH > 0 ? slaH : ISSUE_PRIORITY[priority].sla;
  const blocksCheck = (document.getElementById('iss_blocksPhase')||{}).checked;
  const blocksVal = (document.getElementById('iss_blocksPhaseValue')||{}).value || '';

  const newId = `ISS-2026-${String(ISSUES.length + 1).padStart(3, '0')}`;
  const iss = {
    id: newId,
    title: title.trim(),
    description: ((document.getElementById('iss_description')||{}).value || '').trim(),
    priority,
    status: 'open',
    discipline: (document.getElementById('iss_discipline')||{}).value || 'General',
    source: (document.getElementById('iss_source')||{}).value || 'Manual Entry',
    asset: (document.getElementById('iss_asset')||{}).value || '',
    raisedBy: state.personaId,
    raisedAt: todayStr(),
    raisedHrsAgo: 0,
    affectedCompany: (document.getElementById('iss_affectedCompany')||{}).value || '',
    assignedTo: (document.getElementById('iss_assignedTo')||{}).value || '',
    slaHours: sla,
    slaOverride: slaH > 0,
    blocksPhase: blocksCheck ? blocksVal : null,
    userCreated: true,
  };
  ISSUES.unshift(iss);
  saveUserData();
  closeModal();
  toast(`✓ Issue ${iss.id} raised${iss.affectedCompany ? ' · ' + ((COMPANIES[iss.affectedCompany]||{}).name||'') + ' notified' : ''}`, 'success');
  state.view = 'issues';
  render();
}

// ─── ISSUE DETAIL MODAL ───
function openIssueDetail(issueId) {
  const iss = ISSUES.find(i => i.id === issueId);
  if (!iss) { toast('Issue not found', 'error'); return; }
  const prio = ISSUE_PRIORITY[iss.priority];
  const stat = ISSUE_STATUS[iss.status];
  const dueHrs = issueDueHrs(iss);
  const overdue = issueIsOverdue(iss);
  const atRisk = issueIsAtRisk(iss);
  const me_ = me();
  const myRT = (me_||{}).roleType || '';
  const myCo = (me_||{}).company;

  // Permission flags for actions
  const isQAQC = myRT.includes('qaqc');
  const isCxA = myRT.includes('cxa');
  const isAffected = myCo === iss.affectedCompany;
  const isAssigned = iss.assignedTo === state.personaId;
  const isRaiser = iss.raisedBy === state.personaId;

  // Comments
  const cmts = issueComments(issueId);

  // Status pipeline
  const pipeline = ['open','in_progress','resolved','cx_verified','closed'];
  const currentIdx = pipeline.indexOf(iss.status);

  let body = '';

  // Header info
  const raisedP = PERSONAS[iss.raisedBy];
  const assignedP = iss.assignedTo ? PERSONAS[iss.assignedTo] : null;
  const affectedC = iss.affectedCompany ? COMPANIES[iss.affectedCompany] : null;

  body += `<div style="display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; margin-bottom:14px">
    <div style="text-align:center">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:800; color:${prio.color}; padding:5px 12px; background:${prio.color}22; border-radius:4px">${prio.label}</div>
      <div style="font-size:9px; color:var(--text-muted); margin-top:6px">${prio.sla}h base SLA</div>
    </div>
    <div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-muted); margin-bottom:3px">${esc(iss.id)}</div>
      <div style="font-size:16px; font-weight:600; line-height:1.4">${esc(iss.title)}</div>
      ${iss.description ? `<div style="margin-top:8px; font-size:13px; line-height:1.55; color:var(--text)">${esc(iss.description)}</div>` : ''}
    </div>
    <div style="text-align:right">
      <div style="display:inline-block; padding:5px 12px; background:${stat.bg}; color:${stat.color}; border-radius:4px; font-size:11px; font-weight:800; letter-spacing:0.05em">${stat.label.toUpperCase()}</div>
      <div style="margin-top:8px; font-size:11px; font-family:'JetBrains Mono',monospace; color:${overdue?'var(--red)':atRisk?'var(--accent)':'var(--text-muted)'}; font-weight:${overdue||atRisk?'700':'400'}">
        ${iss.status === 'closed' ? 'closed' : iss.status === 'cx_verified' ? 'awaiting close' : overdue ? `⚠ OVERDUE ${Math.abs(dueHrs).toFixed(0)}h` : `${dueHrs.toFixed(0)}h left`}
      </div>
      <div style="margin-top:3px; font-size:9px; color:var(--text-muted)">SLA: ${iss.slaHours||prio.sla}h${iss.slaOverride ? ' (adjusted)' : ''}</div>
    </div>
  </div>`;

  // Status pipeline
  body += `<div style="display:flex; align-items:center; gap:0; padding:14px; background:var(--bg-soft); border-radius:8px; margin-bottom:14px; overflow-x:auto">`;
  pipeline.forEach((s, idx) => {
    const v = ISSUE_STATUS[s];
    const passed = idx <= currentIdx;
    const isCurrent = idx === currentIdx;
    body += `<div style="display:flex; align-items:center; gap:6px; flex-shrink:0">
      <div style="display:flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 10px; background:${passed ? v.color : '#fff'}; color:${passed ? '#fff' : 'var(--text-muted)'}; border:2px solid ${passed ? v.color : 'var(--border)'}; border-radius:15px; font-size:10px; font-weight:800; font-family:'JetBrains Mono',monospace; ${isCurrent ? 'box-shadow:0 0 0 4px ' + v.color + '33' : ''}">${esc(v.label)}</div>
      ${idx < pipeline.length - 1 ? `<div style="width:24px; height:2px; background:${idx < currentIdx ? '#10b981' : 'var(--border)'}"></div>` : ''}
    </div>`;
  });
  body += `</div>`;

  // Metadata grid
  body += `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-bottom:16px; font-size:11px">
    <div style="padding:10px; background:var(--bg-soft); border-radius:6px"><div style="color:var(--text-muted); font-size:9px; letter-spacing:0.05em; font-weight:700; margin-bottom:3px">DISCIPLINE</div><b>${esc(iss.discipline)}</b></div>
    <div style="padding:10px; background:var(--bg-soft); border-radius:6px"><div style="color:var(--text-muted); font-size:9px; letter-spacing:0.05em; font-weight:700; margin-bottom:3px">ASSET</div><b class="mono">${esc(iss.asset||'—')}</b></div>
    <div style="padding:10px; background:var(--bg-soft); border-radius:6px"><div style="color:var(--text-muted); font-size:9px; letter-spacing:0.05em; font-weight:700; margin-bottom:3px">SOURCE</div><b style="font-family:'JetBrains Mono',monospace; font-size:10px">${esc(iss.source||'—')}</b></div>
    <div style="padding:10px; background:var(--bg-soft); border-radius:6px"><div style="color:var(--text-muted); font-size:9px; letter-spacing:0.05em; font-weight:700; margin-bottom:3px">RAISED BY</div><b>${esc(raisedP ? raisedP.name : iss.raisedBy)}</b><br><span style="font-size:10px; color:var(--text-muted)">${esc(iss.raisedAt||'')}</span></div>
    <div style="padding:10px; background:var(--bg-soft); border-radius:6px"><div style="color:var(--text-muted); font-size:9px; letter-spacing:0.05em; font-weight:700; margin-bottom:3px">AFFECTED COMPANY</div><b>${affectedC ? esc(affectedC.name) : '—'}</b>${iss.vendorName ? `<br><span style="font-size:10px; color:var(--brand-h)">${esc(iss.vendorName)}</span>` : ''}</div>
    <div style="padding:10px; background:var(--bg-soft); border-radius:6px"><div style="color:var(--text-muted); font-size:9px; letter-spacing:0.05em; font-weight:700; margin-bottom:3px">ASSIGNED TO</div><b>${assignedP ? esc(assignedP.name) : '—'}</b></div>
  </div>`;

  if (iss.blocksPhase) {
    body += `<div style="background:var(--red-soft); border:1px solid var(--red); border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:12px; color:#991b1b">
      🚫 <b>This issue blocks ${esc(iss.blocksPhase)} advancement.</b> Phase cannot be advanced for affected assets until resolved.
    </div>`;
  }

  // Resolution / verification timestamps
  if (iss.resolvedBy || iss.verifiedBy || iss.closedBy) {
    body += `<div style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-bottom:14px; line-height:1.7">`;
    if (iss.resolvedBy) body += `→ <b>Resolved</b> by ${esc((PERSONAS[iss.resolvedBy]||{}).name||iss.resolvedBy)} on ${esc(iss.resolvedAt||'')}<br>`;
    if (iss.verifiedBy) body += `→ <b>CX Verified</b> by ${esc((PERSONAS[iss.verifiedBy]||{}).name||iss.verifiedBy)} on ${esc(iss.verifiedAt||'')}<br>`;
    if (iss.closedBy) body += `→ <b>Closed</b> by ${esc((PERSONAS[iss.closedBy]||{}).name||iss.closedBy)} on ${esc(iss.closedAt||'')}<br>`;
    body += `</div>`;
  }

  // Comments thread
  body += `<div style="margin-bottom:14px">
    <div style="font-size:10px; font-weight:700; color:var(--text-muted); letter-spacing:0.05em; margin-bottom:8px">💬 COMMENTS · ${cmts.length}</div>`;
  if (cmts.length === 0) {
    body += `<div style="padding:14px; background:var(--bg-soft); border-radius:6px; font-size:12px; color:var(--text-muted); text-align:center">No comments yet</div>`;
  }
  for (const c of cmts) {
    const cp = PERSONAS[c.by];
    const co = cp ? COMPANIES[cp.company] : null;
    body += `<div style="padding:10px 12px; background:var(--bg-soft); border-left:3px solid var(--brand-soft); border-radius:0 6px 6px 0; margin-bottom:6px; font-size:12px">
      <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:4px; flex-wrap:wrap">
        <b style="font-size:11px">${esc(cp ? cp.name : c.by)}</b>
        <span style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace">${esc(c.when||'')}</span>
      </div>
      ${co ? `<div style="font-size:9px; color:var(--text-muted); margin-bottom:4px">${esc(co.name)} · ${esc((cp||{}).roleType||'')}</div>` : ''}
      <div style="line-height:1.55">${esc(c.text||'')}</div>
    </div>`;
  }
  // Add comment box (if not closed)
  if (iss.status !== 'closed') {
    body += `<div style="margin-top:8px">
      <textarea id="iss_newComment" rows="2" placeholder="Add a comment · provide an update · ask a question" style="width:100%; padding:8px 12px; border:1px solid var(--border-strong); border-radius:6px; font-size:12px; resize:vertical; background:var(--bg); font-family:inherit"></textarea>
      <button class="btn btn-soft btn-sm" style="margin-top:6px" onclick="addIssueComment('${esc(issueId)}')">💬 Add comment</button>
    </div>`;
  }
  body += `</div>`;

  // Action buttons (status transitions)
  const actions = [];
  if (iss.status === 'open' && (isAffected || isAssigned)) {
    actions.push({ label:'▶ Mark in progress',     cls:'btn-pri',  fn:`transitionIssue('${issueId}','in_progress')` });
  }
  if (iss.status === 'in_progress' && (isAffected || isAssigned)) {
    actions.push({ label:'✓ Mark resolved',        cls:'btn-pri',  fn:`transitionIssue('${issueId}','resolved')` });
  }
  if (iss.status === 'resolved' && isCxA) {
    actions.push({ label:'✓✓ CX Verify',           cls:'btn-pri',  fn:`transitionIssue('${issueId}','cx_verified')` });
  }
  if (iss.status === 'cx_verified' && isQAQC) {
    actions.push({ label:'🔒 Close',               cls:'btn-pri',  fn:`transitionIssue('${issueId}','closed')` });
  }
  if (iss.status !== 'closed' && iss.status !== 'open' && (isQAQC || isRaiser)) {
    actions.push({ label:'↻ Reopen',               cls:'btn-soft', fn:`transitionIssue('${issueId}','open')` });
  }
  if (isQAQC && iss.status !== 'closed') {
    actions.push({ label:'⏱ Adjust SLA',           cls:'btn-soft', fn:`adjustIssueSLA('${issueId}')` });
  }

  showModal(`<div class="modal" style="max-width:780px; max-height:92vh; overflow-y:auto">
    <div class="modal-h"><span>${esc(iss.id)} · ${esc(iss.title.substring(0,60))}${iss.title.length>60?'…':''}</span><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-b">${body}</div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      ${actions.map(a => `<button class="btn ${a.cls}" onclick="${a.fn}">${a.label}</button>`).join('')}
    </div>
  </div>`);
}

function addIssueComment(issueId) {
  const text = (document.getElementById('iss_newComment')||{}).value || '';
  if (!text.trim()) { toast('Comment is empty', 'warn'); return; }
  ISSUE_COMMENTS.push({
    issueId,
    by: state.personaId,
    text: text.trim(),
    when: todayStr() + ' ' + new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}),
    userCreated: true,
  });
  saveUserData();
  closeModal();
  toast('✓ Comment added', 'success');
  openIssueDetail(issueId); // re-open
}

function transitionIssue(issueId, newStatus) {
  const iss = ISSUES.find(i => i.id === issueId);
  if (!iss) return;
  const old = iss.status;
  iss.status = newStatus;
  const today = todayStr();
  if (newStatus === 'resolved') { iss.resolvedBy = state.personaId; iss.resolvedAt = today; }
  if (newStatus === 'cx_verified') { iss.verifiedBy = state.personaId; iss.verifiedAt = today; }
  if (newStatus === 'closed') { iss.closedBy = state.personaId; iss.closedAt = today; }
  if (!iss.userCreated) iss.modified = true;
  saveUserData();
  toast(`✓ Issue ${issueId} · ${old} → ${ISSUE_STATUS[newStatus].label}`, 'success');
  closeModal();
  openIssueDetail(issueId);
}

function adjustIssueSLA(issueId) {
  const iss = ISSUES.find(i => i.id === issueId);
  if (!iss) return;
  const cur = iss.slaHours || ISSUE_PRIORITY[iss.priority].sla;
  const input = window.prompt(`Adjust SLA for ${issueId}\nCurrent: ${cur}h\nDefault for ${iss.priority.toUpperCase()}: ${ISSUE_PRIORITY[iss.priority].sla}h\n\nNew SLA in hours:`, String(cur));
  if (!input) return;
  const newH = parseInt(input, 10);
  if (isNaN(newH) || newH < 1) { toast('Invalid SLA', 'error'); return; }
  iss.slaHours = newH;
  iss.slaOverride = true;
  if (!iss.userCreated) iss.modified = true;
  saveUserData();
  toast(`✓ SLA adjusted: ${cur}h → ${newH}h`, 'success');
  closeModal();
  openIssueDetail(issueId);
}

      <div style="font-size:9px; letter-spacing:0.05em; color:var(--text-muted); font-weight:700; margin-bottom:6px">TO</div>
      <div style="font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700">${esc(h.toPhase)}</div>

  ${h.notes ? `<div style="padding:12px 14px; background:var(--bg-soft); border-left:3px solid var(--brand-soft); border-radius:0 6px 6px 0; margin-bottom:12px; font-size:12px; line-height:1.55">

  ${h.ackBy && h.status === 'acknowledged' ? `<div style="padding:10px 14px; background:var(--green-soft); border-radius:6px; font-size:12px; color:#166534">
    ✓ Acknowledged by <b>${esc((PERSONAS[h.ackBy]||{}).name||h.ackBy)}</b> · ${esc(h.ackAt||'')}

  ${h.status === 'rejected' ? `<div style="padding:10px 14px; background:var(--red-soft); border-radius:6px; font-size:12px; color:#991b1b">
    ✗ Rejected by <b>${esc((PERSONAS[h.ackBy]||{}).name||h.ackBy)}</b> · ${esc(h.ackAt||'')}<br>
    ${h.rejectReason ? `<div style="margin-top:6px"><b>Reason:</b> ${esc(h.rejectReason)}</div>` : ''}
  </div>` : ''}

function ackHandoffWithReason(handoffId, accept) {
  const reason = (document.getElementById('ho_rejectReason')||{}).value || '';

  ackHandoff(handoffId, accept, reason);
  closeModal();
}

      ${kpiCard('Tests Filed', `${k.testsFiled}/${k.testsRequired}`, `${Math.round(100*k.testsFiled/(k.testsRequired||1))}% complete · ${k.testsPending} pending · ${k.testsFailed} failed`, k.testsFailed > 0 ? 'var(--red)' : 'var(--green)')}
      ${kpiCard('Ready to Advance', k.readyCount, `${k.blockedCount} blocked by prereqs`, k.readyCount > 0 ? 'var(--green)' : 'var(--text-muted)', "setView('phasequeue')")}

      <div style="display:grid; grid-template-columns:repeat(${STAGE_ORDER.length}, 1fr); gap:8px; align-items:end; min-height:120px">`;
  const maxCount = Math.max(...Object.values(k.stageCount), 1);

    const stageLower = s.toLowerCase();

    h += `<div style="text-align:center; cursor:pointer" onclick="state.phaseQueueFilter='${s}'; setView('phasequeue')">
      <div style="background:${color}; border-radius:6px 6px 0 0; height:${Math.max(pct,4)}%; min-height:${cnt > 0 ? '20px':'4px'}; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-family:'JetBrains Mono',monospace; padding:6px 0">${cnt > 0 ? cnt : ''}</div>

    <div class="card-h"><span>🚨 Critical right now</span></div>
    <div class="card-b" style="padding:0">`;

    h += `<div style="padding:24px; text-align:center; color:var(--text-muted); font-size:13px">✓ Nothing critical · all clear</div>`;
  } else {
    if (overdueIssues.length > 0) {

      for (const b of blockedAdvance.slice(0, 4)) {
        h += `<div onclick="openAssetPage('${esc(b.asset.id)}')" style="padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px">
            <span><b class="mono" style="font-size:11px">${esc(b.asset.id)}</b> → ${esc(STAGE_LABELS[b.nextStage])}</span>

          </div>
        </div>`;
      }
    }
  }
  h += `</div></div>`;

  // Test status by asset class
  h += `<div class="card">
    <div class="card-h"><span>🧪 Test report status</span></div>
    <div class="card-b" style="padding:0">`;
  const byClass = { electrical:{filed:0,pending:0,failed:0}, mechanical:{filed:0,pending:0,failed:0}, controls:{filed:0,pending:0,failed:0}, fls:{filed:0,pending:0,failed:0} };
  for (const a of EQUIPMENT) {
    const tpl = getChecklistTemplate(a);
