// Helper: hours since issue raised
function issueAgeHrs(iss) {
  return iss.raisedHrsAgo || 0; // simulated for demo
}
function issueDueHrs(iss) {
  const sla = iss.slaHours || (ISSUE_PRIORITY[iss.priority]||{}).sla || 48;
  return sla - issueAgeHrs(iss);
}
function issueIsOverdue(iss) {
  if (iss.status === 'closed' || iss.status === 'cx_verified') return false;
  return issueDueHrs(iss) < 0;
}
function issueIsAtRisk(iss) {
  if (iss.status === 'closed' || iss.status === 'cx_verified') return false;
  const r = issueDueHrs(iss);
  return r >= 0 && r <= 6;
}
function issueComments(issueId) {
  return ISSUE_COMMENTS.filter(c => c.issueId === issueId).sort((a,b) => (a.when||'').localeCompare(b.when||''));
}

// Notifications: events that need user attention
function myNotifications(personaId) {
  const p = PERSONAS[personaId];
  if (!p) return [];
  const myCo = p.company;
  const events = [];
  for (const iss of ISSUES) {
    if (iss.status === 'closed') continue;
    // Issue assigned to me directly
    if (iss.assignedTo === personaId && iss.status !== 'cx_verified') {
      events.push({ type:'assigned',    iss, msg:'Assigned to you · ' + iss.title, urgency: issueIsOverdue(iss) ? 'high' : 'med', when:iss.raisedAt });
    }
    // Issue affecting my company (not self-raised)
    if (iss.affectedCompany === myCo && iss.assignedTo !== personaId && iss.raisedBy !== personaId && iss.status === 'open') {
      events.push({ type:'company',     iss, msg:iss.title + ' · affects ' + (COMPANIES[myCo]||{}).name, urgency:'med', when:iss.raisedAt });
    }
    // Resolved · awaiting CX verification (CxA personas only)
    if (iss.status === 'resolved' && (p.roleType||'').includes('cxa')) {
      events.push({ type:'verify',      iss, msg:'Awaiting CX verification · ' + iss.title, urgency:'high', when:iss.resolvedAt || iss.raisedAt });
    }
    // CX-verified · ready to close (QA/QC personas only)
    if (iss.status === 'cx_verified' && (p.roleType||'').includes('qaqc')) {
      events.push({ type:'close',       iss, msg:'Ready to close · ' + iss.title, urgency:'low', when:iss.verifiedAt || iss.raisedAt });
    }
    // Overdue (visible to QA/QC + management)
    if (issueIsOverdue(iss) && ((p.roleType||'').includes('qaqc') || (p.roleType||'').includes('pm'))) {
      events.push({ type:'overdue',     iss, msg:'⏱ OVERDUE: ' + iss.title, urgency:'high', when:iss.raisedAt });
    }
  }
  // Handoff events
  for (const h of HANDOFFS) {
    if (h.toPersona === personaId && h.status === 'pending') {
      events.push({ type:'handoff', handoff:h, msg:'Handoff awaiting your acknowledgment: ' + h.assetId + ' · ' + h.fromPhase + ' → ' + h.toPhase, urgency:'med', when:h.atDate });
    }
  }
  return events.slice(0, 12);
}

function ackHandoff(handoffId, accept, reason) {
  const h = HANDOFFS.find(x => x.id === handoffId);
  if (!h) return;
  h.status = accept ? 'acknowledged' : 'rejected';
  h.ackBy = state.personaId;
  h.ackAt = todayStr();
  if (!accept && reason) h.rejectReason = reason;
  if (!h.userCreated) h.modified = true;
  saveUserData();
  toast(accept ? `✓ Handoff acknowledged: ${h.assetId} · ${h.fromPhase} → ${h.toPhase}` : `✗ Handoff rejected · returned to ${(COMPANIES[h.fromCompany]||{}).name}`, accept ? 'success' : 'warn');
  render();
}

// Has a report been filed for asset+testName?
function getTestReports(asset, testName) {
  return TEST_REPORTS.filter(r => r.asset === asset && r.testName === testName);
}

// Required tests for an asset (collapsed across phases)
function requiredTestsForAsset(asset) {
  const type = getAssetType(asset);
  if (!type || !REQUIRED_TESTS[type]) return [];
  const all = [];
  for (const [phase, tests] of Object.entries(REQUIRED_TESTS[type])) {
    for (const t of tests) all.push({ ...t, phase });
  }
  return all;
}

// Test catalog status: which tests have reports, which are missing
function testCatalogStatus(asset) {
  const required = requiredTestsForAsset(asset);
  let filed = 0, pending = 0, failed = 0;
  for (const t of required) {
    const reports = getTestReports(asset.id, t.name);
    if (reports.length === 0) pending++;
    else if (reports.some(r => !r.pass)) failed++;
    else filed++;
  }
  return { total: required.length, filed, pending, failed };
}

// Phase queue: which assets are in which phase, ready to advance
function phaseQueueData() {
  const queue = {};
  for (const stage of STAGE_ORDER) {
    queue[stage] = { stage, assets:[], ready:[], blocked:[], stuck:[] };
  }
  for (const asset of EQUIPMENT) {
    if (!queue[asset.stage]) continue;
    queue[asset.stage].assets.push(asset);
    // Determine if ready to advance
    const idx = STAGE_ORDER.indexOf(asset.stage);
    if (idx === -1 || idx >= STAGE_ORDER.length - 1) continue;
    const nextStage = STAGE_ORDER[idx + 1];
    const targetPhase = STAGE_TO_PHASE[nextStage];
    const check = canAdvanceToPhase(asset.id, targetPhase);
    if (check.ok) queue[asset.stage].ready.push({ asset, nextStage, check });
    else queue[asset.stage].blocked.push({ asset, nextStage, check, blockers: check.blocking });
  }
  return queue;
}

// Comprehensive QA/QC KPIs
function qaqcKPIs() {
  // Checklists
  const totalCL = Object.keys(CHECKLIST_RESPONSES).length;
  const passedCL = Object.values(CHECKLIST_RESPONSES).filter(r => r.status === 'pass').length;
  const failedCL = Object.values(CHECKLIST_RESPONSES).filter(r => r.status === 'fail').length;
  const verifiedCL = Object.values(CHECKLIST_RESPONSES).filter(r => r.verifiedBy).length;
  const awaitingVerification = passedCL - verifiedCL;

  // Issues by status
  const issuesByStatus = {};
  ISSUES.forEach(i => { issuesByStatus[i.status] = (issuesByStatus[i.status]||0) + 1; });
  const issueOverdue = ISSUES.filter(i => issueIsOverdue(i)).length;
  const issuesCrit = ISSUES.filter(i => i.priority === 'crit' && i.status !== 'closed').length;

  // Tests filed vs required
  let testsRequired = 0, testsFiled = 0, testsFailed = 0;
  for (const a of EQUIPMENT) {
    const s = testCatalogStatus(a);
    testsRequired += s.total;
    testsFiled += s.filed;
    testsFailed += s.failed;
  }

  // Phase progression
  const stageCount = {};
  STAGE_ORDER.forEach(s => stageCount[s] = 0);
  EQUIPMENT.forEach(e => { if (stageCount[e.stage] !== undefined) stageCount[e.stage]++; });

  // Ready to advance
  const queue = phaseQueueData();
  let readyCount = 0, blockedCount = 0;
  Object.values(queue).forEach(q => { readyCount += q.ready.length; blockedCount += q.blocked.length; });

  // Handoffs pending
  const handoffsPending = HANDOFFS.filter(h => h.status === 'pending').length;
  const handoffsRejected = HANDOFFS.filter(h => h.status === 'rejected').length;

  return {
    totalCL, passedCL, failedCL, verifiedCL, awaitingVerification,
    issuesByStatus, issueOverdue, issuesCrit,
    testsRequired, testsFiled, testsFailed, testsPending: testsRequired - testsFiled - testsFailed,
    stageCount, readyCount, blockedCount,
    handoffsPending, handoffsRejected,
    ncrOpen: NCRS.filter(n => n.status !== 'closed').length,
  };
}

// ─── Cx MASTER LOG ─── derived view: assets × phases matrix
// Phases columns: L1, L2.01..L2.08, L3, L3.06, L4, L5
const CX_LOG_PHASES = ['L1','L2.01','L2.02','L2.03','L2.04','L2.05a','L2.05b','L2.05c','L2.05d','L2.06','L2.07','L2.08','L3','L3.06','L4','L5'];
function cxStatusFor(asset, phase) {
  // Derive status from EQUIPMENT.phaseIdx + L2 sub-phase progress
  // Returns: 'closed' | 'in_prog' | 'planned' | 'na'
  const eq = EQUIPMENT.find(e => e.id === asset);
  if (!eq) return 'na';
  const stage = eq.stage; // 'NOT_RECEIVED','ON_SITE','INSTALLED','PRE_ENERG','ENERGIZED','COMMISSIONED'
  // Map phase to status using a synthetic mapping
  const order = ['L1','L2.01','L2.02','L2.03','L2.04','L2.05a','L2.05b','L2.05c','L2.05d','L2.06','L2.07','L2.08','L3','L3.06','L4','L5'];
  const idx = order.indexOf(phase);
  if (idx < 0) return 'na';
  // Each stage maps to "where" they are
  let progressedTo;
  if (stage === 'COMMISSIONED') progressedTo = 16;        // through L5
  else if (stage === 'ENERGIZED') progressedTo = 14;      // through L3.06
  else if (stage === 'PRE_ENERG') progressedTo = 12;      // through L2.08
  else if (stage === 'INSTALLED') progressedTo = 5;       // through L2.04 (set in place + termination)
  else if (stage === 'ON_SITE') progressedTo = 1;          // L1 done
  else progressedTo = 0;
  // Phases not in lifecycle are N/A (e.g. PDU may not have L5)
  if (eq.lifecycle && !eq.lifecycle.some(l => phase.startsWith(l))) {
    if (phase === 'L5' && !eq.lifecycle.includes('L5') && !eq.lifecycle.includes('IST')) return 'na';
  }
  if (idx < progressedTo) return 'closed';
  if (idx === progressedTo) return 'in_prog';
  return 'planned';
}

// ─── Cx SCORE ─── weighted: checklists 35% + tests 30% + assets 25% + inspections 10%
function cxScore() {
  // Checklists 35%: % of CHECKLISTS w/ status='cx_verified'  (using TASKINGS as proxy for checklist progress)
  const totalTasks = TASKINGS.length;
  const closedTasks = TASKINGS.filter(t => t.status === 'closed').length;
  const checklistPct = totalTasks ? Math.round(closedTasks / totalTasks * 100) : 0;

  // Tests 30%: % pass
  const testPct = TEST_RESULTS.length ? Math.round(TEST_RESULTS.filter(t => t.pass).length / TEST_RESULTS.length * 100) : 0;

  // Assets 25%: % at ENERGIZED or COMMISSIONED
  const assetPct = EQUIPMENT.length ? Math.round(EQUIPMENT.filter(e => ['ENERGIZED','COMMISSIONED'].includes(e.stage)).length / EQUIPMENT.length * 100) : 0;

  // Inspections 10%: PSSR approved %
  const pssrInitiated = PSSR_RECORDS.filter(p => p.status !== 'draft').length;
  const pssrApproved  = PSSR_RECORDS.filter(p => p.status === 'approved').length;
  const inspPct = pssrInitiated ? Math.round(pssrApproved / pssrInitiated * 100) : 0;

  const score = Math.round((checklistPct * 0.35) + (testPct * 0.30) + (assetPct * 0.25) + (inspPct * 0.10));
  return { score, checklists: checklistPct, tests: testPct, assets: assetPct, inspections: inspPct };
}
function cxScoreGrade(score) {
  if (score >= 90) return { letter:'A', color:'var(--green)',  label:'Excellent' };
  if (score >= 80) return { letter:'B', color:'#65a30d',       label:'Good' };
  if (score >= 70) return { letter:'C', color:'var(--accent)', label:'Acceptable' };
  if (score >= 60) return { letter:'D', color:'#ea580c',       label:'At Risk' };
  return                  { letter:'F', color:'var(--red)',    label:'Critical' };
}

      total: HOLD_POINTS.length,
      done: HOLD_POINTS.filter(h => h.status === 'completed').length },
    { label:'All test results pass',
      total: TEST_RESULTS.length,
      done: TEST_RESULTS.filter(t => t.pass).length },
    { label:'All PSSRs approved',
      total: PSSR_RECORDS.filter(p => p.status !== 'draft').length,
      done: PSSR_RECORDS.filter(p => p.status === 'approved').length },
    { label:'All long-lead items installed',
      total: LONG_LEAD.length,
      done: LONG_LEAD.filter(l => l.stage === 'installed').length },
    { label:'All as-built drawings filed',
      total: ARTIFACTS.filter(a => a.type === 'drawing').length,
      done: ARTIFACTS.filter(a => a.type === 'drawing' && (a.tags || []).includes('as-built')).length },
  ];
  const totalChecks = checks.length;
  const passingChecks = checks.filter(c => c.total > 0 && c.done === c.total).length;
  return { checks, totalChecks, passingChecks, readinessPct: totalChecks ? Math.round(passingChecks / totalChecks * 100) : 0 };
}

  "⚠ Power System Studies & Pre-Energization Documentation": {
    domain: "system",
    desc: "Site-wide engineering deliverables that MUST be in place BEFORE L2.06 NETA testing or any L3 energization. Owned by the Engineer of Record (EoR), distributed to GC / EC / NETA contractor / vendor FSEs / CxA. Without these, NETA cannot determine PPE, equipment cannot be labeled per NFPA 70E, and relay settings cannot be loaded. This is a HARD GATE before energization — flag any missing deliverable to the GC immediately.",
    groups: [
      {
        title: "L2.00a — Short Circuit Study (SCS)",
        items: [
          { title: "Short Circuit Study Submitted, Sealed by PE", criteria: "EoR submits short circuit study, signed and sealed by licensed Professional Engineer, latest revision reflecting as-installed equipment.", pass: "Study on file with current PE seal.", fail: "Missing, unsealed, or out-of-date.", method: "doc", subph: "L2.00a", crit: true, energ: true, ref: "IEEE 141 / IEEE 242" },
          { title: "Available Fault Current at Each Bus", criteria: "Available 3-phase and L-G fault current documented at every bus, switchboard, panel, and equipment connection point on the one-line.", pass: "Documented at every bus on as-built one-line.", fail: "Missing values at any bus.", method: "doc", subph: "L2.00a", crit: true, energ: true },
          { title: "Equipment AIC / Withstand Rating Verification", criteria: "Verify every breaker, switch, fuse, panel, and cable has interrupting / withstand rating ≥ available fault current per NEC 110.9 and 110.10.", pass: "All AIC ratings ≥ available fault. Verification matrix on file.", fail: "Any equipment underrated — DO NOT energize.", method: "doc", subph: "L2.00a", crit: true, energ: true, ref: "NEC 110.9 / 110.10" },
          { title: "Series Combination Rating Documentation", criteria: "If series-rated combinations used, manufacturer-tested series combinations documented with test data.", pass: "Series combinations documented and matched to UL listed pairs.", fail: "Series rating claimed without UL testing.", method: "doc", subph: "L2.00a", crit: true, ref: "NEC 240.86 / UL 489" }
        ]
      },
      {
        title: "L2.00b — Protective Device Coordination Study",
        items: [
          { title: "Coordination Study Submitted, Sealed by PE", criteria: "EoR submits selective coordination study with time-current curves (TCCs) for every overcurrent device, signed and sealed.", pass: "Study on file; TCCs plotted for every protection layer.", fail: "Missing or unsealed.", method: "doc", subph: "L2.00b", crit: true, energ: true, ref: "IEEE 242 (Buff Book)" },
          { title: "Selective Coordination Verification (Critical Loads)", criteria: "Verify selective coordination for emergency, legally required standby, and critical operations systems per NEC 700.32 / 701.32 / 708.54.", pass: "Selectivity verified for full fault range.", fail: "Loss of selectivity at any current level on critical paths.", method: "doc", subph: "L2.00b", crit: true, energ: true, ref: "NEC 700.32" },
          { title: "Coordination Margins Documented", criteria: "Coordination time intervals (CTI) per IEEE 242 between adjacent protection layers documented (typically ≥ 0.2–0.4 sec).", pass: "All CTIs ≥ minimum.", fail: "Insufficient CTI — loss of selectivity.", method: "doc", subph: "L2.00b", crit: true, ref: "IEEE 242" }
        ]
      },
      {
        title: "L2.00c — Arc Flash Study & Labels (NFPA 70E / IEEE 1584)",
        items: [
          { title: "Arc Flash Study per IEEE 1584 (Latest Edition)", criteria: "Arc flash incident energy calculation per IEEE 1584-2018 (or current edition) for every working point. Sealed by PE.", pass: "Study on file with current PE seal; calculation method documented.", fail: "Missing or based on outdated IEEE 1584 (e.g., 2002 method on new install).", method: "doc", subph: "L2.00c", crit: true, energ: true, ref: "IEEE 1584-2018" },
          { title: "Arc Flash Labels Produced (ANSI Z535.4 Format)", criteria: "Per-equipment arc flash warning labels printed per ANSI Z535.4. Each label shows: equipment ID, nominal voltage, available fault current, incident energy at working distance (cal/cm²), arc flash boundary distance, working distance, required PPE category, study date.", pass: "Labels printed for every cubicle, panel, switchboard, transformer, MCC, etc.", fail: "Missing labels for any energized equipment.", method: "doc", subph: "L2.00c", crit: true, energ: true, ref: "NFPA 70E §130.5(H)" },
          { title: "Arc Flash Labels INSTALLED Pre-Energization", criteria: "Physical labels installed on every piece of equipment BEFORE NETA tech opens any door or before any breaker is energized. This is the hard regulatory gate.", pass: "Labels physically installed on every piece of equipment; photos taken for record.", fail: "Equipment energized without label — STOP WORK and label before any further activity.", method: "visual", subph: "L2.00c", crit: true, energ: true, ref: "NEC 110.16 / NFPA 70E §130.5" },
          { title: "PPE Category Communicated to NETA / FSE Crews", criteria: "Pre-job briefing distributed to NETA test contractor and all vendor FSEs identifying PPE category required at each work location. NETA cannot show up without correct PPE.", pass: "Pre-job briefing distributed and signed by all crews.", fail: "Crew arrives without proper PPE — STOP WORK.", method: "doc", subph: "L2.00c", crit: true, energ: true, ref: "NFPA 70E §110.5" },
          { title: "Restudy Trigger on Setting Changes", criteria: "Procedure documented for re-running arc flash study and re-printing labels if any relay settings, equipment, or transformer impedance changes during commissioning.", pass: "Restudy procedure documented and assigned to EoR.", fail: "No procedure — risk of stale labels after vendor adjusts settings.", method: "doc", subph: "L2.00c", crit: true }
        ]
      },
      {
        title: "L2.00d — Energization Plan",
        items: [
          { title: "Energization Plan Document Issued", criteria: "Step-by-step sequence-of-energization document covering utility through every downstream bus. Issued by EoR / CxA / GC, distributed to all stakeholders.", pass: "Plan on file; step-by-step sequence with hold points.", fail: "No documented plan or stakeholders not aware.", method: "doc", subph: "L2.00d", crit: true, energ: true },
          { title: "Permission-to-Energize (PtoE) Form Process", criteria: "PtoE form template defined with signoff blocks for: GC, EC, NETA contractor, vendor FSE, CxA, owner. PtoE references all PFCs that must be complete before each energization step.", pass: "PtoE process documented; form template ready.", fail: "No formal PtoE process.", method: "doc", subph: "L2.00d", crit: true, energ: true },
          { title: "Hold-Point Identification", criteria: "Critical hold points identified where vendor witness, CxA witness, or owner witness is required before proceeding (e.g., first MV transformer energization, first UPS battery release, first generator start).", pass: "Hold points marked in energization plan; witness assignments confirmed.", fail: "No hold points identified — risk of unwitnessed first-energizations.", method: "doc", subph: "L2.00d", crit: true },
          { title: "De-Energization / Emergency Shutdown Plan", criteria: "Reverse-sequence de-energization plan documented for the case where rapid shutdown is required during commissioning (fault, fire, vendor abort).", pass: "Documented and crew briefed.", fail: "No plan — crew won't know order if something goes wrong.", method: "doc", subph: "L2.00d" }
        ]
      },
      {
        title: "L2.00e — Relay Settings & Setpoint Files",
        items: [
          { title: "Relay Setting Files Issued (Per-Relay)", criteria: "EoR issues per-relay setting file (e.g. SEL .cev/.set, GE Multilin .urs, ABB .pcm) for every protective relay on the project, derived from coordination study.", pass: "Setting file issued for every relay on the project; revision controlled.", fail: "Missing files for any relay.", method: "doc", subph: "L2.00e", crit: true, energ: true },
          { title: "Vendor FSE Loads Settings (L2.05b Activity)", criteria: "Vendor FSE loads issued setting files into each relay during L2.05b. NETA contractor (or vendor) verifies as-loaded against issued file before L3 energization.", pass: "All relays loaded and verified.", fail: "Settings not loaded or mismatched.", method: "func", subph: "L2.00e", crit: true, energ: true },
          { title: "As-Loaded Settings Captured & Stored", criteria: "As-loaded settings captured back from each relay (post-load) and stored as record copy. Used for restore in case of relay replacement.", pass: "Backup captured and stored (e.g., on project drive, EPMS).", fail: "No backup — full restudy required if relay fails.", method: "doc", subph: "L2.00e", crit: true }
        ]
      },
      {
        title: "L2.00f — Other Pre-Energization Studies (As Applicable)",
        items: [
          { title: "Grounding System Study", criteria: "If specified, grounding study (touch/step potential, ground grid resistance, soil resistivity) submitted by EoR.", pass: "Study on file.", fail: "Missing if specified.", method: "doc", subph: "L2.00f", ref: "IEEE 81 / IEEE 80" },
          { title: "Harmonic Analysis", criteria: "If specified (large VFD loads, large rectifier loads), harmonic analysis submitted with mitigation if needed.", pass: "Analysis on file; THD predictions ≤ IEEE 519.", fail: "Missing if specified or THD exceeds IEEE 519.", method: "doc", subph: "L2.00f", ref: "IEEE 519" },
          { title: "Load Flow Study", criteria: "Steady-state load flow study confirming voltage drop ≤ 3% (feeder) and 5% (total) per NEC 215.2 informational note.", pass: "Study on file; voltage drops within limits.", fail: "Voltage drop exceeds limits or no study.", method: "doc", subph: "L2.00f", ref: "NEC 215.2 / IEEE 141" }
        ]
      }
    ]
  }
},

// Get rich checklist for asset (returns LEVEL → asset data with groups+items)
function getRichChecklist(asset) {
  if (!asset) return null;
  const type = getAssetType(asset);
  const testName = ASSET_TYPE_TO_TEST_NAME[type];
  if (!testName) return null;
  const out = {};
  for (const lvl of ['L1','L2','L3','L4','L5']) {
    if (TESTS[lvl] && TESTS[lvl][testName]) out[lvl] = TESTS[lvl][testName];
  }
  return Object.keys(out).length ? out : null;
}

const CHECKLIST_RESPONSES = {};

// Stage progression
const STAGE_ORDER = ['NOT_RECEIVED','ON_SITE','INSTALLED','PRE_ENERG','ENERGIZED','COMMISSIONED'];

// Get the asset type code from an asset (e.g. UPS-04 → UPS)
function getAssetType(asset) {
  if (!asset) return null;
  const id = asset.id || '';
  // Match prefix before the dash, but handle MV-SWG (multi-segment)
  if (id.startsWith('MV-SWG')) return 'MV-SWG';
  if (id.startsWith('LV-SWG')) return 'LV-SWG';
  const m = id.match(/^([A-Z]+)-/);
  return m ? m[1] : null;
}

function getChecklistTemplate(asset) {
  const type = getAssetType(asset);
  if (!type) return null;
  return CHECKLIST_TEMPLATES[type] || null;
}

// Status of a checklist for an asset+phase
// Returns: { totalItems, completed, passed, failed, status: 'not_started'|'in_progress'|'complete'|'failed' }
function checklistStatus(assetId, phaseKey) {
  const tpl = getChecklistTemplate(EQUIPMENT.find(e => e.id === assetId));
  if (!tpl || !tpl.phases[phaseKey]) return { totalItems:0, completed:0, passed:0, failed:0, status:'na' };
  const items = tpl.phases[phaseKey].items;
  let passed = 0, failed = 0, completed = 0;
  for (let i = 0; i < items.length; i++) {
    const r = CHECKLIST_RESPONSES[`${assetId}|${phaseKey}|${i}`];
    if (r) {
      completed++;
      if (r.status === 'pass') passed++;
      else if (r.status === 'fail') failed++;
    }
  }
  let status = 'not_started';
  if (failed > 0) status = 'failed';
  else if (completed === items.length) status = 'complete';
  else if (completed > 0) status = 'in_progress';
  return { totalItems: items.length, completed, passed, failed, status };
}

// Test if asset has the required test result for a given test name
function hasTestForAsset(assetId, testName) {
  return TEST_RESULTS.some(t => t.asset === assetId && t.test === testName && t.pass);
}

// Can the asset advance to target phase? Returns { ok, blocking: [{type, item, why}] }
function canAdvanceToPhase(assetId, targetPhase) {
  const asset = EQUIPMENT.find(e => e.id === assetId);
  if (!asset) return { ok:false, blocking:[{type:'asset', item:'Asset not found', why:''}] };
  const type = getAssetType(asset);
  const prereqs = PHASE_PREREQS[type] && PHASE_PREREQS[type][targetPhase];
  if (!prereqs) return { ok:true, blocking:[], desc:'No phase prerequisites defined.' };

  const blocking = [];
  // Check checklists
  for (const phase of prereqs.checklists) {
    const cs = checklistStatus(assetId, phase);
    if (cs.status !== 'complete') {
      blocking.push({ type:'checklist', item:phase, why: cs.status === 'not_started' ? 'not started' : cs.status === 'failed' ? `${cs.failed} failures` : `${cs.completed}/${cs.totalItems} done` });
    }
  }
  // Check tests
  for (const test of prereqs.tests) {
    if (!hasTestForAsset(assetId, test)) {
      blocking.push({ type:'test', item:test, why:'no passing test on file' });
    }
  }
  // Check conditions (informational - require user attestation)
  for (const cond of prereqs.conditions) {
    blocking.push({ type:'condition', item:cond, why:'requires confirmation', isAttestation: true });
  }

  return { ok: blocking.filter(b => !b.isAttestation).length === 0, blocking, desc: prereqs.desc };
}

function renderSubmittalReview(review) {
  const reviewer = PERSONAS[review.reviewer];
  const stateMap = { approved:'green', under_review:'amber', revise_resubmit:'red', rejected:'red' };
  const stateClass = stateMap[review.reviewState] || 'gray';
  const stateLabel = review.reviewState.replace(/_/g, ' ');
  const reviewerName = reviewer ? reviewer.name : '';
  const reviewerBit = reviewer ? ' · by <b>' + esc(reviewerName) + '</b>' + (review.reviewedDate ? ' · ' + esc(review.reviewedDate) : '') : '';
  const commentsBit = review.comments ? '<div style="margin-top:4px; color:var(--text-soft); font-style:italic">' + esc(review.comments) + '</div>' : '';
  return '<div style="margin-top:8px; padding:8px 10px; background:var(--bg-soft); border-radius:6px; font-size:12px; line-height:1.5">' +
    '<b style="font-size:10px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted)">REVIEW:</b> ' +
    '<span class="status-badge ' + stateClass + '" style="margin-left:6px">' + esc(stateLabel) + '</span>' +
    reviewerBit + commentsBit +
    '</div>';
}

// Visibility check — can `me` see this post?
// Driven by the post's workflow state.
function canSeePost(post) {
  if (!post) return false;
  const author = PERSONAS[post.author];
  if (!author) return false;
  const myCo = me().company;
  const authorCo = author.company;

  // Always see your own posts
  if (post.author === state.personaId) return true;

  // Published: anyone on the project sees it
  if (post.state === 'published') return true;

  // Internal: same company only
  if (post.state === 'internal') return authorCo === myCo;

  // Pending GC review: author's company sees it (their submission) + GC company sees it (their queue)
  if (post.state === 'pending_review') {
    return authorCo === myCo || isGCCompany(myCo);
  }

  // Rejected: author's company only — they get the feedback to revise
  if (post.state === 'rejected') return authorCo === myCo;

  // Direct: author's company + recipient company
  if (post.state === 'direct') {
    return authorCo === myCo || post.toCompany === myCo;
  }

  // Private: only the author (handled above)
  return false;
}

// Is this company the project's GC?
function isGCCompany(coId) {
  const co = COMPANIES[coId];
  return !!(co && co.type === 'gc');
}

// Can the current persona approve a pending submission?
// Only GC PM (or GC Super) at the GC company can approve.
function canApprovePost() {
  return isGCCompany(me().company) && ['gc_pm','gc_super'].includes(me().lens);
}

// How many pending posts are awaiting THIS user's attention?
function pendingReviewCount() {
  return POSTS.filter(p => p.state === 'pending_review' && canSeePost(p)).length;
}

// Renders a sidebar section only if it has at least one accessible item.
// `items` is an array of HTML strings (from navItem). Empty strings = filtered out by canSee.
function sidebarSection(label, items, opts) {
  const visible = items.filter(html => html && html.length > 0);
  if (visible.length === 0) return '';
  const highlight = opts && opts.highlight;
  return `<div class="side-section">
    <div class="label" style="${highlight ? 'color:var(--brand)' : ''}">${label.startsWith('<') ? label : esc(label)}</div>
    ${visible.join('')}
  </div>`;
}

function canSee(viewId) {
  const access = VIEW_ACCESS[viewId];
  if (!access) return true; // unknown views default to visible
  if (access.includes('all')) return true;
  const p = me();
  return p && access.includes(p.roleType);
}

function navItem(view, icon, label, badge, badgeStyle) {
  if (!canSee(view)) return ''; // hide entirely if no access
  const active = state.view === view;
  return `<button class="nav-item ${active ? 'active' : ''}" onclick="setView('${view}')">
    <span class="ic">${icon}</span>
    <span>${esc(label)}</span>
    ${badge ? `<span class="badge ${badgeStyle || ''}">${esc(badge)}</span>` : ''}
  </button>`;
}

function renderPost(post, isGCViewer) {
  const author = PERSONAS[post.author];
  const authorCo = author ? COMPANIES[author.company] : null;
  const stateInfo = STATES[post.state] || STATES.published;
  const isAuthor = post.author === state.personaId;
  const isPending = post.state === 'pending_review';
  const isRejected = post.state === 'rejected';

  // GC sees approve/reject UI on pending posts they didn't author
  const showReviewActions = isPending && canApprovePost() && !isAuthor;

  let edge = '';
  if (isPending) edge = 'border-left:4px solid var(--accent)';
  else if (isRejected) edge = 'border-left:4px solid var(--red)';
  else if (post.state === 'published') edge = 'border-left:4px solid var(--green)';
  else if (post.state === 'internal') edge = 'border-left:4px solid var(--purple)';

  let h = `<div class="post" style="${edge}">
    <div class="post-h">
      <div class="post-av">${author ? initials(author.name) : '?'}</div>
      <div class="post-meta">
        <div class="who">${author ? esc(author.name) : 'Unknown'}${post.pinned ? ' <span class="tag amber" style="margin-left:6px">📌 PINNED</span>' : ''}</div>
        <div class="who-sub">${authorCo ? esc(authorCo.name) : ''} · ${author ? esc(author.role) : ''} · ${esc(post.time)} ago</div>
      </div>
      <div class="post-scope">
        <span class="scope-badge ${post.state}">${stateInfo.ico} ${esc(stateInfo.short)}</span>
      </div>
    </div>
    <div class="post-subject">${esc(post.subject)}</div>
    <div class="post-body">${esc(post.body)}</div>`;

  // Workflow timeline
  if (post.timeline && post.timeline.length > 0) {
    h += `<div class="workflow-timeline">`;
    post.timeline.forEach((t, i) => {
      const isLast = i === post.timeline.length - 1;
      h += `<div class="workflow-step ${isLast && !isPending ? 'current' : ''}">
        <span class="ws-ico">${esc(t.ico)}</span>
        <span class="ws-action">${esc(t.action)}</span>
        <span class="ws-who">· ${esc(t.who)}</span>
        <span class="ws-when">${esc(t.when)}</span>
      </div>`;
      if (!isLast || isPending) h += `<div class="workflow-arrow">→</div>`;
    });
    if (isPending) {
      h += `<div class="workflow-step pending-stage">
        <span class="ws-ico">❓</span>
        <span class="ws-action">Awaiting GC decision</span>
      </div>`;
    }
    h += `</div>`;
  }

  // Rejection box (visible to author when rejected)
  if (isRejected) {
    const rejecter = PERSONAS[post.rejectedBy];
    const rejecterCo = rejecter ? COMPANIES[rejecter.company] : null;
    h += `<div class="reject-box">
      <div class="reject-head">
        ❌ Rejected by ${rejecter ? esc(rejecter.name) : 'GC'}${rejecterCo ? ` (${esc(rejecterCo.name)} · ${esc(rejecter.role)})` : ''}
      </div>
      <div class="reject-reason">"${esc(post.rejectionReason || 'No reason given.')}"</div>
      ${isAuthor ? '<div style="margin-top:12px"><button class="btn btn-pri btn-sm" onclick="reviseAndResubmit(\'' + post.id + '\')">✏️ Revise and resubmit</button></div>' : ''}
    </div>`;
  }

  // GC approval actions on pending posts
  if (showReviewActions) {
    h += `<div class="review-actions">
      <div class="review-head">⏳ Decide what to do with this submission</div>
      <div class="review-buttons">
        <button class="btn btn-pri btn-sm" onclick="approvePost('${post.id}')">✅ Approve & publish project-wide</button>
        <button class="btn btn-ghost btn-sm" onclick="editAndPublish('${post.id}')">✏️ Edit and publish</button>
        <button class="btn btn-ghost btn-sm" onclick="openRejectModal('${post.id}')">❌ Reject with feedback</button>
        <button class="btn btn-soft btn-sm" onclick="toast('Comment thread expands here.')">💬 Comment first</button>
      </div>
    </div>`;
  }

  // If submitter views their own pending post — show what's going on
  if (isPending && isAuthor) {
    h += `<div style="margin-top:14px; padding:12px 14px; background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:8px; font-size:12px; color:var(--brand-h); line-height:1.55">
      ⏳ <b>Awaiting GC decision.</b> The HITT team has this in their review queue. They'll approve & broadcast, request edits, or send back with feedback.
    </div>`;
  }

  // Footer
  h += `<div class="post-foot">
    <button onclick="toast('Comment thread expands here.')">💬 ${post.comments || 0} comments</button>
    <button onclick="toast('Reaction added.')">👍 React</button>
    <button onclick="toast('Bookmark saved.')">🔖 Save</button>
    <div class="reactions">
      ${(post.reactions || []).map(([emoji, n]) => `<span class="rxn">${emoji} ${n}</span>`).join('')}
    </div>
  </div>
  </div>`;
  return h;
}

function renderTaskList(tasks, viewer, emptyMsg) {
  if (tasks.length === 0) {
    return `<div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">${esc(emptyMsg)}</div>`;
  }
  // Sort: open/in_progress first, then by priority, then by due date
  const order = { open:0, in_progress:1, blocked:2, done:3 };
  const prioOrder = { urgent:0, high:1, normal:2, low:3 };
  tasks.sort((a,b) => {
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    if (prioOrder[a.priority] !== prioOrder[b.priority]) return prioOrder[a.priority] - prioOrder[b.priority];
    return (a.due || '').localeCompare(b.due || '');
  });
  return tasks.map(t => {
    const creator = PERSONAS[t.createdBy];
    const assignee = PERSONAS[t.assignedTo];
    const stat = TASK_STATUS[t.status];
    const prio = TASK_PRIORITY[t.priority];
    const isOverdue = t.status !== 'done' && t.due && t.due < todayStr();
    const canActOn = t.assignedTo === viewer.id || t.createdBy === viewer.id;
    return `<div class="task-card priority-${esc(t.priority)} status-${esc(t.status)}">
      <div>
        <div class="task-title">${esc(t.title)}</div>
        ${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}
        <div class="task-meta">
          <span>👤 <b>${assignee ? esc(assignee.name.split(' ')[0]) : '?'}</b></span>
          <span>📤 ${creator ? esc(creator.name.split(' ')[0]) : '?'}</span>
          <span>⏱ ${creator ? esc((COMPANIES[creator.company]||{}).code||'') : ''}</span>
          ${t.relatedAsset ? `<span>⚙ <b style="color:var(--brand-h)">${esc(t.relatedAsset)}</b></span>` : ''}
          ${t.completedDate ? `<span>✓ done ${esc(t.completedDate)}</span>` : `<span>📅 created ${esc(t.createdDate)}</span>`}
        </div>
      </div>
      <div style="text-align:right">
        <span class="status-badge ${stat.style}">${esc(stat.label)}</span>
        <div class="task-due ${isOverdue ? 'overdue' : ''}" style="margin-top:6px">${t.due ? 'due ' + esc(t.due) : ''}</div>
        <div style="margin-top:4px"><span class="status-badge ${prio.style}" style="font-size:9px">${esc(prio.label.toUpperCase())}</span></div>
      </div>
      <div class="task-actions">
        ${canActOn && t.status === 'open' ? `<button class="btn btn-soft btn-sm" onclick="event.stopPropagation(); advanceTaskStatus('${esc(t.id)}', 'in_progress')" title="Start working">▶ Start</button>` : ''}
        ${canActOn && t.status === 'in_progress' ? `<button class="btn btn-soft btn-sm" onclick="event.stopPropagation(); advanceTaskStatus('${esc(t.id)}', 'done')" title="Mark done">✓ Done</button>` : ''}
        ${canActOn && t.status !== 'done' ? `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); advanceTaskStatus('${esc(t.id)}', 'blocked')" title="Mark blocked" style="font-size:11px">⊘</button>` : ''}
        ${canActOn && t.status === 'blocked' ? `<button class="btn btn-soft btn-sm" onclick="event.stopPropagation(); advanceTaskStatus('${esc(t.id)}', 'open')" title="Unblock">↻</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function openTaskForm() {
  const me_p = me();
  const co = myCompany();
  const isMgmt = isManagementLens(me_p);
  // Who can I assign to?
  // - Always myself
  // - If management: anyone in my company
  const teammates = Object.values(PERSONAS).filter(p => p.company === co.id && p.id !== me_p.id);
  const canAssignTeam = isMgmt && teammates.length > 0;

  // Default due = today + 3 days
  const today = new Date();
  const dueDefault = new Date(today.getTime() + 3*24*60*60*1000);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const defaultDue = months[dueDefault.getMonth()] + ' ' + String(dueDefault.getDate()).padStart(2,'0');

  showModal(`<div class="modal" style="max-width:580px">

function submitTaskForm() {
  const title = getFormVal('task_title').trim();
  if (!title) { toast('Title is required', 'error'); return; }
  const me_p = me();
  const assignee = getFormVal('task_assignee') || me_p.id;
  // Authorization check: non-management can only assign to self
  if (assignee !== me_p.id && !isManagementLens(me_p)) {
    toast('Only management can assign tasks to others', 'error');
    return;
  }
  const assigneePerson = PERSONAS[assignee];
  // Authorization check: management can only assign within own company
  if (assigneePerson && assigneePerson.company !== me_p.company && assignee !== me_p.id) {
    toast('You can only assign tasks within your own company', 'error');
    return;
  }
  const newTask = {
    id: 'tk-user-' + Date.now(),
    title,
    desc: getFormVal('task_desc').trim(),
    createdBy: me_p.id,
    assignedTo: assignee,
    company: me_p.company,
    priority: getFormVal('task_priority') || 'normal',
    due: getFormVal('task_due') || '',
    status: 'open',
    relatedAsset: getFormVal('task_asset') || '',
    createdDate: todayStr(),
    userCreated: true,
  };
  TASKS.unshift(newTask);
  saveUserData();
  closeModal();
  const target = assignee === me_p.id ? 'yourself' : (assigneePerson ? assigneePerson.name : 'teammate');
  toast(`✓ Task created · assigned to ${target}`, 'success');
  state.view = 'mywork';
  state.myWorkTab = assignee === me_p.id ? 'mine' : 'assigned';
  render();
}

function advanceTaskStatus(taskId, newStatus) {
  const t = TASKS.find(x => x.id === taskId);
  if (!t) return;
  const me_p = me();
  // Auth: only assignee or creator can change status
  if (t.assignedTo !== me_p.id && t.createdBy !== me_p.id) {
    toast('Only the assignee or creator can change task status', 'error');
    return;
  }
  t.status = newStatus;
  t.statusChanged = true;
  if (newStatus === 'done') t.completedDate = todayStr();
  saveUserData();
  toast(`Task: ${t.title.substring(0, 40)} → ${TASK_STATUS[newStatus].label}`, 'success');
  render();
}

        <b>CFCI</b> (Contractor-Furnished, Contractor-Installed): the contractor procures and installs. The OEM/vendor does L2.05b under their warranty obligations.<br><br>
        Most UPS, generators, and switchgear are CFCI on hyperscale builds — so the OEM (Delta, CAT, ABB) does L2.05b. Some large breakers and transformers are OFCI — trade does L2.05b.
      </div>
    </div>

    <div style="margin-top:18px; padding:16px 18px; background:var(--bg-soft); border-radius:10px">
      <div class="kicker" style="margin-bottom:10px">Pigtail rule (load bank)</div>
      <div style="font-size:13px; color:var(--text-soft); line-height:1.65">
        Load bank pigtails can be attached <b>any time during L2</b> while the asset is cold. <b>They MUST be staged before L3 energization.</b> Once an asset is energized at L3, it is <b>never</b> de-energized to attach pigtails. The L4 load bank then runs immediately after L3.06 (vendor PFC) without needing to power-cycle. Applies to UPS, GEN, ATS, STS, MV-LV switchgear, and PDU.
      </div>
    </div>
  </div>`;
}

function openComposeModal(prefill) {
  closeDropdown();

    subject: prefill?.subject || '',

  // Default state: GC starts on "publish direct"; everyone else starts on "submit to GC"

  let h = `<div class="modal lg">
    <div class="modal-h">
      <div>
        <h2>📢 New post</h2>
        <div class="sub">Posting as <b>${esc(p.name)}</b> · ${esc(co.name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-b">
      <label class="lbl">Where should this go? <span class="req">*</span></label>
      <div class="workflow-options" id="wf-opts">

        <div class="wf-option ${state.composeData.state === 'internal' ? 'selected' : ''}" data-wfstate="internal">
          <div class="wf-ic" style="background:var(--purple-soft); color:#5b21b6">🏢</div>
          <div class="wf-body">
            <div class="wf-name">My company internal</div>
            <div class="wf-desc">Stays inside <b>${esc(co.name)}</b>. Not seen by any other company. Use for internal coordination, rotation, labor planning.</div>
          </div>
          <div class="wf-radio"></div>
        </div>

        <div class="wf-option ${state.composeData.state === 'pending_review' ? 'selected' : ''}" data-wfstate="pending_review">
          <div class="wf-ic" style="background:var(--accent-soft); color:#92400e">⏳</div>
          <div class="wf-body">
            <div class="wf-name">Submit to GC for project-wide review <span class="tag amber" style="margin-left:6px">RECOMMENDED</span></div>
            <div class="wf-desc">Goes to <b>HITT (GC PM)</b> for review. They review internally and publish to all companies on this project if approved. Track status in the "Pending GC review" tab.</div>
          </div>
          <div class="wf-radio"></div>
        </div>
        ` : `
        <div class="wf-option ${state.composeData.state === 'published' ? 'selected' : ''}" data-wfstate="published">
          <div class="wf-ic" style="background:var(--green-soft); color:#166534">📢</div>
          <div class="wf-body">
            <div class="wf-name">Publish project-wide directly <span class="tag green" style="margin-left:6px">GC POWER</span></div>
            <div class="wf-desc">Broadcast immediately to <b>all companies on ${esc(proj().code)}</b>. As GC PM, you can skip the review queue.</div>
          </div>
          <div class="wf-radio"></div>
        </div>
        `}

        <div class="wf-option ${state.composeData.state === 'direct' ? 'selected' : ''}" data-wfstate="direct">
          <div class="wf-ic" style="background:var(--teal-soft); color:#0f766e">🤝</div>
          <div class="wf-body">
            <div class="wf-name">Direct message to specific company</div>
            <div class="wf-desc">Private message to one other company. Only ${esc(co.name)} and the recipient see it.</div>
            <select class="inp" id="wf-tocompany" style="margin-top:8px; max-width:280px" onchange="state.composeData.toCompany = this.value">
              <option value="">— Pick a company —</option>
              ${Object.values(COMPANIES).filter(c => c.id !== co.id).map(c => `<option value="${c.id}">${esc(c.name)} (${esc(c.label)})</option>`).join('')}

function updateComposeButton() {
  const btn = document.getElementById('wf-submit-btn');
  const explainer = document.getElementById('wf-explainer');
  if (!btn) return;
  const s = state.composeData.state;
  const co = myCompany();
  const map = {
    internal:        { btn:'🏢 Save internally',           expl:`This will be saved as an internal post at <b>${esc(co.name)}</b>. Only people at ${esc(co.name)} see it.` },
    pending_review:  { btn:'⏳ Submit to GC',               expl:`This will go to <b>HITT (GC PM)</b> for review. They'll see it in their review queue and decide whether to publish project-wide. Track status from the "Pending GC review" tab.` },
    published:       { btn:'📢 Publish to all companies', expl:`This will broadcast immediately to <b>all companies on ${esc(proj().code)}</b>. As GC PM you skip the review queue.` },
    direct:          { btn:'🤝 Send to company',           expl:`Private message — only the recipient company will see it (plus your team at ${esc(co.name)}).` },
  };
  const info = map[s] || map.pending_review;
  btn.textContent = info.btn;
  if (explainer) explainer.innerHTML = info.expl;
}

function submitPost() {
  const subj = document.getElementById('post-subj').value.trim();
  const body = document.getElementById('post-body').value.trim();
  const s = state.composeData.state;

  if (!subj || !body) { toast('Subject and body are required', 'error'); return; }
  if (s === 'direct' && !state.composeData.toCompany) { toast('Pick a recipient company', 'error'); return; }

  const me_ = me(), myCoName = myCompany().name;
  const newPost = {
    id: 'p' + Date.now(),
    author: state.personaId,
    state: s,
    time: 'just now',
    subject: subj,
    body: body,
    reactions: [],
    comments: 0,
    timeline: [],
  };

  if (s === 'internal') {
    newPost.timeline = [{ ico:'🏢', action:`Posted internal at ${myCoName}`, who:me_.name, when:'just now' }];
  } else if (s === 'pending_review') {
    newPost.submittedBy = state.personaId;
    newPost.timeline = [
      { ico:'📝', action:'Drafted',                     who:`${me_.name} (${myCoName})`, when:'just now' },
      { ico:'📤', action:'Submitted to GC for review',  who:`${me_.name} (${myCoName})`, when:'just now' },
    ];
  } else if (s === 'published') {
    newPost.publishedBy = state.personaId;
    newPost.reviewedBy = state.personaId;
    newPost.timeline = [
      { ico:'📝', action:'Drafted by GC PM',            who:`${me_.name} (${myCoName})`, when:'just now' },
      { ico:'📢', action:'Published direct to project', who:`${me_.name} (${myCoName})`, when:'just now' },
    ];
  } else if (s === 'direct') {
    newPost.toCompany = state.composeData.toCompany;
    const toName = COMPANIES[newPost.toCompany].name;
    newPost.timeline = [{ ico:'🤝', action:`Sent direct to ${toName}`, who:me_.name, when:'just now' }];
  }

  POSTS.unshift(newPost);
  closeModal();
  state.view = 'announcements';
  state.postScope = (s === 'pending_review') ? 'pending' : (s === 'internal' ? 'internal' : (s === 'published' ? 'published' : 'all'));

  const successMsg = {
    internal:       `Posted internally at ${myCoName}. Only your team sees it.`,
    pending_review: `Submitted to GC. They'll review and publish if approved.`,
    published:      `Broadcast to all companies on ${proj().code}.`,
    direct:         `Sent to ${COMPANIES[newPost.toCompany || ''].name}.`,
  };
  toast(successMsg[s] || 'Posted', 'success');
  render();
}

// GC REVIEW ACTIONS — approve, reject, edit
// ════════════════════════════════════════════════════════════════════════

function approvePost(postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  const me_ = me(), myCoName = myCompany().name;
  post.state = 'published';
  post.reviewedBy = state.personaId;
  post.publishedBy = state.personaId;
  post.timeline = post.timeline || [];
  post.timeline.push(
    { ico:'✅', action:'Approved by GC PM',       who:`${me_.name} (${myCoName})`, when:'just now' },
    { ico:'📢', action:'Published project-wide',  who:`${me_.name} (${myCoName})`, when:'just now' },
  );
  toast(`Approved & broadcast to all companies on ${proj().code}`, 'success');
  render();
}

function openRejectModal(postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  showModal(`<div class="modal">
    <div class="modal-h">
      <div>
        <h2>❌ Reject with feedback</h2>
        <div class="sub">The author will see your feedback and can revise & resubmit.</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-b">
      <div style="background:var(--bg-soft); padding:12px; border-radius:8px; margin-bottom:14px">
        <div style="font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:0.04em; text-transform:uppercase">Original submission</div>
        <div style="font-weight:600; font-size:14px; margin-top:4px">${esc(post.subject)}</div>
        <div style="font-size:12px; color:var(--text-soft); margin-top:4px; max-height:80px; overflow:hidden">${esc(post.body)}</div>
      </div>
      <label class="lbl">Reason for rejection <span class="req">*</span></label>
      <textarea class="inp" id="reject-reason" rows="4" placeholder="Explain why and what they should change..."></textarea>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-pri" style="background:var(--red)" onclick="confirmReject('${postId}')">❌ Reject & send back</button>
    </div>
  </div>`);
}

function confirmReject(postId) {
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) { toast('Reason is required', 'error'); return; }
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  const me_ = me(), myCoName = myCompany().name;
  post.state = 'rejected';
  post.rejectedBy = state.personaId;
  post.rejectedAt = 'just now';
  post.rejectionReason = reason;
  post.timeline = post.timeline || [];
  post.timeline.push({ ico:'❌', action:'Rejected by GC PM', who:`${me_.name} (${myCoName})`, when:'just now' });
  closeModal();
  toast('Sent back to author with feedback', 'warn');
  render();
}

function editAndPublish(postId) {
  toast('Edit-before-publish opens here. (For demo: approves as-is.)', 'warn');
  approvePost(postId);
}

function reviseAndResubmit(postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  openComposeModal({ state:'pending_review', subject:post.subject, body:post.body });
}

// ─── Simulator ───
function renderSimulator() {
  const idx = state.simulatorStep || 0;
  const total = SIMULATOR_STEPS.length;

  if (idx >= total) {
    return `<div class="page">
      ${pageH('Simulator complete', `You walked a UPS through a full commissioning lifecycle. 🎉`)}
      <div class="card" style="padding:48px; text-align:center">
        <div style="font-size:64px; margin-bottom:14px">🎓</div>
        <div style="font-size:22px; font-weight:700; margin-bottom:10px">Congratulations</div>
        <div style="font-size:14px; color:var(--text-soft); max-width:520px; margin:0 auto 24px; line-height:1.65">You now understand how an asset moves through the full commissioning lifecycle. Each phase has specific owners, the sub-phases of L2 happen in a specific order with some running in parallel, and the GC orchestrates the handoffs.</div>
        <div style="display:flex; gap:8px; justify-content:center">
          <button class="btn btn-ghost" onclick="state.simulatorStep=0; state.simulatorPicked=undefined; render()">↻ Restart</button>
          <button class="btn btn-soft" onclick="setView('flow')">🔀 View flow diagram</button>
          <button class="btn btn-pri" onclick="setView('phaseref')">📋 Open phase reference</button>
        </div>
      </div>
    </div>`;
  }

  const step = SIMULATOR_STEPS[idx];
  const picked = state.simulatorPicked;
  const showFeedback = picked !== undefined;

  return `<div class="page">
    ${pageH(`Commissioning simulator · Step ${idx + 1} of ${total}`, `Walk a UPS through a full commissioning lifecycle. Pick what should happen next.`,
      `<button class="btn btn-ghost btn-sm" onclick="state.simulatorStep=0; state.simulatorPicked=undefined; render()">↻ Restart</button>`)}

    <div class="bar" style="margin-bottom:22px; height:8px"><div class="brand" style="width:${((idx+1)/total)*100}%"></div></div>

    <div class="card" style="margin-bottom:18px; border-left:4px solid var(--brand)">
      <div class="card-b">
        <div class="kicker">Scenario</div>
        <div style="font-size:15px; line-height:1.7; margin-top:8px; color:var(--text)">${esc(step.setup)}</div>
      </div>
    </div>

    <div class="kicker" style="margin-bottom:10px">What happens next?</div>
    ${step.options.map((opt, i) => {
      const isPicked = picked === i;
      const cls = showFeedback ? (opt.correct ? 'correct' : isPicked ? 'incorrect' : '') : '';
      const inner = `<div class="sim-option ${cls}" ${showFeedback ? '' : `onclick="simPick(${i})"`}>
        <div class="sim-radio">${showFeedback ? (opt.correct ? '✓' : isPicked ? '✗' : (i+1)) : (i+1)}</div>
        <div class="sim-body">
          <div class="sim-text">${esc(opt.text)}</div>
          ${showFeedback ? `<div class="sim-feedback">${esc(opt.feedback)}</div>` : ''}
        </div>
      </div>`;
      return inner;
    }).join('')}

    ${showFeedback ? `
      <div style="display:flex; justify-content:flex-end; margin-top:18px; gap:8px">
        <button class="btn btn-pri" onclick="simNext()">${idx + 1 >= total ? 'Finish' : 'Next step →'}</button>
      </div>
    ` : ''}
  </div>`;
}

function simPick(optIdx) {
  state.simulatorPicked = optIdx;
  render();
}
function simNext() {
  state.simulatorStep = (state.simulatorStep || 0) + 1;
  state.simulatorPicked = undefined;
  render();
}

// ─── Chat ───
function renderChat() {
  const co = myCompany();
  const myChannels = CHAT_CHANNELS.filter(ch => {
    if (ch.type === 'project') return true;
    if (ch.type === 'company') return ch.forCo === co.id;
    if (ch.type === 'direct') return ch.pair && (ch.pair[0] === co.id || ch.pair[1] === co.id);
    return false;
  });

  if (!myChannels.find(c => c.id === state.chatChannelId)) {
    state.chatChannelId = myChannels[0]?.id;
  }
  const activeId = state.chatChannelId;
  const active = myChannels.find(c => c.id === activeId);
  const messages = CHAT_MESSAGES.filter(m => m.ch === activeId);

  // Group channels by type
  const companyChannels = myChannels.filter(c => c.type === 'company');
  const projectChannels = myChannels.filter(c => c.type === 'project');
  const directChannels  = myChannels.filter(c => c.type === 'direct');

  return `<div class="page" style="max-width:1400px">
    ${pageH('Chat', `Real-time messaging. Internal channels stay inside your company; project-wide reaches everyone; direct channels are 1:1 with another company.`)}

        ${companyChannels.length > 0 ? `<div class="chat-section-h">My company</div>${companyChannels.map(ch => `
          <div class="chat-channel ${ch.id === activeId ? 'active' : ''}" onclick="state.chatChannelId='${ch.id}'; render()">
            <div class="chat-channel-name">${esc(ch.name)}</div>
            <div class="chat-channel-desc">${esc(ch.desc)}</div>
          </div>
        `).join('')}` : ''}

        ${projectChannels.length > 0 ? `<div class="chat-section-h">Project-wide</div>${projectChannels.map(ch => `
          <div class="chat-channel ${ch.id === activeId ? 'active' : ''}" onclick="state.chatChannelId='${ch.id}'; render()">
            <div class="chat-channel-name">${esc(ch.name)}</div>
            <div class="chat-channel-desc">${esc(ch.desc)}</div>
          </div>
        `).join('')}` : ''}

        ${directChannels.length > 0 ? `<div class="chat-section-h">Direct (1:1 with company)</div>${directChannels.map(ch => `
          <div class="chat-channel ${ch.id === activeId ? 'active' : ''}" onclick="state.chatChannelId='${ch.id}'; render()">
            <div class="chat-channel-name">${esc(ch.name)}</div>
            <div class="chat-channel-desc">${esc(ch.desc)}</div>
          </div>
        `).join('')}` : ''}
      </div>

      <div class="chat-main">
        ${active ? `
          <div class="chat-h">
            <div>
              <div class="chat-h-name">${esc(active.name)}</div>
              <div class="chat-h-desc">${esc(active.desc)} · ${messages.length} messages</div>
            </div>
            <div style="display:flex; gap:6px">
              <button class="btn btn-soft btn-sm" onclick="toast('Channel members panel opens here.')">👥 Members</button>
              <button class="btn btn-soft btn-sm" onclick="toast('Settings panel opens here.')">⚙</button>
            </div>
          </div>
          <div class="chat-messages">
            ${messages.length === 0 ? '<div style="text-align:center; color:var(--text-muted); padding:24px">No messages yet. Start the conversation below.</div>' : messages.map(m => {
              const author = PERSONAS[m.author];
              const authorCo = author ? COMPANIES[author.company] : null;
              const isMe = m.author === state.personaId;
              return `<div class="chat-msg">
                <div class="chat-msg-av" style="background:${isMe ? 'var(--accent)' : 'var(--brand)'}">${author ? initials(author.name) : '?'}</div>
                <div class="chat-msg-body">
                  <div class="chat-msg-h">
                    <b>${author ? esc(author.name) : '?'}${isMe ? ' (you)' : ''}</b>
                    <span class="chat-msg-co">${authorCo ? esc(authorCo.name) : ''}</span>
                    <span class="chat-msg-time">${esc(m.time)}</span>
                  </div>
                  <div class="chat-msg-text">${esc(m.body)}</div>
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="chat-compose">
            <input type="text" id="chat-input" placeholder="Message ${esc(active.name)}..." class="inp" onkeydown="if(event.key==='Enter') sendChatMessage()" />
            <button class="btn btn-pri" onclick="sendChatMessage()">Send</button>
          </div>
        ` : '<div style="padding:48px; text-align:center; color:var(--text-muted)">Select a channel to start chatting.</div>'}
      </div>
    </div>
  </div>`;
}

function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input || !input.value.trim()) return;
  const body = input.value.trim();
  CHAT_MESSAGES.push({ ch: state.chatChannelId, author: state.personaId, body, time: 'just now' });
  input.value = '';
  render();
}

// ─── NCR LIST ─── ─────────────────────────────────────────────────────
function renderNCRs() {
  const co = myCompany();
  const isGC = isGCCompany(co.id);
  // Everyone can see all NCRs (transparency for QA/QC); but raise/disposition restricted
  const ncrs = NCRS.slice().sort((a,b) => {
    const order = { raised:0, under_review:1, disposition:2, car_issued:3, closed:4 };
    return order[a.status] - order[b.status];
  });

  const open = ncrs.filter(n => n.status !== 'closed').length;
  const detail = ncrs.find(n => n.id === state.ncrDetailId);

  if (detail) return renderNCRDetail(detail);

  return `<div class="page">
    ${pageH('Non-Conformance Reports (NCR)',

    )}

    <div class="card" style="padding:0; overflow:hidden">
      <div class="ncr-row" style="background:var(--bg-soft); cursor:default; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">
        <div>NCR #</div>
        <div>DESCRIPTION</div>
        <div>SEVERITY</div>
        <div>STATUS</div>
        <div>RAISED</div>
      </div>
      ${ncrs.map(n => {
        const raiser = PERSONAS[n.raisedBy];
        const sev = NCR_SEVERITY_STYLE[n.severity] || 'amber';
        const stat = NCR_STATUS_LABEL[n.status];
        return `<div class="ncr-row" onclick="state.ncrDetailId='${n.id}'; render()">
          <div>

function renderNCRDetail(n) {
  const raiser = PERSONAS[n.raisedBy];
  const raiserCo = raiser ? COMPANIES[raiser.company] : null;
  const stages = ['raised','under_review','disposition','car_issued','closed'];
  const order = { raised:0, under_review:1, disposition:2, car_issued:3, closed:4 };
  const currentStage = order[n.status];

  const stageContent = {
    raised: `<div class="ncr-stage-h">Raised</div><div class="ncr-stage-body"><b>${raiser ? esc(raiser.name) : '?'}</b> (${raiserCo ? esc(raiserCo.name) : ''}) on ${esc(n.date)}<br><br>${esc(n.description)}</div>`,
    under_review: `<div class="ncr-stage-h">Under review</div><div class="ncr-stage-body">${currentStage >= 1 ? 'Routed to responsible party for disposition.' : '— pending —'}</div>`,
    disposition: `<div class="ncr-stage-h">Disposition</div><div class="ncr-stage-body">${n.disposition || '— pending —'}</div>`,
    car_issued: `<div class="ncr-stage-h">CAR issued</div><div class="ncr-stage-body">${n.car || '— no CAR required —'}</div>`,
    closed: `<div class="ncr-stage-h">Closed</div><div class="ncr-stage-body">${n.closedBy ? `Verified closed by <b>${esc((PERSONAS[n.closedBy]||{}).name||'?')}</b> on ${esc(n.closedDate)}` : '— pending verification —'}</div>`,
  };

  return `<div class="page">
    ${pageH(`${n.num} · ${esc(n.asset)}`,
      `<button class="btn btn-soft btn-sm" onclick="state.ncrDetailId=null; render()">← Back to NCR list</button> &nbsp; Severity <span class="sev-badge ${NCR_SEVERITY_STYLE[n.severity] || 'amber'}">${esc(n.severity)}</span>`,
      `${n.status !== 'closed' ? `<button class="btn btn-pri btn-sm" onclick="advanceNCRStatus('${esc(n.id)}')">⏭ Advance status</button>` : ''}`
    )}

    <div class="card">
      <div class="card-b">
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-bottom:18px">
          <div>
            <div class="kicker">Asset / location</div>
            <div style="margin-top:4px"><b class="mono">${esc(n.asset)}</b> · ${esc(n.loc)}</div>
          </div>
          <div>
            <div class="kicker">Status</div>
            <div style="margin-top:4px"><span class="status-badge ${NCR_STATUS_LABEL[n.status].style}">${esc(NCR_STATUS_LABEL[n.status].label)}</span></div>
          </div>
        </div>

        <div class="kicker" style="margin-bottom:8px">Workflow timeline</div>
        <div class="ncr-timeline">
          ${stages.map((s, i) => {
            const cls = i < currentStage ? 'done' : i === currentStage ? 'active' : '';
            return `<div class="ncr-stage ${cls}">
              <div style="flex:1">${stageContent[s]}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

// ─── CERTS WIDGET ─── reused on Team and Safety dashboards
function renderCertsForWorker(workerId) {
  const certs = CERTIFICATIONS.filter(c => c.worker === workerId);
  if (certs.length === 0) return '<span style="font-size:11px; color:var(--text-muted)">No certs on file</span>';
  return certs.map(c => {

    return `<span class="cert-chip ${style}" title="${esc(c.cert)} · expires ${esc(c.expires)}">

}

// ─── HOLD / WITNESS POINTS ───
function renderHoldPoints() {
  const co = myCompany();
  const isGC = isGCCompany(co.id);
  // Filter: GC sees all; everyone else sees points where they're notified party or requestor
  const myCoId = co.id;
  let points = HOLD_POINTS.slice();
  if (!isGC) {
    points = points.filter(hp => hp.notifyCo === myCoId || (PERSONAS[hp.requestor] && PERSONAS[hp.requestor].company === myCoId));
  }
  const open = points.filter(p => p.status !== 'completed').length;

  return `<div class="page">
    ${pageH('Hold & Witness Points',
      `${points.length} points in scope · <b>${open} open</b>. Hold points block work from advancing. Witness points require a party to be present.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Register hold/witness point — form opens here.')">+ Register point</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Hold vs Witness.</b> A <b>hold point</b> stops work until the responsible party signs off (e.g. GC QA/QC must approve L2.06 doc package before L2.07 punch). A <b>witness point</b> requires a party to be physically present (e.g. CxA must witness the L4 load bank, OEM must witness factory acceptance test). Use this register to coordinate timing, send notifications, and capture sign-offs.
    </div>

    ${points.length === 0 ? '<div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">No hold/witness points in scope.</div>' : points.map(hp => {
      const requestor = PERSONAS[hp.requestor];
      const requestorCo = requestor ? COMPANIES[requestor.company] : null;
      const notifyPerson = PERSONAS[hp.notify];
      const notifyCo = COMPANIES[hp.notifyCo];
      const stat = HP_STATUS_STYLE[hp.status];
      const typeClass = hp.type === 'witness' ? 'hp-type-witness' : 'hp-type-hold';
      return `<div class="hp-card">
        <div class="hp-num-block">
          <div class="hp-type-badge ${typeClass}">${esc(hp.type)}</div>
          <div class="hp-num">${esc(hp.num)}</div>
        </div>
        <div class="hp-body">
          <div>
            <span class="hp-asset">${esc(hp.asset)}</span>
            <span class="hp-phase">${esc(hp.phase)}</span>
          </div>
          <div class="hp-desc">${esc(hp.desc)}</div>
          <div class="hp-meta">
            Requested by ${requestor ? esc(requestor.name) : '?'} (${requestorCo ? esc(requestorCo.code) : '?'}) → notify ${notifyPerson ? esc(notifyPerson.name) : '?'} (${notifyCo ? esc(notifyCo.code) : '?'})
          </div>
        </div>
        <div class="hp-actions">
          <span class="status-badge ${stat.style}">${esc(stat.label)}</span>
          <div class="hp-due">DUE ${esc(hp.dueDate)}</div>
          ${hp.actualDate ? `<div style="font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace">DONE ${esc(hp.actualDate)}</div>` : ''}
          ${hp.status === 'pending' ? `<button class="btn btn-pri btn-sm" onclick="toast('Notification sent to ${esc((notifyPerson||{}).name||'recipient')}.')">📨 Notify</button>` : ''}
          ${hp.status === 'notified' ? `<button class="btn btn-soft btn-sm" onclick="toast('Mark as completed — confirmation form opens here.')">✓ Mark complete</button>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ─── PUNCH LIST ───
function renderPunchList() {
  const tab = state.punchTab || 'all';
  let items = PUNCH_ITEMS.slice();
  if (tab === 'open')        items = items.filter(p => p.status === 'open');
  if (tab === 'in_progress') items = items.filter(p => p.status === 'in_progress');
  if (tab === 'closed')      items = items.filter(p => p.status === 'closed');

  const totalOpen = PUNCH_ITEMS.filter(p => p.status === 'open').length;
  const totalIP   = PUNCH_ITEMS.filter(p => p.status === 'in_progress').length;
  const totalCl   = PUNCH_ITEMS.filter(p => p.status === 'closed').length;

  return `<div class="page">
    ${pageH('Punch list',
      `${PUNCH_ITEMS.length} items · ${totalOpen} open · ${totalIP} in progress · ${totalCl} closed.`,
      `<button class="btn btn-pri btn-sm" onclick="openPunchForm()">+ Raise punch item</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Punch list</b> tracks the discrete deficiencies discovered during walks (CxA L2.07, NETA tests, GC QA/QC clean walks). Each item assigned to a responsible party. Major severity items can block phase progression; minor items go on a closeout list.

    <div class="tabs">
      <div class="tab ${tab === 'all'         ? 'active' : ''}" onclick="state.punchTab='all'; render()">All <span class="count">${PUNCH_ITEMS.length}</span></div>

        <div>DESCRIPTION</div>
        <div>SEVERITY</div>

          <div>
            <div class="punch-num">${esc(p.num)}</div>
            <div style="font-size:10px; color:var(--text-muted); margin-top:2px; font-family:'JetBrains Mono',monospace">${esc(p.raisedDate)}</div>
          </div>
          <div>
            <div class="punch-asset">${esc(p.asset)}</div>
            <div class="punch-loc">${esc(p.loc)}</div>
          </div>
          <div class="punch-desc">${esc(p.desc)}</div>
          <div><span class="sev-badge ${sev}">${esc(p.severity)}</span></div>
          <div>${assignedCo ? `<span class="tag ${esc(assignedCo.tag)}">${esc(assignedCo.code)}</span>` : esc(p.assignedTo)}</div>

// ─── LONG-LEAD TRACKER ───
function renderLongLead() {
  const stages = LL_STAGES;
  const stageIdx = id => stages.findIndex(s => s.id === id);

  const totalCost = LONG_LEAD.length;
  const installed = LONG_LEAD.filter(l => l.stage === 'installed').length;
  const inFlight  = LONG_LEAD.filter(l => l.stage !== 'installed' && l.stage !== 'po_issued').length;
  const onOrder   = LONG_LEAD.filter(l => l.stage === 'po_issued' || l.stage === 'submittal_pending').length;

  return `<div class="page">
    ${pageH('Long-Lead Equipment',
      `${LONG_LEAD.length} items tracked · ${installed} installed · ${inFlight} in flight · ${onOrder} on order. Lifecycle: PO → Submittal → Fab → Ship → On Site → Installed.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Add long-lead item form opens here.')">+ Add item</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Long-lead tracking.</b> Items with 8+ week lead times need their own lifecycle visibility. Each item moves through 8 stages. <b>OFCI</b> (Owner-Furnished, Contractor-Installed) items are owner-purchased and free-issued to the GC. <b>CFCI</b> are GC-procured. Track expected vs actual dates at each stage to catch slips early.
    </div>

    ${LONG_LEAD.map(ll => {
      const supplier = COMPANIES[ll.supplier];
      const currentIdx = stageIdx(ll.stage);
      const pct = stages[currentIdx]?.pct || 0;
      return `<div class="ll-card">
        <div class="ll-header">
          <div style="flex:1; min-width:240px">
            <div class="ll-item-name">${esc(ll.item)}</div>
            <div class="ll-meta">
              ${supplier ? `<span class="tag ${esc(supplier.tag)}">${esc(supplier.name)}</span>` : esc(ll.supplier)}
              · target: <b class="mono">${esc(ll.target)}</b>
              · ${ll.leadWeeks}wk lead
              · ${ll.ofci ? '<span class="tag amber">OFCI</span>' : '<span class="tag gray">CFCI</span>'}
            </div>
          </div>
          <div class="ll-cost">${esc(ll.cost)}</div>
        </div>

        <div class="ll-progress-bar">
          <div class="ll-progress-fill" style="width:${pct}%"></div>
        </div>

        <div class="ll-stages-row">
          ${stages.map((s, i) => {
            const cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
            return `<div class="ll-stage-dot ${cls}">
              <div class="dot"></div>
              <span class="lbl">${esc(s.label)}</span>
            </div>`;
          }).join('')}
        </div>

        <div class="ll-detail-grid">
          ${ll.poDate ?       `<div class="ll-detail-cell"><div class="lbl">PO Date</div><div class="val">${esc(ll.poDate)}</div></div>` : ''}
          ${ll.submittal ?    `<div class="ll-detail-cell"><div class="lbl">Submittal</div><div class="val">${esc(ll.submittal)}</div></div>` : ''}
          ${ll.fabRelease ?   `<div class="ll-detail-cell"><div class="lbl">Fab Release</div><div class="val">${esc(ll.fabRelease)}</div></div>` : ''}
          ${ll.shipped ?      `<div class="ll-detail-cell"><div class="lbl">Shipped</div><div class="val">${esc(ll.shipped)}</div></div>` : ''}
          ${ll.arrived ?      `<div class="ll-detail-cell"><div class="lbl">Arrived</div><div class="val">${esc(ll.arrived)}</div></div>` : ''}
          ${ll.installed ?    `<div class="ll-detail-cell"><div class="lbl">Installed</div><div class="val">${esc(ll.installed)}</div></div>` : ''}
          ${ll.expectedShip ? `<div class="ll-detail-cell"><div class="lbl" style="color:var(--accent)">Exp. Ship</div><div class="val" style="color:#92400e">${esc(ll.expectedShip)}</div></div>` : ''}
          ${ll.expectedArrival ? `<div class="ll-detail-cell"><div class="lbl" style="color:var(--accent)">Exp. Arrival</div><div class="val" style="color:#92400e">${esc(ll.expectedArrival)}</div></div>` : ''}
        </div>
      </div>`;
    }).join('')}

// ─── CREW DISPATCH ───
function renderCrewDispatch() {
  const co = myCompany();
  const isGC = isGCCompany(co.id);
  // Filter to today (May 06)
  const today = CREW_ASSIGNMENTS.filter(c => c.date === 'May 06');
  // Group by company, but if not GC, only show your company
  const byCompany = {};
  today.forEach(c => {
    if (!isGC && c.company !== co.id) return;
    if (!byCompany[c.company]) byCompany[c.company] = [];
    byCompany[c.company].push(c);
  });
  const companies = Object.keys(byCompany);
  const totalAssigned = Object.values(byCompany).flat().length;
  const onSite = Object.values(byCompany).flat().filter(c => c.status === 'on_site').length;

  return `<div class="page">
    ${pageH('Crew dispatch · Today (May 06)',
      isGC
        ? `Project-wide crew assignments. ${totalAssigned} workers across ${companies.length} companies. ${onSite} on site.`
        : `${esc(co.name)} crew assignments today. ${totalAssigned} workers · ${onSite} on site.`,
      `<button class="btn btn-pri btn-sm" onclick="toast('Assign worker — drag-and-drop dispatcher opens here.')">+ Assign worker</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:18px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Crew dispatch.</b> Foremen and superintendents assign specific workers to specific tasks each morning. This view shows who's working on what today. Each company manages their own crew; the GC sees the consolidated picture.
    </div>

    ${companies.length === 0 ? '<div class="card" style="padding:36px; text-align:center; color:var(--text-muted)">No crew assignments today.</div>' : companies.map(coId => {
      const c = COMPANIES[coId];

      return `<div class="crew-co-block">

// ─── TEST RESULTS ───
function renderTestResults() {
  const tab = state.testTab || 'all';
  let results = TEST_RESULTS.slice();

  // Available filters: all, fail (only failures), or per-asset
  const assets = [...new Set(TEST_RESULTS.map(t => t.asset))];
  if (tab === 'fail') results = results.filter(t => !t.pass);
  else if (assets.includes(tab)) results = results.filter(t => t.asset === tab);

  const totalPass = TEST_RESULTS.filter(t => t.pass).length;
  const totalFail = TEST_RESULTS.filter(t => !t.pass).length;

  return `<div class="page">
    ${pageH('Test results database',
      `${TEST_RESULTS.length} tests on file · <b style="color:var(--green)">${totalPass} pass</b> · <b style="color:var(--red)">${totalFail} fail</b>. NETA acceptance + maintenance test data per device.`,
      `<button class="btn btn-pri btn-sm" onclick="openTestForm()">+ Log test result</button>`
    )}

    <div style="background:var(--brand-fade); border:1px solid var(--brand-soft); border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:13px; color:var(--brand-h); line-height:1.55">
      💡 <b>Test results database.</b> Per ANSI/NETA ATS-2025, every electrical asset gets acceptance testing before energization. Insulation Resistance, Power Factor, Contact Resistance, Hi-Pot, Torque values logged per phase. Failed tests automatically link to NCRs.
    </div>

    <div class="tabs">
      <div class="tab ${tab === 'all'  ? 'active' : ''}" onclick="state.testTab='all'; render()">All <span class="count">${TEST_RESULTS.length}</span></div>
      <div class="tab ${tab === 'fail' ? 'active' : ''}" onclick="state.testTab='fail'; render()">❌ Failures <span class="count">${totalFail}</span></div>
      ${assets.map(a => `<div class="tab ${tab === a ? 'active' : ''}" onclick="state.testTab='${a}'; render()">${esc(a)} <span class="count">${TEST_RESULTS.filter(t => t.asset === a).length}</span></div>`).join('')}
    </div>

    <div class="card" style="padding:0; overflow:hidden">
      <div class="test-row" style="background:var(--bg-soft); cursor:default; font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; letter-spacing:0.05em; color:var(--text-muted); text-transform:uppercase">
        <div>ASSET</div>
        <div>PHASE</div>
        <div>TEST</div>
        <div>VALUE</div>
        <div>THRESHOLD</div>
        <div>RESULT</div>
        <div>DATE / TECH</div>
      </div>
      ${results.length === 0 ? '<div style="padding:36px; text-align:center; color:var(--text-muted)">No test results match this filter.</div>' : results.map(t => {
        const tech = PERSONAS[t.tech];
        const cls = t.pass ? '' : 'fail';
        return `<div class="test-row ${cls}" title="${t.notes ? esc(t.notes) : ''}">
          <div class="test-asset">${esc(t.asset)}</div>
          <div class="test-phase">${esc(t.phase)}</div>
          <div>${esc(t.test)}</div>
          <div class="test-value">${esc(t.value)} <span style="font-size:10px; color:var(--text-muted)">${esc(t.unit)}</span></div>
          <div class="test-thresh">${esc(t.threshold)}</div>
          <div><span class="test-result-pill ${t.pass ? 'pass' : 'fail'}">${t.pass ? 'PASS' : 'FAIL'}</span></div>
          <div>
            <div style="font-family:'JetBrains Mono', monospace; font-size:11px">${esc(t.date)}</div>
            <div style="font-size:10px; color:var(--text-muted)">${tech ? esc(tech.name.split(' ')[0]) : '?'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
